            function buildParams(raw) { return { isManual: raw.is_manual === 'true', trigger: raw.trigger_source, model: raw.model || 'default', markers: raw.markers, filter: raw.filter, iterations: raw.iterations, branch: raw.branch || '', displayBranch: raw.display_branch || '', runUrl: raw.run_url, prNumber: raw.pr_number ? parseInt(raw.pr_number, 10) : null, commentId: raw.comment_id ? parseInt(raw.comment_id, 10) : null, testCount: raw.test_count || '0', testPreview: raw.test_preview || '', duration: raw.duration || 'N/A', validMarkers: raw.valid_markers || '', triggered_by: raw.triggered_by || '' }; }
