          wait-for-ready: 'true'

      - name: Update progress - KIND ready, starting evals
        if: steps.check-tests.outputs.should-run == 'true' && steps.eval-params.outputs.pr_number != '' && steps.initial-comment.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            // SECURITY: Helper functions are inlined to prevent loading from PR checkout
            const AUTO_EVAL_COMMENT_IDENTIFIER = '<!-- holmes-auto-eval-results -->';
            const HISTORY_RUN_END_MARKER = '<!-- END_HISTORY_RUN -->';
            const MAX_COMMENT_SIZE = 60000;
            function parseRunHistory(body) { const runs = []; const historyRegex = /<details>\s*<summary>📜\s*(.+?)<\/summary>\s*([\s\S]*?)<!-- END_HISTORY_RUN -->\s*<\/details>/g; let match; while ((match = historyRegex.exec(body)) !== null) { runs.push({ summary: match[1].trim(), content: match[2].trim() }); } return runs; }
            function buildAutoCommentWithHistory(currentContent, previousRuns, footer, maxHistory = 5) { let body = AUTO_EVAL_COMMENT_IDENTIFIER + '\n'; const runsToShow = previousRuns.slice(0, maxHistory); let historySection = '', addedCount = 0; if (runsToShow.length > 0) { historySection = '## 📂 Previous Runs\n\n'; for (const run of runsToShow) { const historyEntry = `<details>\n<summary>📜 ${run.summary}</summary>\n\n${run.content}\n\n${HISTORY_RUN_END_MARKER}\n</details>\n\n`; const projectedSize = body.length + historySection.length + historyEntry.length + currentContent.length + footer.length; if (projectedSize > MAX_COMMENT_SIZE) { const remaining = runsToShow.length - addedCount; historySection += `<details>\n<summary>⚠️ ${remaining} older run${remaining > 1 ? 's' : ''} truncated</summary>\n\n_Older runs were omitted._\n</details>\n\n`; break; } historySection += historyEntry; addedCount++; } historySection += '---\n\n'; } body += historySection + currentContent + footer; return body; }
            function buildParams(raw) { return { isManual: raw.is_manual === 'true', trigger: raw.trigger_source, model: raw.model || 'default', markers: raw.markers, filter: raw.filter, iterations: raw.iterations, branch: raw.branch || '', displayBranch: raw.display_branch || '', runUrl: raw.run_url, prNumber: raw.pr_number ? parseInt(raw.pr_number, 10) : null, commentId: raw.comment_id ? parseInt(raw.comment_id, 10) : null, testCount: raw.test_count || '0', testPreview: raw.test_preview || '', duration: raw.duration || 'N/A', validMarkers: raw.valid_markers || '', triggered_by: raw.triggered_by || '' }; }
            function renderProgress(steps) { return steps.map(([done, text]) => done ? `- [x] ${text}` : `- [ ] ${text}`).join('\n'); }
            function renderParamsTable(p, ctx = null) { let workflowLinks = `[View logs](${p.runUrl})`; if (ctx) { const baseUrl = `https://github.com/${ctx.repo.owner}/${ctx.repo.repo}/actions/workflows/eval-regression.yaml`; workflowLinks += ` \\| [Rerun](${p.displayBranch ? `${baseUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseUrl})`; } return `| Parameter | Value |\n|-----------|-------|\n| **Triggered via** | ${p.trigger} |\n` + (p.displayBranch ? `| **Branch** | \`${p.displayBranch}\` |\n` : '') + `| **Model** | \`${p.model}\` |\n| **Markers** | \`${p.markers || 'all LLM tests'}\` |\n` + (p.filter ? `| **Filter (-k)** | \`${p.filter}\` |\n` : '') + `| **Iterations** | ${p.iterations} |\n` + (p.duration ? `| **Duration** | ${p.duration} |\n` : '') + `| **Workflow** | ${workflowLinks} |\n`; }
            function buildBody(p, progressSteps, extras = {}) { let body = p.isManual ? `## ${extras.icon || '🚀'} ${extras.title || 'Manual Eval Running...'}\n\n` + renderParamsTable(p, extras.context) : `## ${extras.icon || '⏳'} ${extras.title || 'HolmesGPT evals running...'}\n\nAutomatically triggered by ${p.trigger}\n\n[View workflow logs](${p.runUrl})\n`; if (progressSteps) body += `\n**Progress:**\n${renderProgress(progressSteps)}\n`; if (extras.testPreview) body += `\n<details>\n<summary>📋 Evals to run</summary>\n\n\`\`\`\n${extras.testPreview}\n\`\`\`\n</details>\n`; return body; }
            function formatAsCodes(items) { if (!items) return '_(loading...)_'; return items.split(',').map(item => { const t = item.trim(); return t ? `\`${t}\`` : ''; }).filter(Boolean).join(', '); }
            function buildRerunFooter(p, ctx, options = {}) { const repoFullName = `${ctx.repo.owner}/${ctx.repo.repo}`; const baseWorkflowUrl = `https://github.com/${repoFullName}/actions/workflows/eval-regression.yaml`; const workflowUrl = p.displayBranch ? `${baseWorkflowUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseWorkflowUrl; const ghCommand = p.displayBranch ? `gh workflow run eval-regression.yaml --repo ${repoFullName} --ref ${p.displayBranch} -f markers=regression -f filter=` : `gh workflow run eval-regression.yaml --repo ${repoFullName} -f markers=regression -f filter=`; let footer = ''; if (options.includeLegend) { footer += '\n<details>\n<summary>📖 <b>Legend</b></summary>\n\n| Icon | Meaning |\n|------|--------|\n| ✅ | The test was successful |\n| ➖ | The test was skipped |\n| ⚠️ | The test failed but is known to be flaky or known to fail |\n| 🚧 | The test had a setup failure (not a code regression) |\n| 🔧 | The test failed due to mock data issues (not a code regression) |\n| 🚫 | The test was throttled by API rate limits/overload |\n| ❌ | The test failed and should be fixed before merging the PR |\n</details>\n'; } footer += `\n<details>\n<summary>🔄 <b>Re-run evals manually</b></summary>\n\n> ⚠️ **Warning:** \`/eval\` comments always run using the **workflow from master**, not from this PR branch.\n>\n> **To test workflow changes**, use the GitHub CLI or [Actions UI](${workflowUrl}) instead:\n>\n> \`\`\`\n> ${ghCommand}\n> \`\`\`\n\n---\n\n**Option 1: Comment on this PR** with \`/eval\`:\n\n\`\`\`\n/eval\nmarkers: regression\n\`\`\`\n\n**Quick re-run:** Use \`/rerun\` to re-run the most recent \`/eval\` on this PR with the same parameters.\n\n**Option 2: [Trigger via GitHub Actions UI](${workflowUrl})** → "Run workflow"\n</details>\n\n<details>\n<summary>🏷️ <b>Valid markers</b></summary>\n\n${formatAsCodes(p.validMarkers)}\n</details>\n\n---\n**Commands:** \`/eval\` · \`/rerun\` · \`/list\`\n\n**CLI:** \`${ghCommand}\`\n`; return footer; }
            // END INLINED HELPERS
            const p = buildParams({
              ...JSON.parse(${{ toJSON(steps.eval-params.outputs.base_params) }}),
              comment_id: ${{ toJSON(steps.initial-comment.outputs.comment_id) }},
              test_count: ${{ toJSON(steps.test-preview.outputs.test_count) }},
              test_preview: ${{ toJSON(steps.test-preview.outputs.test_preview) }},
              valid_markers: ${{ toJSON(steps.test-preview.outputs.valid_markers) }}
            });
            const isPersistent = ${{ toJSON(steps.initial-comment.outputs.is_persistent) }} === 'true';
            const progressSteps = [
              [true, 'Setup HolmesGPT environment'],
              [true, `Collect evals to run (${p.testCount} tests)`],
              [true, 'Setup KIND cluster'],
              [false, 'Run evals']
            ];

            let body;
            if (isPersistent) {
              // Preserve history for automated runs
              const existingComment = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: p.commentId
              });
              const previousRuns = parseRunHistory(existingComment.data.body);
              const currentContent = buildBody(p, progressSteps, { testPreview: p.testCount !== '0' ? p.testPreview : null, context });
              const footer = buildRerunFooter(p, context);
              body = buildAutoCommentWithHistory(currentContent, previousRuns, footer);
            } else {
              body = buildBody(p, progressSteps, { testPreview: p.testCount !== '0' ? p.testPreview : null, context }) + buildRerunFooter(p, context);
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: p.commentId,
              body: body
            });

      - name: Run tests
        if: steps.check-tests.outputs.should-run == 'true'
        id: evals
        continue-on-error: true
        shell: bash
        env:
          RUN_LIVE: "true"
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME }}
          MODEL: ${{ steps.eval-params.outputs.model }}
          ITERATIONS: ${{ steps.eval-params.outputs.iterations }}
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL || 'gpt-4o' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          UPLOAD_DATASET: "true"
          EXPERIMENT_ID: github-${{ github.run_id }}.${{ github.run_number }}.${{ github.run_attempt }}
          GENERATE_REGRESSIONS_FILE: "true"
          EVAL_MARKER_EXPR: ${{ steps.eval-params.outputs.marker_expr }}
          EVAL_FILTER: ${{ steps.eval-params.outputs.filter }}
          EVAL_BRANCH: ${{ steps.eval-params.outputs.branch }}
        run: |
          # Unset MODEL if empty so get_models() uses DEFAULT_MODEL
          [[ -z "$MODEL" ]] && unset MODEL

          START_TIME=$(date +%s)

          PYTEST_ARGS=(--no-cov tests/llm/test_ask_holmes.py tests/llm/test_investigate.py -s -n10 -m "$EVAL_MARKER_EXPR")
          [[ -n "$EVAL_FILTER" ]] && PYTEST_ARGS+=(-k "$EVAL_FILTER")
          poetry run pytest "${PYTEST_ARGS[@]}" || true

          DURATION=$(($(date +%s) - START_TIME))
          if [[ $DURATION -ge 3600 ]]; then
            echo "duration=$((DURATION/3600))h $(((DURATION%3600)/60))m $((DURATION%60))s" >> $GITHUB_OUTPUT
          elif [[ $DURATION -ge 60 ]]; then
            echo "duration=$((DURATION/60))m $((DURATION%60))s" >> $GITHUB_OUTPUT
          else
            echo "duration=${DURATION}s" >> $GITHUB_OUTPUT
          fi

      - name: Post evaluation results
        if: always() && steps.eval-params.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // SECURITY: Helper functions are inlined to prevent loading from PR checkout
            const AUTO_EVAL_COMMENT_IDENTIFIER = '<!-- holmes-auto-eval-results -->';
            const HISTORY_RUN_END_MARKER = '<!-- END_HISTORY_RUN -->';
            const MAX_COMMENT_SIZE = 60000;
            function parseRunHistory(body) { const runs = []; const historyRegex = /<details>\s*<summary>📜\s*(.+?)<\/summary>\s*([\s\S]*?)<!-- END_HISTORY_RUN -->\s*<\/details>/g; let match; while ((match = historyRegex.exec(body)) !== null) { runs.push({ summary: match[1].trim(), content: match[2].trim() }); } return runs; }
            function buildAutoCommentWithHistory(currentContent, previousRuns, footer, maxHistory = 5) { let body = AUTO_EVAL_COMMENT_IDENTIFIER + '\n'; const runsToShow = previousRuns.slice(0, maxHistory); let historySection = '', addedCount = 0; if (runsToShow.length > 0) { historySection = '## 📂 Previous Runs\n\n'; for (const run of runsToShow) { const historyEntry = `<details>\n<summary>📜 ${run.summary}</summary>\n\n${run.content}\n\n${HISTORY_RUN_END_MARKER}\n</details>\n\n`; const projectedSize = body.length + historySection.length + historyEntry.length + currentContent.length + footer.length; if (projectedSize > MAX_COMMENT_SIZE) { const remaining = runsToShow.length - addedCount; historySection += `<details>\n<summary>⚠️ ${remaining} older run${remaining > 1 ? 's' : ''} truncated</summary>\n\n_Older runs were omitted._\n</details>\n\n`; break; } historySection += historyEntry; addedCount++; } historySection += '---\n\n'; } body += historySection + currentContent + footer; return body; }
            function buildParams(raw) { return { isManual: raw.is_manual === 'true', trigger: raw.trigger_source, model: raw.model || 'default', markers: raw.markers, filter: raw.filter, iterations: raw.iterations, branch: raw.branch || '', displayBranch: raw.display_branch || '', runUrl: raw.run_url, prNumber: raw.pr_number ? parseInt(raw.pr_number, 10) : null, commentId: raw.comment_id ? parseInt(raw.comment_id, 10) : null, testCount: raw.test_count || '0', testPreview: raw.test_preview || '', duration: raw.duration || 'N/A', validMarkers: raw.valid_markers || '', triggered_by: raw.triggered_by || '' }; }
            function renderProgress(steps) { return steps.map(([done, text]) => done ? `- [x] ${text}` : `- [ ] ${text}`).join('\n'); }
            function renderParamsTable(p, ctx = null) { let workflowLinks = `[View logs](${p.runUrl})`; if (ctx) { const baseUrl = `https://github.com/${ctx.repo.owner}/${ctx.repo.repo}/actions/workflows/eval-regression.yaml`; workflowLinks += ` \\| [Rerun](${p.displayBranch ? `${baseUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseUrl})`; } return `| Parameter | Value |\n|-----------|-------|\n| **Triggered via** | ${p.trigger} |\n` + (p.displayBranch ? `| **Branch** | \`${p.displayBranch}\` |\n` : '') + `| **Model** | \`${p.model}\` |\n| **Markers** | \`${p.markers || 'all LLM tests'}\` |\n` + (p.filter ? `| **Filter (-k)** | \`${p.filter}\` |\n` : '') + `| **Iterations** | ${p.iterations} |\n` + (p.duration ? `| **Duration** | ${p.duration} |\n` : '') + `| **Workflow** | ${workflowLinks} |\n`; }
            function buildBody(p, progressSteps, extras = {}) { let body = p.isManual ? `## ${extras.icon || '🚀'} ${extras.title || 'Manual Eval Running...'}\n\n` + renderParamsTable(p, extras.context) : `## ${extras.icon || '⏳'} ${extras.title || 'HolmesGPT evals running...'}\n\nAutomatically triggered by ${p.trigger}\n\n[View workflow logs](${p.runUrl})\n`; if (progressSteps) body += `\n**Progress:**\n${renderProgress(progressSteps)}\n`; if (extras.testPreview) body += `\n<details>\n<summary>📋 Evals to run</summary>\n\n\`\`\`\n${extras.testPreview}\n\`\`\`\n</details>\n`; return body; }
            function formatAsCodes(items) { if (!items) return '_(loading...)_'; return items.split(',').map(item => { const t = item.trim(); return t ? `\`${t}\`` : ''; }).filter(Boolean).join(', '); }
            function buildRerunFooter(p, ctx, options = {}) { const repoFullName = `${ctx.repo.owner}/${ctx.repo.repo}`; const baseWorkflowUrl = `https://github.com/${repoFullName}/actions/workflows/eval-regression.yaml`; const workflowUrl = p.displayBranch ? `${baseWorkflowUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseWorkflowUrl; const ghCommand = p.displayBranch ? `gh workflow run eval-regression.yaml --repo ${repoFullName} --ref ${p.displayBranch} -f markers=regression -f filter=` : `gh workflow run eval-regression.yaml --repo ${repoFullName} -f markers=regression -f filter=`; let footer = ''; if (options.includeLegend) { footer += '\n<details>\n<summary>📖 <b>Legend</b></summary>\n\n| Icon | Meaning |\n|------|--------|\n| ✅ | The test was successful |\n| ➖ | The test was skipped |\n| ⚠️ | The test failed but is known to be flaky or known to fail |\n| 🚧 | The test had a setup failure (not a code regression) |\n| 🔧 | The test failed due to mock data issues (not a code regression) |\n| 🚫 | The test was throttled by API rate limits/overload |\n| ❌ | The test failed and should be fixed before merging the PR |\n</details>\n'; } footer += `\n<details>\n<summary>🔄 <b>Re-run evals manually</b></summary>\n\n> ⚠️ **Warning:** \`/eval\` comments always run using the **workflow from master**, not from this PR branch.\n>\n> **To test workflow changes**, use the GitHub CLI or [Actions UI](${workflowUrl}) instead:\n>\n> \`\`\`\n> ${ghCommand}\n> \`\`\`\n\n---\n\n**Option 1: Comment on this PR** with \`/eval\`:\n\n\`\`\`\n/eval\nmarkers: regression\n\`\`\`\n\n**Quick re-run:** Use \`/rerun\` to re-run the most recent \`/eval\` on this PR with the same parameters.\n\n**Option 2: [Trigger via GitHub Actions UI](${workflowUrl})** → "Run workflow"\n</details>\n\n<details>\n<summary>🏷️ <b>Valid markers</b></summary>\n\n${formatAsCodes(p.validMarkers)}\n</details>\n\n---\n**Commands:** \`/eval\` · \`/rerun\` · \`/list\`\n\n**CLI:** \`${ghCommand}\`\n`; return footer; }
            // END INLINED HELPERS
            const p = buildParams({
              ...JSON.parse(${{ toJSON(steps.eval-params.outputs.base_params) }}),
              comment_id: ${{ toJSON(steps.initial-comment.outputs.comment_id) }},
              duration: ${{ toJSON(steps.evals.outputs.duration) }},
              valid_markers: ${{ toJSON(steps.test-preview.outputs.valid_markers) }},
              triggered_by: ${{ toJSON(steps.eval-params.outputs.triggered_by) }}
            });
            const isPersistent = ${{ toJSON(steps.initial-comment.outputs.is_persistent) }} === 'true';
            const report = fs.existsSync('evals_report.md') ? fs.readFileSync('evals_report.md', 'utf8') : '';
            const failures = fs.existsSync('regressions.txt') ? fs.readFileSync('regressions.txt', 'utf8').trim() : '';
            const hasFailures = failures && failures !== '0';

            // Build notification header for the user who triggered the eval (only for manual runs)
            const triggeredBy = p.triggered_by || '';
            const statusText = hasFailures
              ? `⚠️ Completed with ${failures} failure${failures === '1' ? '' : 's'}`
              : '✅ Completed successfully';
            const notifyHeader = triggeredBy ? `@${triggeredBy} Your eval run has finished. ${statusText}\n\n---\n\n` : '';

            // Build current run content
            let currentContent = buildBody(p, null, {
              icon: p.isManual ? '🧪' : '✅',
              title: p.isManual ? 'Manual Eval Results' : 'Results of HolmesGPT evals',
              context
            });
            currentContent += '\n' + (report || '⚠️ No eval report was generated.\n\n');
            if (hasFailures) currentContent += `\n### ⚠️ ${failures} Failure${failures === '1' ? '' : 's'} Detected\n\n`;
            const footer = buildRerunFooter(p, context, { includeLegend: true });

            if (isPersistent && p.commentId) {
              // For automated runs: update the persistent comment, preserving history
              const existingComment = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: p.commentId
              });
              const previousRuns = parseRunHistory(existingComment.data.body);
              const body = buildAutoCommentWithHistory(currentContent, previousRuns, footer);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: p.commentId,
                body: body
              });
            } else {
              // For manual runs: delete progress comment and create fresh results comment
              // This ensures the user gets a GitHub notification when evals complete
              const body = notifyHeader + currentContent + footer;
              if (p.commentId) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  comment_id: p.commentId
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: p.prNumber, body
              });
            }

      - name: Add completion reaction
        if: always() && github.event_name == 'issue_comment' && steps.eval-comment.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            // Remove eyes reaction (was added to indicate processing started)
            const reactions = await github.rest.reactions.listForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id
            });
            const eyesReaction = reactions.data.find(r => r.content === 'eyes' && r.user.login === 'github-actions[bot]');
            if (eyesReaction) {
              await github.rest.reactions.deleteForIssueComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: context.payload.comment.id, reaction_id: eyesReaction.id
              });
            }
            // Add hooray reaction to indicate completion
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'hooray'
            });

      - name: Check test results
        if: always()
        run: |
          if [[ -f "regressions.txt" ]]; then
            echo "⚠️ There are failures in the evals. Please check the file for details."
            cat regressions.txt
          else
            echo "✅ All tests passed."
          fi
