            if (p.commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: parseInt(p.commentId, 10), body
              });
            } else if (!p.isManual) {
              // For automatic triggers without an initial comment (e.g., fork PRs without secrets),
              // create a new comment with results. For manual triggers, initial comment always exists.
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: p.prNumber, body
              });
            }

      - name: Notify user of completion
        if: always() && steps.eval-params.outputs.is_manual == 'true' && steps.eval-params.outputs.pr_number != '' && steps.eval-params.outputs.triggered_by != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const triggeredBy = ${{ toJSON(steps.eval-params.outputs.triggered_by) }};
            const prNumber = parseInt(${{ toJSON(steps.eval-params.outputs.pr_number) }}, 10);
            const regressions = fs.existsSync('regressions.txt') ? fs.readFileSync('regressions.txt', 'utf8').trim() : '';
            const hasRegressions = regressions && regressions !== '0';

            const status = hasRegressions
              ? `⚠️ Completed with ${regressions} regression${regressions === '1' ? '' : 's'}`
              : '✅ Completed successfully';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `@${triggeredBy} Your eval run has finished. ${status}\n\n👆 See updated results above.`
            });

      - name: Add completion reaction
        if: always() && github.event_name == 'issue_comment' && steps.eval-comment.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: context.payload.comment.id, content: 'hooray'
            });

      - name: Check test results
        if: always()
        run: |
          if [[ -f "regressions.txt" ]]; then
            echo "⚠️ There are regressions in the evals. Please check the evals file for details."
            cat regressions.txt
          else
            echo "✅ All tests passed without regressions."
          fi
