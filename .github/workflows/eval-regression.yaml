name: Run eval regression tests

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to comment on (auto-detects from branch if empty)'
        required: false
        default: ''
      model:
        description: 'Model(s) to test. Examples: gpt-4.1, gpt-4o, anthropic/claude-sonnet-4-20250514, azure/gpt-4.1, bedrock/anthropic.claude-sonnet-4-20250514-v1:0, gemini/gemini-1.5-pro, vertex_ai/claude-3-5-sonnet, ollama/llama2. Comma-separated for multiple.'
        required: false
        default: ''
      markers:
        description: 'Pytest markers (e.g., regression, easy, logs). Combined with "llm and". Leave empty for all LLM tests.'
        required: false
        default: ''
      filter:
        description: 'Pytest -k filter (e.g., 09_crashpod, checkout)'
        required: false
        default: ''
      iterations:
        description: 'Number of iterations (1-10)'
        required: false
        default: '1'
      is_pr_trusted:
        description: 'Allow running on fork PRs (use with caution - fork PRs have no secrets access)'
        required: false
        default: 'false'
        type: boolean
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  # Handle /list command - outputs available eval names
  list_evals:
    runs-on: ubuntu-latest
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.event.comment.body, '/list')
    steps:
      - name: Check permissions and fork status
        uses: actions/github-script@v7
        with:
          script: |
            // Check commenter has write access
            const association = context.payload.comment.author_association;
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) {
              core.setFailed(`Permission denied: ${association} cannot use /list (requires OWNER, MEMBER, or COLLABORATOR)`);
              return;
            }

            // SECURITY: Block /list on fork PRs to prevent exposing directory structure
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const isFork = pr.data.head.repo.full_name !== pr.data.base.repo.full_name;
            if (isFork) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ `/list` command is not available on fork PRs for security reasons.'
              });
              core.setFailed('Fork PRs cannot use /list command');
              return;
            }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Post eval list
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Collect eval names from fixture directories
            const askHolmesPath = 'tests/llm/fixtures/test_ask_holmes';
            const investigatePath = 'tests/llm/fixtures/test_investigate';

            const getEvalNames = (dir) => {
              try {
                return fs.readdirSync(dir)
                  .filter(f => !f.startsWith('.'))
                  .sort()
                  .map(f => `\`${f}\``)
                  .join(', ');
              } catch (e) {
                return '_(none found)_';
              }
            };

            const askHolmesEvals = getEvalNames(askHolmesPath);
            const investigateEvals = getEvalNames(investigatePath);

            const body = `## 📋 Available Eval Names\n\n` +
              `Use these with \`filter:\` in your \`/eval\` command.\n\n` +
              `**test_ask_holmes:**\n${askHolmesEvals}\n\n` +
              `**test_investigate:**\n${investigateEvals}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  llm_evals:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && (startsWith(github.event.comment.body, '/eval') || startsWith(github.event.comment.body, '/rerun')))

    # Serialize automated regression runs per PR to avoid race conditions on persistent comment
    # Manual runs (/eval, workflow_dispatch) get unique groups so they can run in parallel
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('eval-auto-pr-{0}', github.event.pull_request.number) || format('eval-{0}', github.run_id) }}
      cancel-in-progress: false

    steps:
      - name: Handle /eval comment
        id: eval-comment
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            // Check commenter has write access
            const association = context.payload.comment.author_association;
            if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(association)) {
              core.setFailed(`Permission denied: ${association} cannot trigger /eval (requires OWNER, MEMBER, or COLLABORATOR)`);
              return;
            }

            // Get PR info for fork detection
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            // SECURITY: Block /eval and /rerun on fork PRs
            const isFork = pr.data.head.repo.full_name !== pr.data.base.repo.full_name;
            if (isFork) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '❌ `/eval` and `/rerun` commands are not available on fork PRs for security reasons.\n\n' +
                      'Fork PRs run automatic regression tests without secrets. For manual eval runs, ' +
                      'a maintainer can use `workflow_dispatch` with `is_pr_trusted: true` after reviewing the code.'
              });
              core.setFailed('Fork PRs cannot use /eval or /rerun commands');
              return;
            }

            let body = context.payload.comment.body;
            let lastEvalCommentId = null;
            const isRerunCommand = body.trim().toLowerCase().startsWith('/rerun');

            // Handle /rerun command: find the last /eval comment on this PR
            if (isRerunCommand) {
              // Fetch all comments (paginate to handle PRs with 100+ comments)
              let allComments = [];
              let page = 1;
              while (true) {
                const response = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  per_page: 100,
                  page: page
                });
                allComments = allComments.concat(response.data);
                if (response.data.length < 100) break;
                page++;
              }

              // Find the last /eval comment before this /rerun comment
              const evalComments = allComments
                .filter(c => c.id !== context.payload.comment.id && c.body.trim().toLowerCase().startsWith('/eval'))
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

              if (evalComments.length === 0) {
                core.setFailed('No previous /eval comment found on this PR. Use /eval instead.');
                return;
              }

              body = evalComments[0].body;
              lastEvalCommentId = evalComments[0].id;
              core.info(`Found last /eval comment: ${lastEvalCommentId}`);
            }

            core.setOutput('is_rerun_command', isRerunCommand.toString());
            core.setOutput('last_eval_comment_id', lastEvalCommentId ? lastEvalCommentId.toString() : '');
            core.setOutput('resolved_body', body);

            // Parse branch parameter from comment if specified (for cross-branch comparison)
            let targetBranch = '';
            for (const line of body.split('\n').slice(1)) {
              const colonIdx = line.indexOf(':');
              if (colonIdx === -1) continue;
              const key = line.slice(0, colonIdx).trim().toLowerCase();
              const value = line.slice(colonIdx + 1).trim();
              if (key === 'branch' && value && /^[a-zA-Z0-9_.\/-]*$/.test(value)) {
                targetBranch = value;
                break;
              }
            }
            core.setOutput('branch', targetBranch);

            core.setOutput('pr_sha', pr.data.head.sha);
            core.setOutput('pr_branch', pr.data.head.ref);

            // Add eyes reaction to indicate the comment was seen and is being processed
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - uses: actions/checkout@v4
        if: github.event_name != 'issue_comment' || steps.eval-comment.outcome == 'success'
        with:
          # For /eval with branch: checkout the specified branch; otherwise checkout PR SHA or current ref
          ref: ${{ steps.eval-comment.outputs.branch || steps.eval-comment.outputs.pr_sha || github.ref }}

      - name: Determine eval parameters
        if: github.event_name != 'issue_comment' || steps.eval-comment.outcome == 'success'
        id: eval-params
        uses: actions/github-script@v7
        with:
          script: |
            // SECURITY: These whitelist regexes protect against shell injection by only
            // allowing safe characters. This works together with proper quoting in bash
            // (using env vars + "$VAR" syntax). If you modify these patterns or add new
            // parameters, ensure: (1) regex is a whitelist of safe chars, (2) values are
            // passed via env vars not inline, (3) bash references use double quotes.
            const patterns = {
              model: /^[a-zA-Z0-9_.,:\/-]*$/,
              markers: /^[a-zA-Z0-9_\- ()]*$/,
              filter: /^[a-zA-Z0-9_\-]*$/,
              iterations: /^[0-9]+$/,
              pr_number: /^[0-9]*$/,
              branch: /^[a-zA-Z0-9_.\/-]*$/
            };

            function validate(value, name) {
              if (!value) return '';
              if (patterns[name] && !patterns[name].test(value)) {
                core.setFailed(`Invalid ${name}: must match ${patterns[name]}`);
                return null;
              }
              return value;
            }

            function parseComment(body) {
              const params = { model: '', markers: '', filter: '', iterations: '1', branch: '' };
              const validKeys = new Set(Object.keys(params));
              for (const line of body.split('\n').slice(1)) {
                const colonIdx = line.indexOf(':');
                if (colonIdx === -1) continue;
                const key = line.slice(0, colonIdx).trim().toLowerCase();
                // Strip leading/trailing quotes (users sometimes add them unnecessarily)
                const value = line.slice(colonIdx + 1).trim().replace(/^['"]|['"]$/g, '');
                if (validKeys.has(key) && value) params[key] = value;
              }
              return params;
            }

            let model, markers, filter, iterations, isManual, triggerSource, prNumber, triggeredBy, branch, displayBranch;
            const event = context.eventName;

            if (event === 'issue_comment') {
              // Use resolved body (handles /rerun command by using the last /eval comment's body)
              const resolvedBody = ${{ toJSON(steps.eval-comment.outputs.resolved_body) }} || context.payload.comment.body;
              const isRerunCommand = ${{ toJSON(steps.eval-comment.outputs.is_rerun_command) }} === 'true';
              const lastEvalCommentId = ${{ toJSON(steps.eval-comment.outputs.last_eval_comment_id) }} || '';

              const parsed = parseComment(resolvedBody);
              model = validate(parsed.model, 'model');
              markers = validate(parsed.markers, 'markers');
              filter = validate(parsed.filter, 'filter');
              iterations = validate(parsed.iterations, 'iterations');
              branch = validate(parsed.branch, 'branch');
              if ([model, markers, filter, iterations, branch].includes(null)) return;
              // displayBranch shows what branch we're testing: override branch or PR branch
              const prBranch = ${{ toJSON(steps.eval-comment.outputs.pr_branch) }} || '';
              displayBranch = branch || prBranch;
              isManual = true;

              // Build trigger source with links to both commands
              const currentCommentUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}#issuecomment-${context.payload.comment.id}`;
              if (isRerunCommand && lastEvalCommentId) {
                const evalCommentUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${context.issue.number}#issuecomment-${lastEvalCommentId}`;
                triggerSource = `[/rerun](${currentCommentUrl}) → [/eval](${evalCommentUrl})`;
              } else {
                triggerSource = branch ? `[/eval on branch \`${branch}\`](${currentCommentUrl})` : `[/eval comment](${currentCommentUrl})`;
              }

              prNumber = context.issue.number;
              triggeredBy = context.payload.comment.user.login;
            } else if (event === 'workflow_dispatch') {
              model = validate(${{ toJSON(github.event.inputs.model) }} || '', 'model');
              markers = validate(${{ toJSON(github.event.inputs.markers) }} || '', 'markers');
              filter = validate(${{ toJSON(github.event.inputs.filter) }} || '', 'filter');
              iterations = validate(${{ toJSON(github.event.inputs.iterations) }} || '', 'iterations');
              const prNum = validate(${{ toJSON(github.event.inputs.pr_number) }} || '', 'pr_number');
              const isPrTrusted = ${{ toJSON(github.event.inputs.is_pr_trusted) }} === 'true';
              branch = ''; // workflow_dispatch doesn't support branch override yet
              if ([model, markers, filter, iterations, prNum].includes(null)) return;
              isManual = true;
              triggerSource = 'workflow_dispatch';
              triggeredBy = context.actor;
              displayBranch = context.ref.replace('refs/heads/', '');

              // Auto-detect PR from branch if pr_number not provided
              if (prNum) {
                prNumber = parseInt(prNum, 10);
              } else {
                const currentBranch = context.ref.replace('refs/heads/', '');
                const prs = await github.rest.pulls.list({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  head: `${context.repo.owner}:${currentBranch}`,
                  state: 'open'
                });
                if (prs.data.length === 1) {
                  prNumber = prs.data[0].number;
                  core.info(`Auto-detected PR #${prNumber} from branch ${currentBranch}`);
                } else if (prs.data.length > 1) {
                  core.warning(`Multiple open PRs found for branch ${currentBranch}, please specify pr_number`);
                  prNumber = null;
                } else {
                  core.info(`No open PR found for branch ${currentBranch}`);
                  prNumber = null;
                }
              }

              // SECURITY: Check if this is a fork PR and block unless explicitly trusted
              if (prNumber) {
                const pr = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                });
                const isFork = pr.data.head.repo.full_name !== pr.data.base.repo.full_name;
                if (isFork && !isPrTrusted) {
                  core.setFailed(
                    `Fork PR #${prNumber} detected. Manual workflow_dispatch on fork PRs requires ` +
                    `is_pr_trusted=true after code review. Fork PRs have no secrets access.`
                  );
                  return;
                }
                if (isFork && isPrTrusted) {
                  core.warning(`Running on trusted fork PR #${prNumber} - ensure code has been reviewed`);
                }
              }
            } else {
              model = '';
              markers = 'regression';
              filter = '';
              iterations = '1';
              branch = '';
              isManual = false;
              prNumber = event === 'pull_request' ? context.payload.pull_request.number : null;
              triggeredBy = '';
              // Build descriptive trigger source for automatic runs
              if (event === 'pull_request') {
                const sha = context.payload.pull_request.head.sha.substring(0, 7);
                const prBranch = context.payload.pull_request.head.ref;
                displayBranch = prBranch;
                triggerSource = `commit ${sha} on branch \`${prBranch}\``;
              } else if (event === 'push') {
                const sha = context.sha.substring(0, 7);
                const pushBranch = context.ref.replace('refs/heads/', '');
                displayBranch = pushBranch;
                triggerSource = `push to \`${pushBranch}\` (${sha})`;
              } else {
                displayBranch = '';
                triggerSource = 'automatic';
              }
            }

            // Apply defaults
            if (!model) model = ${{ toJSON(vars.MODEL) }} || '';
            // Only apply regression default for automatic triggers, not for manual /eval or workflow_dispatch
            if (!markers && !isManual) markers = 'regression';
            let iterNum = Math.min(Math.max(parseInt(iterations, 10) || 1, 1), 10);

            core.setOutput('model', model);
            core.setOutput('markers', markers);
            core.setOutput('filter', filter);
            core.setOutput('iterations', iterNum.toString());
            core.setOutput('is_manual', isManual.toString());
            core.setOutput('trigger_source', triggerSource);
            core.setOutput('pr_number', prNumber ? prNumber.toString() : '');
            core.setOutput('triggered_by', triggeredBy);
            core.setOutput('branch', branch);
            core.setOutput('display_branch', displayBranch || '');
            core.setOutput('marker_expr', markers ? `llm and (${markers})` : 'llm');
            core.setOutput('run_url', `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`);

            // Output all common params as JSON for DRY usage in subsequent steps
            core.setOutput('base_params', JSON.stringify({
              is_manual: isManual.toString(),
              trigger_source: triggerSource,
              model,
              markers,
              filter,
              iterations: iterNum.toString(),
              branch,
              display_branch: displayBranch || '',
              run_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              pr_number: prNumber ? prNumber.toString() : ''
            }));

      - name: Check if tests should run
        id: check-tests
        if: github.event_name != 'issue_comment' || steps.eval-comment.outcome == 'success'
        shell: bash
        run: |
          # Check one secret as proxy for secrets access (repo has all or none)
          if [[ -n "${{ secrets.AZURE_API_KEY }}" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
          fi

      - name: Post initial comment
        id: initial-comment
        if: steps.check-tests.outputs.should-run == 'true' && steps.eval-params.outputs.pr_number != ''
        uses: actions/github-script@v7
        with:
          script: |
            // SECURITY: Helper functions are inlined to prevent loading from PR checkout
            // DO NOT replace with require() - that would allow malicious PRs to inject code
            const AUTO_EVAL_COMMENT_IDENTIFIER = '<!-- holmes-auto-eval-results -->';
            const HISTORY_RUN_END_MARKER = '<!-- END_HISTORY_RUN -->';
            const MAX_COMMENT_SIZE = 60000;

            function parseRunHistory(body) {
              const runs = [];
              const historyRegex = /<details>\s*<summary>📜\s*(.+?)<\/summary>\s*([\s\S]*?)<!-- END_HISTORY_RUN -->\s*<\/details>/g;
              let match;
              while ((match = historyRegex.exec(body)) !== null) {
                runs.push({ summary: match[1].trim(), content: match[2].trim() });
              }
              return runs;
            }

            function extractCurrentRun(body) {
              let cleanBody = body.replace(AUTO_EVAL_COMMENT_IDENTIFIER, '').trim();
              const previousRunsHeader = '## 📂 Previous Runs';
              if (cleanBody.startsWith(previousRunsHeader)) {
                const separatorIndex = cleanBody.indexOf('\n---\n');
                if (separatorIndex !== -1) cleanBody = cleanBody.substring(separatorIndex + 5).trim();
              }
              const headerMatch = cleanBody.match(/^(## [^\n]+)/);
              if (!headerMatch) return null;
              const header = headerMatch[1];
              if (!header.includes('Results')) return null;
              const footerMarkers = ['<details>\n<summary>📖 <b>Legend</b>', '<details>\n<summary>🔄 <b>Re-run evals manually</b>', '<details>\n<summary>🏷️ <b>Valid markers</b>', '\n---\n**Commands:**'];
              let endPos = cleanBody.length;
              for (const marker of footerMarkers) {
                const pos = cleanBody.indexOf(marker);
                if (pos !== -1 && pos < endPos) endPos = pos;
              }
              const currentSection = cleanBody.substring(0, endPos);
              const triggerMatch = currentSection.match(/Automatically triggered by ([^\n]+)/);
              const trigger = triggerMatch ? triggerMatch[1] : '';
              const runUrlMatch = currentSection.match(/\[View workflow logs\]\(([^)]+)\)/);
              const runUrl = runUrlMatch ? runUrlMatch[1] : '';
              let summary = 'Previous Run';
              if (trigger) {
                const commitMatch = trigger.match(/commit ([a-f0-9]+)/);
                const commit = commitMatch ? commitMatch[1] : '';
                summary = commit ? `Run @ ${commit}` : `Run: ${trigger.substring(0, 50)}`;
              }
              if (runUrl) {
                const runIdMatch = runUrl.match(/runs\/(\d+)/);
                if (runIdMatch) summary += ` (#${runIdMatch[1]})`;
              }
              return { summary, content: cleanBody.substring(0, endPos).trim() };
            }

            function buildAutoCommentWithHistory(currentContent, previousRuns, footer, maxHistory = 5) {
              let body = AUTO_EVAL_COMMENT_IDENTIFIER + '\n';
              const runsToShow = previousRuns.slice(0, maxHistory);
              let historySection = '';
              let addedCount = 0;
              if (runsToShow.length > 0) {
                historySection = '## 📂 Previous Runs\n\n';
                for (const run of runsToShow) {
                  const historyEntry = `<details>\n<summary>📜 ${run.summary}</summary>\n\n${run.content}\n\n${HISTORY_RUN_END_MARKER}\n</details>\n\n`;
                  const projectedSize = body.length + historySection.length + historyEntry.length + currentContent.length + footer.length;
                  if (projectedSize > MAX_COMMENT_SIZE) {
                    const remaining = runsToShow.length - addedCount;
                    historySection += `<details>\n<summary>⚠️ ${remaining} older run${remaining > 1 ? 's' : ''} truncated</summary>\n\n_Older runs were omitted to stay under GitHub's 64KB comment size limit._\n</details>\n\n`;
                    break;
                  }
                  historySection += historyEntry;
                  addedCount++;
                }
                historySection += '---\n\n';
              }
              body += historySection + currentContent + footer;
              return body;
            }

            function buildParams(raw) {
              return {
                isManual: raw.is_manual === 'true',
                trigger: raw.trigger_source,
                model: raw.model || 'default',
                markers: raw.markers,
                filter: raw.filter,
                iterations: raw.iterations,
                branch: raw.branch || '',
                displayBranch: raw.display_branch || '',
                runUrl: raw.run_url,
                prNumber: raw.pr_number ? parseInt(raw.pr_number, 10) : null,
                commentId: raw.comment_id ? parseInt(raw.comment_id, 10) : null,
                testCount: raw.test_count || '0',
                testPreview: raw.test_preview || '',
                duration: raw.duration || 'N/A',
                validMarkers: raw.valid_markers || '',
                triggered_by: raw.triggered_by || ''
              };
            }

            function renderProgress(steps) {
              return steps.map(([done, text]) => done ? `- [x] ${text}` : `- [ ] ${text}`).join('\n');
            }

            function renderParamsTable(p, ctx = null) {
              let workflowLinks = `[View logs](${p.runUrl})`;
              if (ctx) {
                const baseWorkflowUrl = `https://github.com/${ctx.repo.owner}/${ctx.repo.repo}/actions/workflows/eval-regression.yaml`;
                const rerunUrl = p.displayBranch ? `${baseWorkflowUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseWorkflowUrl;
                workflowLinks += ` \\| [Rerun](${rerunUrl})`;
              }
              return `| Parameter | Value |\n|-----------|-------|\n` +
                `| **Triggered via** | ${p.trigger} |\n` +
                (p.displayBranch ? `| **Branch** | \`${p.displayBranch}\` |\n` : '') +
                `| **Model** | \`${p.model}\` |\n` +
                `| **Markers** | \`${p.markers || 'all LLM tests'}\` |\n` +
                (p.filter ? `| **Filter (-k)** | \`${p.filter}\` |\n` : '') +
                `| **Iterations** | ${p.iterations} |\n` +
                (p.duration ? `| **Duration** | ${p.duration} |\n` : '') +
                `| **Workflow** | ${workflowLinks} |\n`;
            }

            function buildBody(p, progressSteps, extras = {}) {
              let body = p.isManual
                ? `## ${extras.icon || '🚀'} ${extras.title || 'Manual Eval Running...'}\n\n` + renderParamsTable(p, extras.context)
                : `## ${extras.icon || '⏳'} ${extras.title || 'HolmesGPT evals running...'}\n\n` + `Automatically triggered by ${p.trigger}\n\n` + `[View workflow logs](${p.runUrl})\n`;
              if (progressSteps) body += `\n**Progress:**\n${renderProgress(progressSteps)}\n`;
              if (extras.testPreview) body += `\n<details>\n<summary>📋 Evals to run</summary>\n\n\`\`\`\n${extras.testPreview}\n\`\`\`\n</details>\n`;
              return body;
            }

            function formatAsCodes(items) {
              if (!items) return '_(loading...)_';
              return items.split(',').map(item => { const t = item.trim(); return t ? `\`${t}\`` : ''; }).filter(Boolean).join(', ');
            }

            function buildRerunFooter(p, ctx, options = {}) {
              const { includeLegend = false } = options;
              const repoFullName = `${ctx.repo.owner}/${ctx.repo.repo}`;
              const baseWorkflowUrl = `https://github.com/${repoFullName}/actions/workflows/eval-regression.yaml`;
              const workflowUrl = p.displayBranch ? `${baseWorkflowUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseWorkflowUrl;
              const markersFormatted = formatAsCodes(p.validMarkers);
              const ghCommand = p.displayBranch
                ? `gh workflow run eval-regression.yaml --repo ${repoFullName} --ref ${p.displayBranch} -f markers=regression -f filter=`
                : `gh workflow run eval-regression.yaml --repo ${repoFullName} -f markers=regression -f filter=`;
              let footer = '';
              if (includeLegend) {
                footer += '\n<details>\n<summary>📖 <b>Legend</b></summary>\n\n' +
                  '| Icon | Meaning |\n|------|--------|\n' +
                  '| ✅ | The test was successful |\n| ➖ | The test was skipped |\n| ⚠️ | The test failed but is known to be flaky or known to fail |\n| 🚧 | The test had a setup failure (not a code regression) |\n| 🔧 | The test failed due to mock data issues (not a code regression) |\n| 🚫 | The test was throttled by API rate limits/overload |\n| ❌ | The test failed and should be fixed before merging the PR |\n</details>\n';
              }
              footer += '\n<details>\n<summary>🔄 <b>Re-run evals manually</b></summary>\n\n' +
                '> ⚠️ **Warning:** `/eval` comments always run using the **workflow from master**, not from this PR branch. ' +
                'If you modified the GitHub Action (e.g., added secrets or env vars), those changes won\'t take effect.\n>\n' +
                '> **To test workflow changes**, use the GitHub CLI or [Actions UI](' + workflowUrl + ') instead:\n>\n' +
                '> ```\n> ' + ghCommand + '\n> ```\n\n---\n\n' +
                '**Option 1: Comment on this PR** with `/eval`:\n\n```\n/eval\nmarkers: regression\n```\n\n' +
                'Or with more options (one per line):\n\n```\n/eval\nmodel: gpt-4o\nmarkers: regression\nfilter: 09_crashpod\niterations: 5\n```\n\n' +
                'Run evals on a different branch (e.g., master) for comparison:\n\n```\n/eval\nbranch: master\nmarkers: regression\n```\n\n' +
                '| Option | Description |\n|--------|-------------|\n' +
                '| `model` | Model(s) to test (default: same as automatic runs) |\n| `markers` | Pytest markers (**no default - runs all tests!**) |\n| `filter` | Pytest -k filter (use `/list` to see valid eval names) |\n| `iterations` | Number of runs, max 10 |\n| `branch` | Run evals on a different branch (for cross-branch comparison) |\n\n' +
                '**Quick re-run:** Use `/rerun` to re-run the most recent `/eval` on this PR with the same parameters.\n\n' +
                `**Option 2: [Trigger via GitHub Actions UI](${workflowUrl})** → "Run workflow"\n</details>\n` +
                '\n<details>\n<summary>🏷️ <b>Valid markers</b></summary>\n\n' + markersFormatted + '\n</details>\n' +
                '\n---\n**Commands:** `/eval` · `/rerun` · `/list`\n\n**CLI:** `' + ghCommand + '`\n';
              return footer;
            }
            // END INLINED HELPERS

            const p = buildParams(JSON.parse(${{ toJSON(steps.eval-params.outputs.base_params) }}));
            const progressSteps = [
              [false, 'Setup HolmesGPT environment'],
              [false, 'Collect evals to run'],
              [false, 'Setup KIND cluster'],
              [false, 'Run evals']
            ];

            // For automated runs (not /eval or workflow_dispatch), use persistent comment
            if (!p.isManual) {
              // Find existing persistent comment
              let existingComment = null;
              let page = 1;
              while (true) {
                const response = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: p.prNumber,
                  per_page: 100,
                  page: page
                });
                const found = response.data.find(c => c.body.includes(AUTO_EVAL_COMMENT_IDENTIFIER));
                if (found) {
                  existingComment = found;
                  break;
                }
                if (response.data.length < 100) break;
                page++;
              }

              const currentContent = buildBody(p, progressSteps, { context });
              const footer = buildRerunFooter(p, context);

              if (existingComment) {
                // Parse history from existing comment, including moving current run to history
                const previousRuns = parseRunHistory(existingComment.body);
                const currentRun = extractCurrentRun(existingComment.body);
                if (currentRun && currentRun.content) {
                  previousRuns.unshift(currentRun);
                }
                const body = buildAutoCommentWithHistory(currentContent, previousRuns, footer);
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body
                });
                core.setOutput('comment_id', existingComment.id.toString());
                core.setOutput('is_persistent', 'true');
              } else {
                // Create new persistent comment
                const body = buildAutoCommentWithHistory(currentContent, [], footer);
                const comment = await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: p.prNumber,
                  body: body
                });
                core.setOutput('comment_id', comment.data.id.toString());
                core.setOutput('is_persistent', 'true');
              }
            } else {
              // Manual runs: create a fresh comment (original behavior)
              const comment = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: p.prNumber,
                body: buildBody(p, progressSteps, { context }) + buildRerunFooter(p, context)
              });
              core.setOutput('comment_id', comment.data.id.toString());
              core.setOutput('is_persistent', 'false');
            }

      # Reordered: Setup HolmesGPT first (needed for pytest), then collect evals, then KIND
      - name: Setup HolmesGPT environment
        if: steps.check-tests.outputs.should-run == 'true'
        uses: ./.github/actions/setup-holmes-env
        with:
          python-version: '3.12'
          install-kubectl: 'true'

      - name: Update progress - HolmesGPT setup done
        if: steps.check-tests.outputs.should-run == 'true' && steps.eval-params.outputs.pr_number != '' && steps.initial-comment.outputs.comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            // SECURITY: Helper functions are inlined to prevent loading from PR checkout
            const AUTO_EVAL_COMMENT_IDENTIFIER = '<!-- holmes-auto-eval-results -->';
            const HISTORY_RUN_END_MARKER = '<!-- END_HISTORY_RUN -->';
            const MAX_COMMENT_SIZE = 60000;
            function parseRunHistory(body) {
              const runs = [];
              const historyRegex = /<details>\s*<summary>📜\s*(.+?)<\/summary>\s*([\s\S]*?)<!-- END_HISTORY_RUN -->\s*<\/details>/g;
              let match;
              while ((match = historyRegex.exec(body)) !== null) {
                runs.push({ summary: match[1].trim(), content: match[2].trim() });
              }
              return runs;
            }
            function buildAutoCommentWithHistory(currentContent, previousRuns, footer, maxHistory = 5) {
              let body = AUTO_EVAL_COMMENT_IDENTIFIER + '\n';
              const runsToShow = previousRuns.slice(0, maxHistory);
              let historySection = '';
              let addedCount = 0;
              if (runsToShow.length > 0) {
                historySection = '## 📂 Previous Runs\n\n';
                for (const run of runsToShow) {
                  const historyEntry = `<details>\n<summary>📜 ${run.summary}</summary>\n\n${run.content}\n\n${HISTORY_RUN_END_MARKER}\n</details>\n\n`;
                  const projectedSize = body.length + historySection.length + historyEntry.length + currentContent.length + footer.length;
                  if (projectedSize > MAX_COMMENT_SIZE) {
                    const remaining = runsToShow.length - addedCount;
                    historySection += `<details>\n<summary>⚠️ ${remaining} older run${remaining > 1 ? 's' : ''} truncated</summary>\n\n_Older runs were omitted._\n</details>\n\n`;
                    break;
                  }
                  historySection += historyEntry;
                  addedCount++;
                }
                historySection += '---\n\n';
              }
              body += historySection + currentContent + footer;
              return body;
            }
            function buildParams(raw) {
              return {
                isManual: raw.is_manual === 'true', trigger: raw.trigger_source, model: raw.model || 'default',
                markers: raw.markers, filter: raw.filter, iterations: raw.iterations, branch: raw.branch || '',
                displayBranch: raw.display_branch || '', runUrl: raw.run_url,
                prNumber: raw.pr_number ? parseInt(raw.pr_number, 10) : null,
                commentId: raw.comment_id ? parseInt(raw.comment_id, 10) : null,
                testCount: raw.test_count || '0', testPreview: raw.test_preview || '',
                duration: raw.duration || 'N/A', validMarkers: raw.valid_markers || '', triggered_by: raw.triggered_by || ''
              };
            }
            function renderProgress(steps) { return steps.map(([done, text]) => done ? `- [x] ${text}` : `- [ ] ${text}`).join('\n'); }
            function renderParamsTable(p, ctx = null) {
              let workflowLinks = `[View logs](${p.runUrl})`;
              if (ctx) { const baseUrl = `https://github.com/${ctx.repo.owner}/${ctx.repo.repo}/actions/workflows/eval-regression.yaml`; workflowLinks += ` \\| [Rerun](${p.displayBranch ? `${baseUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseUrl})`; }
              return `| Parameter | Value |\n|-----------|-------|\n| **Triggered via** | ${p.trigger} |\n` + (p.displayBranch ? `| **Branch** | \`${p.displayBranch}\` |\n` : '') + `| **Model** | \`${p.model}\` |\n| **Markers** | \`${p.markers || 'all LLM tests'}\` |\n` + (p.filter ? `| **Filter (-k)** | \`${p.filter}\` |\n` : '') + `| **Iterations** | ${p.iterations} |\n` + (p.duration ? `| **Duration** | ${p.duration} |\n` : '') + `| **Workflow** | ${workflowLinks} |\n`;
            }
            function buildBody(p, progressSteps, extras = {}) {
              let body = p.isManual ? `## ${extras.icon || '🚀'} ${extras.title || 'Manual Eval Running...'}\n\n` + renderParamsTable(p, extras.context) : `## ${extras.icon || '⏳'} ${extras.title || 'HolmesGPT evals running...'}\n\nAutomatically triggered by ${p.trigger}\n\n[View workflow logs](${p.runUrl})\n`;
              if (progressSteps) body += `\n**Progress:**\n${renderProgress(progressSteps)}\n`;
              if (extras.testPreview) body += `\n<details>\n<summary>📋 Evals to run</summary>\n\n\`\`\`\n${extras.testPreview}\n\`\`\`\n</details>\n`;
              return body;
            }
            function formatAsCodes(items) { if (!items) return '_(loading...)_'; return items.split(',').map(item => { const t = item.trim(); return t ? `\`${t}\`` : ''; }).filter(Boolean).join(', '); }
            function buildRerunFooter(p, ctx, options = {}) {
              const repoFullName = `${ctx.repo.owner}/${ctx.repo.repo}`;
              const baseWorkflowUrl = `https://github.com/${repoFullName}/actions/workflows/eval-regression.yaml`;
              const workflowUrl = p.displayBranch ? `${baseWorkflowUrl}?ref=${encodeURIComponent(p.displayBranch)}` : baseWorkflowUrl;
              const ghCommand = p.displayBranch ? `gh workflow run eval-regression.yaml --repo ${repoFullName} --ref ${p.displayBranch} -f markers=regression -f filter=` : `gh workflow run eval-regression.yaml --repo ${repoFullName} -f markers=regression -f filter=`;
              let footer = '';
              if (options.includeLegend) { footer += '\n<details>\n<summary>📖 <b>Legend</b></summary>\n\n| Icon | Meaning |\n|------|--------|\n| ✅ | The test was successful |\n| ➖ | The test was skipped |\n| ⚠️ | The test failed but is known to be flaky or known to fail |\n| 🚧 | The test had a setup failure (not a code regression) |\n| 🔧 | The test failed due to mock data issues (not a code regression) |\n| 🚫 | The test was throttled by API rate limits/overload |\n| ❌ | The test failed and should be fixed before merging the PR |\n</details>\n'; }
              footer += `\n<details>\n<summary>🔄 <b>Re-run evals manually</b></summary>\n\n> ⚠️ **Warning:** \`/eval\` comments always run using the **workflow from master**, not from this PR branch.\n>\n> **To test workflow changes**, use the GitHub CLI or [Actions UI](${workflowUrl}) instead:\n>\n> \`\`\`\n> ${ghCommand}\n> \`\`\`\n\n---\n\n**Option 1: Comment on this PR** with \`/eval\`:\n\n\`\`\`\n/eval\nmarkers: regression\n\`\`\`\n\n**Quick re-run:** Use \`/rerun\` to re-run the most recent \`/eval\` on this PR with the same parameters.\n\n**Option 2: [Trigger via GitHub Actions UI](${workflowUrl})** → "Run workflow"\n</details>\n\n<details>\n<summary>🏷️ <b>Valid markers</b></summary>\n\n${formatAsCodes(p.validMarkers)}\n</details>\n\n---\n**Commands:** \`/eval\` · \`/rerun\` · \`/list\`\n\n**CLI:** \`${ghCommand}\`\n`;
              return footer;
            }
            // END INLINED HELPERS
            const p = buildParams({
              ...JSON.parse(${{ toJSON(steps.eval-params.outputs.base_params) }}),
              comment_id: ${{ toJSON(steps.initial-comment.outputs.comment_id) }}
            });
            const isPersistent = ${{ toJSON(steps.initial-comment.outputs.is_persistent) }} === 'true';
            const progressSteps = [
              [true, 'Setup HolmesGPT environment'],
              [false, 'Collect evals to run'],
              [false, 'Setup KIND cluster'],
              [false, 'Run evals']
            ];

            let body;
            if (isPersistent) {
              // Preserve history for automated runs
              const existingComment = await github.rest.issues.getComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: p.commentId
              });
              const previousRuns = parseRunHistory(existingComment.data.body);
              const currentContent = buildBody(p, progressSteps, { context });
              const footer = buildRerunFooter(p, context);
              body = buildAutoCommentWithHistory(currentContent, previousRuns, footer);
            } else {
              body = buildBody(p, progressSteps, { context }) + buildRerunFooter(p, context);
            }

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: p.commentId,
              body: body
            });

      - name: Collect evals to run
        if: steps.check-tests.outputs.should-run == 'true' && steps.eval-params.outputs.pr_number != ''
        id: test-preview
        shell: bash
        env:
          MODEL: ${{ steps.eval-params.outputs.model }}
          EVAL_MARKER_EXPR: ${{ steps.eval-params.outputs.marker_expr }}
          EVAL_FILTER: ${{ steps.eval-params.outputs.filter }}
        run: |
          # Unset MODEL if empty so get_models() uses DEFAULT_MODEL
          [[ -z "$MODEL" ]] && unset MODEL

          PYTEST_ARGS=(--collect-only -q tests/llm/test_ask_holmes.py tests/llm/test_investigate.py -m "$EVAL_MARKER_EXPR")
          [[ -n "$EVAL_FILTER" ]] && PYTEST_ARGS+=(-k "$EVAL_FILTER")

          # Collect test names
          TEST_LIST=$(poetry run pytest "${PYTEST_ARGS[@]}" 2>/dev/null | grep -E "^tests/llm/" || true)
          TEST_COUNT=$(echo "$TEST_LIST" | grep -c "^tests/llm/" || true)

          # Collect valid markers from pyproject.toml using Python/tomllib (excluding 'llm' which is internal)
          # Output as comma-separated plain names
          VALID_MARKERS=$(python3 << 'PYEOF'
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              config = tomllib.load(f)
          markers = config.get('tool', {}).get('pytest', {}).get('ini_options', {}).get('markers', [])
          names = [m.split(':')[0] for m in sorted(markers) if m.split(':')[0] != 'llm']
          print(','.join(names))
          PYEOF
          )

          # Output for next steps
          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "test_preview<<$EOF" >> $GITHUB_OUTPUT
          echo "$TEST_LIST" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "valid_markers<<$EOF" >> $GITHUB_OUTPUT
          echo "$VALID_MARKERS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Update progress - evals collected
