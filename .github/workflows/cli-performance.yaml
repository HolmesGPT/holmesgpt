name: CLI Performance Benchmark

# Measures CLI startup time to catch import/init regressions.
# Two benchmarks:
# 1. Without LLM: `holmes version` - measures pure startup overhead
# 2. With LLM: `holmes ask` - verifies full CLI works end-to-end (uses OpenRouter + Haiku)

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        required: false
        default: '5'

jobs:
  benchmark-without-llm:
    name: "Benchmark: Startup Time (no LLM)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      status: ${{ steps.compare.outputs.status }}

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Benchmark PR branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking PR branch (holmes version)..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output pr_benchmark.json

      - name: Save PR results and checkout master
        run: |
          cp pr_benchmark.json /tmp/pr_benchmark.json
          cp scripts/cli_performance_benchmark.py /tmp/cli_performance_benchmark.py
          git checkout origin/master
          mkdir -p scripts
          cp /tmp/cli_performance_benchmark.py scripts/cli_performance_benchmark.py

      - name: Install dependencies (master)
        run: poetry install --no-interaction

      - name: Benchmark master branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking master branch (holmes version)..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output /tmp/master_benchmark.json

      - name: Compare results
        id: compare
        run: |
          rm -f scripts/cli_performance_benchmark.py
          git checkout ${{ github.head_ref }}
          cp /tmp/pr_benchmark.json pr_benchmark.json
          cp /tmp/master_benchmark.json master_benchmark.json

          python3 << 'PYEOF'
          import json
          from pathlib import Path

          pr = json.loads(Path('pr_benchmark.json').read_text())
          master = json.loads(Path('master_benchmark.json').read_text())

          cold_diff_pct = ((pr['cold_start_seconds'] - master['cold_start_seconds']) / master['cold_start_seconds']) * 100
          warm_diff_pct = ((pr['warm_mean_seconds'] - master['warm_mean_seconds']) / master['warm_mean_seconds']) * 100

          if warm_diff_pct < -10:
              status, emoji = 'improved', '🟢'
          elif warm_diff_pct > 20:
              status, emoji = 'regression', '🔴'
          else:
              status, emoji = 'neutral', '🟡'

          cold_emoji = '🔴' if cold_diff_pct > 20 else ('🟢' if cold_diff_pct < -10 else '🟡')

          report_lines = [
              f"## {emoji} CLI Startup Benchmark (no LLM): {status.upper()}",
              "",
              "Measures **holmes version** execution time (imports + initialization).",
              "",
              f"### {cold_emoji} Cold Start (first run)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Time | {pr['cold_start_seconds']:.3f}s | {master['cold_start_seconds']:.3f}s | {cold_diff_pct:+.1f}% |",
              "",
              "### Warm Start (cached runs)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Mean | {pr['warm_mean_seconds']:.3f}s | {master['warm_mean_seconds']:.3f}s | {warm_diff_pct:+.1f}% |",
              f"| Min | {pr['warm_min_seconds']:.3f}s | {master['warm_min_seconds']:.3f}s | |",
              f"| Max | {pr['warm_max_seconds']:.3f}s | {master['warm_max_seconds']:.3f}s | |",
              "",
              f"**PR**: {pr['git_sha']} | **Master**: {master['git_sha']} | **Iterations**: {pr['iterations']}",
          ]

          if status == 'regression':
              report_lines.extend(["", "⚠️ **Regression detected!** Check for new imports or initialization overhead."])
          elif status == 'improved':
              report_lines.extend(["", "✨ **Performance improved!**"])

          Path('comparison_report.md').write_text("\n".join(report_lines))
          Path('status.txt').write_text(status)
          PYEOF

          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('comparison_report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('CLI Startup Benchmark'));
            const body = report + '\n\n---\n*Updated: ' + new Date().toISOString() + '*';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-no-llm-${{ github.run_id }}
          path: |
            pr_benchmark.json
            master_benchmark.json
            comparison_report.md

      - name: Check for regression
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "regression" ]; then
            echo "❌ Startup time regression detected (>20% slower)"
            exit 1
          fi
          echo "✅ No startup regression"

  benchmark-with-llm:
    name: "Benchmark: Full CLI (with LLM via OpenRouter)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: benchmark-without-llm

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Check API key and run benchmark
        id: llm_benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ OPENROUTER_API_KEY not available - LLM benchmark will be skipped"
            echo "result=⚠️ **LLM Benchmark skipped** - OPENROUTER_API_KEY not configured in repository secrets." > llm_result.txt
          else
            echo "has_api_key=true" >> "$GITHUB_OUTPUT"
            echo "Benchmarking full CLI with LLM (holmes ask via OpenRouter + Haiku 4.5)..."

            python scripts/cli_performance_benchmark.py \
              --e2e-only \
              --iterations 2 \
              --model "openrouter/anthropic/claude-3-5-haiku-latest" \
              --output benchmark_with_llm.json

            python3 << 'PYEOF'
          import json
          from pathlib import Path

          r = json.loads(Path('benchmark_with_llm.json').read_text())
          result = f"""✅ **LLM Benchmark (OpenRouter + Haiku 4.5)**: Passed

          | Metric | Time |
          |--------|------|
          | Cold Start | {r['cold_start_seconds']:.2f}s |
          | Warm Start | {r['warm_mean_seconds']:.2f}s |
          """
          Path('llm_result.txt').write_text(result)
          PYEOF
          fi

      - name: Update PR comment with LLM results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const llmResult = fs.readFileSync('llm_result.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('CLI Startup Benchmark'));

            if (botComment) {
              // Append LLM results to existing comment
              let body = botComment.body;

              // Remove old LLM section if present
              body = body.replace(/\n---\n### LLM Benchmark[\s\S]*?(?=\n---\n\*Updated:|$)/, '');

              // Remove the old timestamp line
              body = body.replace(/\n---\n\*Updated:.*\*$/, '');

              // Add new LLM section and timestamp
              body += '\n\n---\n### LLM Benchmark\n' + llmResult;
              body += '\n\n---\n*Updated: ' + new Date().toISOString() + '*';

              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-with-llm-${{ github.run_id }}
          path: |
            benchmark_with_llm.json
            llm_result.txt
