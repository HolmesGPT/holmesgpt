name: CLI Performance Benchmark

# Measures CLI startup time (deterministic) to catch import/init regressions.
# Reports both cold start (first run) and warm start (subsequent runs).
# Compares PR against master branch directly.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of startup benchmark iterations'
        required: false
        default: '5'

jobs:
  startup-benchmark:
    name: Startup Time Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # Benchmark PR branch
      - name: Benchmark PR branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking PR branch..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output pr_benchmark.json

      # Save PR results and script, then checkout master
      - name: Checkout master for baseline
        run: |
          cp pr_benchmark.json /tmp/pr_benchmark.json
          cp scripts/cli_performance_benchmark.py /tmp/cli_performance_benchmark.py
          git checkout origin/master
          mkdir -p scripts
          cp /tmp/cli_performance_benchmark.py scripts/cli_performance_benchmark.py

      - name: Install dependencies (master)
        run: poetry install --no-interaction

      - name: Benchmark master branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking master branch..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output master_benchmark.json

      # Switch back to PR and compare
      - name: Compare results
        id: compare
        run: |
          git checkout ${{ github.head_ref }}
          cp /tmp/pr_benchmark.json pr_benchmark.json

          python << 'PYEOF'
          import json
          from pathlib import Path

          pr = json.loads(Path('pr_benchmark.json').read_text())
          master = json.loads(Path('master_benchmark.json').read_text())

          cold_diff_pct = ((pr['cold_start_seconds'] - master['cold_start_seconds']) / master['cold_start_seconds']) * 100
          warm_diff_pct = ((pr['warm_mean_seconds'] - master['warm_mean_seconds']) / master['warm_mean_seconds']) * 100

          if warm_diff_pct < -10:
              status, emoji = 'improved', '🟢'
          elif warm_diff_pct > 20:
              status, emoji = 'regression', '🔴'
          else:
              status, emoji = 'neutral', '🟡'

          if cold_diff_pct > 20:
              cold_emoji = '🔴'
          elif cold_diff_pct < -10:
              cold_emoji = '🟢'
          else:
              cold_emoji = '🟡'

          report_lines = [
              f"## {emoji} CLI Startup Benchmark: {status.upper()}",
              "",
              "Measures `holmes version` execution time (imports + initialization).",
              "",
              f"### {cold_emoji} Cold Start (first run, no caches)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Time | {pr['cold_start_seconds']:.3f}s | {master['cold_start_seconds']:.3f}s | {cold_diff_pct:+.1f}% |",
              "",
              "### Warm Start (subsequent runs, caches populated)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Mean | {pr['warm_mean_seconds']:.3f}s | {master['warm_mean_seconds']:.3f}s | {warm_diff_pct:+.1f}% |",
              f"| Min | {pr['warm_min_seconds']:.3f}s | {master['warm_min_seconds']:.3f}s | |",
              f"| Max | {pr['warm_max_seconds']:.3f}s | {master['warm_max_seconds']:.3f}s | |",
              "",
              f"**PR**: `{pr['git_sha']}` | **Master**: `{master['git_sha']}` | **Iterations**: {pr['iterations']}",
          ]

          if status == 'regression':
              report_lines.extend([
                  "",
                  "⚠️ **Regression detected!** Check for:",
                  "- New heavy imports at module level",
                  "- Initialization code that runs on import",
                  "- New dependencies with slow imports",
              ])
          elif status == 'improved':
              report_lines.append("")
              report_lines.append("✨ **Performance improved!**")

          report = "\n".join(report_lines)
          Path('comparison_report.md').write_text(report)
          Path('status.txt').write_text(status)
          PYEOF

          echo "status=$(cat status.txt)" >> $GITHUB_OUTPUT
          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat comparison_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.compare.outputs.report }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CLI Startup Benchmark')
            );

            const body = report + '\n\n---\n*Updated: ' + new Date().toISOString() + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            pr_benchmark.json
            master_benchmark.json
            comparison_report.md

      - name: Check for regression
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "regression" ]; then
            echo "❌ Startup time regression detected (>20% slower)"
            exit 1
          fi
          echo "✅ No startup regression"

  e2e-sanity-check:
    name: E2E Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run e2e sanity check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        run: |
          echo "Running e2e sanity check..."
          python scripts/cli_performance_benchmark.py \
            --e2e-only \
            --iterations 2 \
            --output e2e_result.json

          python -c "
          import json
          r = json.loads(open('e2e_result.json').read())
          print(f'✅ E2E sanity check passed')
          print(f'   Cold: {r[\"cold_start_seconds\"]:.2f}s')
          print(f'   Warm: {r[\"warm_mean_seconds\"]:.2f}s')
          "

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sanity-${{ github.run_id }}
          path: e2e_result.json
