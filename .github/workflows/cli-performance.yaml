name: CLI Performance Benchmark

# Measures CLI performance to catch import/init regressions.
# Benchmarks both startup time (no LLM) and full CLI with LLM.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        required: false
        default: '5'

jobs:
  benchmark:
    name: "CLI Performance Benchmark"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark benchmark as running
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            console.log(`Looking for benchmark comment on PR #${context.issue.number}`);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            console.log(`Found ${comments.length} comments`);
            const botComment = comments.find(c => c.user.type === 'Bot' && (c.body.includes('CLI Performance Benchmark') || c.body.includes('CLI Startup Benchmark')));
            if (botComment) {
              console.log(`Found existing benchmark comment (id: ${botComment.id}), adding running banner`);
              let body = botComment.body.replace(/^> 🔄 \*\*Benchmark running\.\.\.\*\*.*\n\n/s, '');
              const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              body = `> 🔄 **Benchmark running...** [View logs](${runUrl})\n\n` + body;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
              console.log('Updated comment with running banner');
            } else {
              console.log('No existing benchmark comment found, skipping banner');
            }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Benchmark PR branch
        id: pr_benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}

          echo "=== Benchmarking PR branch ==="

          # Startup benchmark (no LLM)
          echo "Running startup benchmark..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output pr_startup.json

          # LLM benchmark (if API key available)
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "has_api_key=true" >> "$GITHUB_OUTPUT"
            echo "Running LLM benchmark..."
            python scripts/cli_performance_benchmark.py \
              --e2e-only \
              --iterations "$ITERATIONS" \
              --model "openrouter/anthropic/claude-haiku-4.5" \
              --output pr_llm.json
          else
            echo "has_api_key=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ OPENROUTER_API_KEY not available - LLM benchmark skipped"
          fi

      - name: Save PR results and checkout master
        run: |
          cp pr_startup.json /tmp/pr_startup.json
          [ -f pr_llm.json ] && cp pr_llm.json /tmp/pr_llm.json || true
          cp scripts/cli_performance_benchmark.py /tmp/cli_performance_benchmark.py
          git checkout origin/master
          mkdir -p scripts
          cp /tmp/cli_performance_benchmark.py scripts/cli_performance_benchmark.py

      - name: Fresh environment for master (true cold start)
        run: |
          echo "=== Clearing all caches for true cold start ==="

          # Clear Python bytecode cache
          find . -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find . -name "*.pyc" -delete 2>/dev/null || true

          # Remove venv
          rm -rf .venv

          # Clear Holmes cache
          rm -rf ~/.holmes

          # Clear pip/poetry caches
          rm -rf ~/.cache/pip ~/.cache/pypoetry

          # Drop OS page cache, dentries, inodes
          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'

          # Memory pressure to evict any remaining cached data
          # Read 8GB to exceed runner's 7GB RAM and force cache eviction
          dd if=/dev/urandom bs=1M count=8000 2>/dev/null | cat > /dev/null || true

          # Drop caches again after memory pressure
          sync
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches'

          echo "✓ Cleared: bytecode, venv, ~/.holmes, pip/poetry cache, OS page cache"

      - name: Install dependencies (master)
        run: poetry install --no-interaction

      - name: Benchmark master branch
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}

          echo "=== Benchmarking master branch ==="

          # Startup benchmark (no LLM)
          echo "Running startup benchmark..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output /tmp/master_startup.json

          # LLM benchmark (if API key available)
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "Running LLM benchmark..."
            python scripts/cli_performance_benchmark.py \
              --e2e-only \
              --iterations "$ITERATIONS" \
              --model "openrouter/anthropic/claude-haiku-4.5" \
              --output /tmp/master_llm.json
          else
            echo "⚠️ OPENROUTER_API_KEY not available - LLM benchmark skipped"
          fi

      - name: Generate comparison report
        id: compare
        run: |
          rm -f scripts/cli_performance_benchmark.py
          git checkout ${{ github.head_ref }}

          cp /tmp/pr_startup.json pr_startup.json
          cp /tmp/master_startup.json master_startup.json
          [ -f /tmp/pr_llm.json ] && cp /tmp/pr_llm.json pr_llm.json || true
          [ -f /tmp/master_llm.json ] && cp /tmp/master_llm.json master_llm.json || true

          python3 << 'PYEOF'
          import json
          from pathlib import Path

          def load_json(path):
              p = Path(path)
              return json.loads(p.read_text()) if p.exists() else None

          def format_benchmark_table(name, description, pr, master):
              """Generate consistent benchmark table format."""
              cold_diff = ((pr['cold_start_seconds'] - master['cold_start_seconds']) / master['cold_start_seconds']) * 100
              warm_diff = ((pr['warm_mean_seconds'] - master['warm_mean_seconds']) / master['warm_mean_seconds']) * 100

              # Determine status emoji for section
              if warm_diff < -10:
                  status_emoji = '🟢'
              elif warm_diff > 20:
                  status_emoji = '🔴'
              else:
                  status_emoji = '🟡'

              lines = [
                  f"### {status_emoji} {name}",
                  f"_{description}_",
                  "",
                  "| Metric | PR | Master | Change |",
                  "|--------|-----|--------|--------|",
                  f"| Cold Start | {pr['cold_start_seconds']:.2f}s | {master['cold_start_seconds']:.2f}s | {cold_diff:+.1f}% |",
                  f"| Warm Mean | {pr['warm_mean_seconds']:.2f}s | {master['warm_mean_seconds']:.2f}s | {warm_diff:+.1f}% |",
                  f"| Warm Min | {pr['warm_min_seconds']:.2f}s | {master['warm_min_seconds']:.2f}s | |",
                  f"| Warm Max | {pr['warm_max_seconds']:.2f}s | {master['warm_max_seconds']:.2f}s | |",
              ]
              return lines, warm_diff

          # Load results
          pr_startup = load_json('pr_startup.json')
          master_startup = load_json('master_startup.json')
          pr_llm = load_json('pr_llm.json')
          master_llm = load_json('master_llm.json')

          report_lines = ["## 🔬 CLI Performance Benchmark", ""]

          # Startup benchmark section
          startup_lines, startup_diff = format_benchmark_table(
              "Startup Time (no LLM)",
              "Measures `holmes version` execution time (imports + initialization)",
              pr_startup, master_startup
          )
          report_lines.extend(startup_lines)

          # LLM benchmark section
          report_lines.append("")
          if pr_llm and master_llm:
              llm_lines, llm_diff = format_benchmark_table(
                  "Full CLI with LLM",
                  "Measures `holmes ask` execution time (OpenRouter + Haiku 4.5)",
                  pr_llm, master_llm
              )
              report_lines.extend(llm_lines)
          else:
              report_lines.extend([
                  "### ⚠️ Full CLI with LLM",
                  "_Skipped - OPENROUTER_API_KEY not configured in repository secrets._",
              ])

          # Footer
          report_lines.extend([
              "",
              "---",
              f"**PR**: `{pr_startup['git_sha']}` | **Master**: `{master_startup['git_sha']}` | **Iterations**: {pr_startup['iterations']}",
          ])

          # Determine overall status
          if startup_diff > 20:
              status = 'regression'
          elif startup_diff < -10:
              status = 'improved'
          else:
              status = 'neutral'

          Path('comparison_report.md').write_text("\n".join(report_lines))
          Path('status.txt').write_text(status)
          PYEOF

          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('comparison_report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && (c.body.includes('CLI Performance Benchmark') || c.body.includes('CLI Startup Benchmark')));
            const body = report + '\n\n*Updated: ' + new Date().toISOString() + '*';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            pr_startup.json
            master_startup.json
            pr_llm.json
            master_llm.json
            comparison_report.md

      - name: Check for regression
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "regression" ]; then
            echo "❌ Startup time regression detected (>20% slower)"
            exit 1
          fi
          echo "✅ No startup regression"
