name: CLI Performance Benchmark

# Measures CLI startup time to catch import/init regressions.
# Two benchmarks:
# 1. Without LLM: `holmes version` - measures pure startup overhead
# 2. With LLM: `holmes ask` - verifies full CLI works end-to-end

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of benchmark iterations'
        required: false
        default: '5'

jobs:
  benchmark-without-llm:
    name: "Benchmark: Startup Time (no LLM)"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Benchmark PR branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking PR branch (holmes version)..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output pr_benchmark.json

      - name: Save PR results and checkout master
        run: |
          cp pr_benchmark.json /tmp/pr_benchmark.json
          cp scripts/cli_performance_benchmark.py /tmp/cli_performance_benchmark.py
          git checkout origin/master
          mkdir -p scripts
          cp /tmp/cli_performance_benchmark.py scripts/cli_performance_benchmark.py

      - name: Install dependencies (master)
        run: poetry install --no-interaction

      - name: Benchmark master branch
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          echo "Benchmarking master branch (holmes version)..."
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output /tmp/master_benchmark.json

      - name: Compare results
        id: compare
        run: |
          rm -f scripts/cli_performance_benchmark.py
          git checkout ${{ github.head_ref }}
          cp /tmp/pr_benchmark.json pr_benchmark.json
          cp /tmp/master_benchmark.json master_benchmark.json

          python3 << 'PYEOF'
          import json
          from pathlib import Path

          pr = json.loads(Path('pr_benchmark.json').read_text())
          master = json.loads(Path('master_benchmark.json').read_text())

          cold_diff_pct = ((pr['cold_start_seconds'] - master['cold_start_seconds']) / master['cold_start_seconds']) * 100
          warm_diff_pct = ((pr['warm_mean_seconds'] - master['warm_mean_seconds']) / master['warm_mean_seconds']) * 100

          if warm_diff_pct < -10:
              status, emoji = 'improved', '🟢'
          elif warm_diff_pct > 20:
              status, emoji = 'regression', '🔴'
          else:
              status, emoji = 'neutral', '🟡'

          cold_emoji = '🔴' if cold_diff_pct > 20 else ('🟢' if cold_diff_pct < -10 else '🟡')

          report_lines = [
              f"## {emoji} CLI Startup Benchmark (no LLM): {status.upper()}",
              "",
              "Measures **holmes version** execution time (imports + initialization).",
              "",
              f"### {cold_emoji} Cold Start (first run)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Time | {pr['cold_start_seconds']:.3f}s | {master['cold_start_seconds']:.3f}s | {cold_diff_pct:+.1f}% |",
              "",
              "### Warm Start (cached runs)",
              "",
              "| Metric | PR | Master | Change |",
              "|--------|-----|--------|--------|",
              f"| Mean | {pr['warm_mean_seconds']:.3f}s | {master['warm_mean_seconds']:.3f}s | {warm_diff_pct:+.1f}% |",
              f"| Min | {pr['warm_min_seconds']:.3f}s | {master['warm_min_seconds']:.3f}s | |",
              f"| Max | {pr['warm_max_seconds']:.3f}s | {master['warm_max_seconds']:.3f}s | |",
              "",
              f"**PR**: {pr['git_sha']} | **Master**: {master['git_sha']} | **Iterations**: {pr['iterations']}",
          ]

          if status == 'regression':
              report_lines.extend(["", "⚠️ **Regression detected!** Check for new imports or initialization overhead."])
          elif status == 'improved':
              report_lines.extend(["", "✨ **Performance improved!**"])

          Path('comparison_report.md').write_text("\n".join(report_lines))
          Path('status.txt').write_text(status)
          PYEOF

          echo "status=$(cat status.txt)" >> "$GITHUB_OUTPUT"
          delimiter="$(openssl rand -hex 16)"
          echo "report<<${delimiter}" >> "$GITHUB_OUTPUT"
          cat comparison_report.md >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.compare.outputs.report }}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('CLI Startup Benchmark'));
            const body = report + '\n\n---\n*Updated: ' + new Date().toISOString() + '*';
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-no-llm-${{ github.run_id }}
          path: |
            pr_benchmark.json
            master_benchmark.json
            comparison_report.md

      - name: Check for regression
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "regression" ]; then
            echo "❌ Startup time regression detected (>20% slower)"
            exit 1
          fi
          echo "✅ No startup regression"

  benchmark-with-llm:
    name: "Benchmark: Full CLI (with LLM)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Benchmark with LLM (holmes ask)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        run: |
          echo "Benchmarking full CLI with LLM (holmes ask)..."
          python scripts/cli_performance_benchmark.py \
            --e2e-only \
            --iterations 2 \
            --output benchmark_with_llm.json

          python3 -c "
          import json
          r = json.loads(open('benchmark_with_llm.json').read())
          print('✅ CLI with LLM works')
          print(f'   Cold: {r[\"cold_start_seconds\"]:.2f}s')
          print(f'   Warm: {r[\"warm_mean_seconds\"]:.2f}s')
          "

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-with-llm-${{ github.run_id }}
          path: benchmark_with_llm.json
