name: CLI Performance Benchmark

# Measures CLI startup time (deterministic) to catch import/init regressions.
# Reports both cold start (first run) and warm start (subsequent runs).
# Persists baseline results for historical comparison.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]  # Update baseline on merge
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of startup benchmark iterations'
        required: false
        default: '5'
      run_e2e:
        description: 'Also run e2e benchmark (requires API key)'
        required: false
        type: boolean
        default: false

jobs:
  startup-benchmark:
    name: Startup Time Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # Restore baseline from cache (if exists)
      - name: Restore baseline cache
        id: baseline-cache
        uses: actions/cache/restore@v4
        with:
          path: .benchmark-baseline
          key: cli-benchmark-baseline-${{ runner.os }}

      # Benchmark current code
      - name: Run startup benchmark
        run: |
          ITERATIONS=${{ github.event.inputs.iterations || '5' }}
          python scripts/cli_performance_benchmark.py \
            --startup-only \
            --iterations "$ITERATIONS" \
            --output current_benchmark.json

      # Compare with baseline (if PR) or update baseline (if push to master)
      - name: Compare with baseline
        id: compare
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .benchmark-baseline/baseline.json ]; then
            echo "Comparing against cached baseline..."

            # Generate comparison report
            python << 'EOF'
          import json
          from pathlib import Path

          current = json.loads(Path('current_benchmark.json').read_text())
          baseline = json.loads(Path('.benchmark-baseline/baseline.json').read_text())

          # Cold start comparison
          cold_diff_pct = ((current['cold_start_seconds'] - baseline['cold_start_seconds']) / baseline['cold_start_seconds']) * 100

          # Warm start comparison
          warm_diff_pct = ((current['warm_mean_seconds'] - baseline['warm_mean_seconds']) / baseline['warm_mean_seconds']) * 100

          # Determine status
          if warm_diff_pct < -10:
              status, emoji = 'improved', '🟢'
          elif warm_diff_pct > 20:
              status, emoji = 'regression', '🔴'
          else:
              status, emoji = 'neutral', '🟡'

          # Cold start status
          if cold_diff_pct > 20:
              cold_status, cold_emoji = 'regression', '🔴'
          elif cold_diff_pct < -10:
              cold_status, cold_emoji = 'improved', '🟢'
          else:
              cold_status, cold_emoji = 'neutral', '🟡'

          report = f"""## {emoji} CLI Startup Benchmark: {status.upper()}

          Measures `holmes version` execution time (imports + initialization).

          ### {cold_emoji} Cold Start (first run, no caches)

          | Metric | PR | Baseline | Change |
          |--------|-----|----------|--------|
          | Cold Start | {current['cold_start_seconds']:.3f}s | {baseline['cold_start_seconds']:.3f}s | {cold_diff_pct:+.1f}% |

          ### Warm Start (subsequent runs)

          | Metric | PR | Baseline | Change |
          |--------|-----|----------|--------|
          | Mean | {current['warm_mean_seconds']:.3f}s | {baseline['warm_mean_seconds']:.3f}s | {warm_diff_pct:+.1f}% |
          | Min | {current['warm_min_seconds']:.3f}s | {baseline['warm_min_seconds']:.3f}s | |
          | Max | {current['warm_max_seconds']:.3f}s | {baseline['warm_max_seconds']:.3f}s | |

          **PR**: `{current['git_sha']}` | **Baseline**: `{baseline['git_sha']}` | **Iterations**: {current['iterations']}
          """

          if status == 'regression':
              report += """
          ⚠️ **Warm start regression detected!** Check for:
          - New heavy imports at module level
          - Initialization code that runs on import
          - New dependencies with slow imports
          """
          elif status == 'improved':
              report += "\n✨ **Warm start improved!**\n"

          if cold_status == 'regression':
              report += "\n🥶 **Cold start regression!** First-run experience is slower.\n"

          Path('comparison_report.md').write_text(report)
          print(f"STATUS={status}")
          print(f"COLD_STATUS={cold_status}")
          EOF

            echo "status=$(python -c "import json; c=json.loads(open('current_benchmark.json').read()); b=json.loads(open('.benchmark-baseline/baseline.json').read()); d=((c['warm_mean_seconds']-b['warm_mean_seconds'])/b['warm_mean_seconds'])*100; print('regression' if d > 20 else ('improved' if d < -10 else 'neutral'))")" >> $GITHUB_OUTPUT
          else
            echo "No baseline found, this is the first run."
            cat current_benchmark.json > comparison_report.md
            echo "## 📊 CLI Startup Benchmark (No Baseline)" > comparison_report.md
            echo "" >> comparison_report.md
            python -c "import json; c=json.loads(open('current_benchmark.json').read()); print(f'**Cold Start**: {c[\"cold_start_seconds\"]:.3f}s'); print(f'**Warm Mean**: {c[\"warm_mean_seconds\"]:.3f}s')" >> comparison_report.md
            echo "status=neutral" >> $GITHUB_OUTPUT
          fi

          echo "report<<EOF" >> $GITHUB_OUTPUT
          cat comparison_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # Update baseline on push to master
      - name: Update baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p .benchmark-baseline
          cp current_benchmark.json .benchmark-baseline/baseline.json
          echo "Baseline updated with results from $(cat current_benchmark.json | python -c 'import json,sys; print(json.load(sys.stdin)[\"git_sha\"])')"

      - name: Save baseline cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: .benchmark-baseline
          key: cli-benchmark-baseline-${{ runner.os }}-${{ github.sha }}

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const report = `${{ steps.compare.outputs.report }}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('CLI Startup Benchmark')
            );

            const body = report + '\n\n---\n*Updated: ' + new Date().toISOString() + '*';

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: startup-benchmark-${{ github.run_id }}
          path: |
            current_benchmark.json
            comparison_report.md

      - name: Check for regression
        if: github.event_name == 'pull_request'
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "regression" ]; then
            echo "❌ Startup time regression detected (>20% slower)"
            exit 1
          fi
          echo "✅ No startup regression"

  e2e-sanity-check:
    name: E2E Sanity Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.inputs.run_e2e == 'true' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run e2e sanity check
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
        run: |
          echo "Running e2e sanity check..."
          python scripts/cli_performance_benchmark.py \
            --e2e-only \
            --iterations 2 \
            --output e2e_result.json

          # Show results
          python -c "
          import json
          r = json.loads(open('e2e_result.json').read())
          print(f'✅ E2E sanity check passed')
          print(f'   Cold: {r[\"cold_start_seconds\"]:.2f}s')
          print(f'   Warm: {r[\"warm_mean_seconds\"]:.2f}s')
          "

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-sanity-${{ github.run_id }}
          path: e2e_result.json
