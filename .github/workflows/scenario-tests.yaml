name: Scenario tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      scenarios: ${{ steps.find.outputs.scenarios }}
    steps:
      - uses: actions/checkout@v4

      - name: Find scenarios missing evidence
        id: find
        run: |
          scenarios='[]'
          for dir in tests/scenarios/*/; do
            [ -f "$dir/scenario.sh" ] || continue
            if [ ! -f "$dir/evidence.md" ]; then
              name=$(basename "$dir")
              scenarios=$(echo "$scenarios" | jq -c --arg s "$name" '. + [$s]')
            fi
          done
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "Scenarios to run: $scenarios"

  run:
    needs: discover
    if: needs.discover.outputs.scenarios != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scenario: ${{ fromJson(needs.discover.outputs.scenarios) }}
      fail-fast: false

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: branch
          ref: ${{ github.head_ref }}
          # Need push access to commit evidence back
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          path: master
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (branch)
        working-directory: branch
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root

      - name: Install dependencies (master)
        working-directory: master
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root

      # Future scenarios that need Kind can add a conditional step here:
      # - name: Setup KIND cluster
      #   if: <scenario needs k8s>
      #   uses: ./branch/.github/actions/setup-kind-cluster

      - name: Run scenario
        env:
          MASTER_ROOT: ${{ github.workspace }}/master
          BRANCH_ROOT: ${{ github.workspace }}/branch
        run: |
          bash "branch/tests/scenarios/${{ matrix.scenario }}/scenario.sh"

      - name: Commit evidence
        working-directory: branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          evidence="tests/scenarios/${{ matrix.scenario }}/evidence.md"
          if [ -f "$evidence" ]; then
            git add "$evidence"
            git commit -s -m "Add scenario evidence: ${{ matrix.scenario }}"
            git push
          fi

      - name: Post evidence to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `branch/tests/scenarios/${{ matrix.scenario }}/evidence.md`;
            if (!fs.existsSync(path)) return;
            const evidence = fs.readFileSync(path, 'utf8');
            const marker = `<!-- scenario:${{ matrix.scenario }} -->`;

            // Find existing comment to update
            const {data: comments} = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            const body = `${marker}\n${evidence}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
