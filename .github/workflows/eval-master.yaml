name: Run eval regression on master

on:
  # The master baseline no longer runs automatically on every push to master —
  # that per-merge eval cost has been removed. Refresh the baseline on demand via
  # workflow_dispatch (e.g. one-off baselines or re-running after a fix).
  workflow_dispatch:
    inputs:
      models:
        description: 'Comma-separated models to baseline (default opus-4.6)'
        required: false
        default: 'opus-4.6'

env:
  DEFAULT_MASTER_MODELS: 'opus-4.6'
  # Tool commands run under `ulimit -v`, which caps virtual address space,
  # so Go binaries (kubectl, helm) can crash at startup before using any
  # memory. Under parallel eval load the 800 MB default crashed ~20% of
  # kubectl calls and 1200 MB crashed every one; 1536 MB crashed none in
  # 1,600 runs. ROB-819 replaces the ulimit itself.
  TOOL_MEMORY_LIMIT_MB: "1536"

jobs:
  run-master-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Newer master pushes supersede in-flight runs — only the latest matters
    # as the baseline.
    concurrency:
      group: eval-master
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup HolmesGPT environment
        uses: ./.github/actions/setup-holmes-env
        with:
          python-version: '3.12'
          install-kubectl: 'true'

      - name: Setup KIND cluster
        uses: ./.github/actions/setup-kind-cluster
        with:
          cluster-name: 'kind'
          wait-for-ready: 'true'

      - name: Create model list file
        run: |
          cat > /tmp/model_list.yaml << 'EOF'
          ${{ secrets.MODEL_LIST_YAML }}
          EOF

      - name: Verify models
        uses: ./.github/actions/verify-models
        with:
          models: ${{ github.event.inputs.models || env.DEFAULT_MASTER_MODELS }}
        env:
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          MODEL_LIST_FILE_LOCATION: /tmp/model_list.yaml

      - name: Run regression evals on master HEAD
        env:
          AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
          AZURE_API_KEY: ${{ secrets.AZURE_API_KEY }}
          AZURE_API_VERSION: ${{ secrets.AZURE_API_VERSION }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION_NAME }}
          BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_API_KEY: ${{ secrets.CONFLUENCE_API_KEY }}
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
          MODEL_LIST_FILE_LOCATION: /tmp/model_list.yaml
          # This name must match MASTER_EXPERIMENT_PREFIX in braintrust_history.py
          EXPERIMENT_ID: "master-${{ github.run_id }}"
          CLASSIFIER_MODEL: ${{ vars.CLASSIFIER_MODEL || 'gpt-6.1-sol-medium' }}
          MODELS: ${{ github.event.inputs.models || env.DEFAULT_MASTER_MODELS }}
          # Keeps the log streaming live while stdout is a pipe into tee.
          PYTHONUNBUFFERED: "1"
        run: |
          set -o pipefail
          ./run_benchmarks_local.py --markers regression --models "$MODELS" --iterations 1 2>&1 | tee "$RUNNER_TEMP/eval-output.log"

      # The Braintrust SDK drops a whole upload batch when the API rejects one
      # record in it, so results vanish from the experiment while every test
      # still reports normally. Warn rather than fail: the pytest output and
      # report still hold every result.
      - name: Check for dropped Braintrust uploads
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/eval-output.log"
          [[ -f "$LOG" ]] || exit 0
          DROPS=$(grep -c "Dropping batch" "$LOG" || true)
          if [[ "$DROPS" -gt 0 ]]; then
            echo "::warning title=Braintrust uploads dropped::Braintrust dropped $DROPS upload batches, so the experiment is missing results. Search the eval step's log for 'Dropping batch' to see the rejected records."
            echo "> [!WARNING]" >> "$GITHUB_STEP_SUMMARY"
            echo "> Braintrust dropped $DROPS upload batches; the experiment is missing results." >> "$GITHUB_STEP_SUMMARY"
          fi
