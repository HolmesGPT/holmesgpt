# Prometheus configuration with custom alerting rules
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules.yml

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

  rules.yml: |
    groups:
      - name: order-processing
        rules:
          - alert: OrderProcessingLatencyHigh
            expr: histogram_quantile(0.95, sum(rate(order_processing_duration_seconds_bucket{namespace="app-195"}[5m])) by (le, service)) > 2
            for: 5m
            labels:
              severity: warning
              team: payments
            annotations:
              summary: "High order processing latency detected"
              description: "95th percentile order processing time is above 2 seconds for service {{ $labels.service }}"
              runbook_url: "https://wiki.example.com/runbooks/order-latency"

          - alert: OrderProcessingErrorRate
            expr: sum(rate(order_processing_errors_total{namespace="app-195"}[5m])) / sum(rate(order_processing_requests_total{namespace="app-195"}[5m])) > 0.05
            for: 10m
            labels:
              severity: critical
              team: payments
            annotations:
              summary: "High order processing error rate"
              description: "Error rate is above 5% for order processing"

      - name: inventory-alerts
        rules:
          - alert: LowInventoryStock
            expr: inventory_stock_count{namespace="app-195"} < 10
            for: 15m
            labels:
              severity: info
              team: warehouse
            annotations:
              summary: "Low inventory stock for {{ $labels.product }}"
              description: "Product {{ $labels.product }} has less than 10 items in stock"
