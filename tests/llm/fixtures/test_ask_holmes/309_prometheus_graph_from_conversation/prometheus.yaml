# Self-hosted Prometheus for eval 309. Scrapes the kubelet's cAdvisor endpoint
# through the API server proxy (hence the cluster-scoped RBAC).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: app-309
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: app-309-prometheus
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: app-309-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: app-309-prometheus
subjects:
- kind: ServiceAccount
  name: prometheus
  namespace: app-309
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: app-309
data:
  prometheus.yml: |
    global:
      scrape_interval: 10s
      evaluation_interval: 10s
    scrape_configs:
    - job_name: kubelet
      scheme: https
      authorization:
        credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - target_label: __address__
        replacement: kubernetes.default.svc:443
      - source_labels: [__meta_kubernetes_node_name]
        target_label: __metrics_path__
        replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
      - source_labels: [__meta_kubernetes_node_name]
        target_label: instance
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
      - target_label: metrics_path
        replacement: /metrics/cadvisor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: app-309
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.5.0
        args:
        - "--config.file=/etc/prometheus/prometheus.yml"
        - "--storage.tsdb.path=/prom"
        ports:
        - containerPort: 9090
          name: http
        readinessProbe:
          httpGet:
            path: /-/ready
            port: http
          periodSeconds: 3
        volumeMounts:
        - name: cfg
          mountPath: /etc/prometheus
        - name: data
          mountPath: /prom
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
      volumes:
      - name: cfg
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: app-309
spec:
  selector: { app: prometheus }
  ports:
  - name: http
    port: 9090
    targetPort: http
