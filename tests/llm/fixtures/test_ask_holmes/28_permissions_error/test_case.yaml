user_prompt: "list all clusterroles in the cluster"
expected_output:
  - user is told they don't have access to list clusterroles
  - should provide link to Holmes documentation for configuring permissions (https://holmesgpt.dev/data-sources/permissions/)
before_test: ./setup_restricted_access.sh
after_test: ./cleanup_restricted_access.sh
test_env_vars:
  # Fixed path (no $TMPDIR): the harness expands this with os.path.expandvars,
  # so an unset TMPDIR would leave a literal, broken path. Kept in sync with
  # setup_restricted_access.sh / cleanup_restricted_access.sh.
  KUBECONFIG: "/tmp/holmes-test-28-permissions/restricted-kubeconfig"
tags:
  - easy
  - transparency
