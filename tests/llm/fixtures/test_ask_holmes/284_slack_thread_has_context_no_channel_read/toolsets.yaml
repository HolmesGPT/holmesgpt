toolsets:
  kubernetes/core: { enabled: false }
  kubernetes/logs: { enabled: false }
  helm/core: { enabled: false }
  core_investigation: { enabled: false }
  internet: { enabled: false }
  skills: { enabled: false }
  robusta: { enabled: false }
  connectivity_check: { enabled: false }
  bash: { enabled: false }

mcp_servers:
  # Shared with 283 — same Slack stub (same relay tool prompt) and same mock
  # cluster tools, so the two evals cannot diverge on the tool descriptions.
  robusta_platform:
    enabled: true
    config:
      mode: stdio
      command: python
      args: ["tests/llm/fixtures/test_ask_holmes/283_slack_channel_history_context/slack_mcp_stub.py"]
  cluster_tools:
    enabled: true
    config:
      mode: stdio
      command: python
      args: ["tests/llm/fixtures/test_ask_holmes/283_slack_channel_history_context/cluster_tools_mock.py"]
