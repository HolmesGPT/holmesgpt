user_prompt: "What's wrong with api-gateway pod in namespace-67?"
tags:
  - logs
  - context_window
expected_output:
  - API gateway experiencing gradual performance degradation with response times increasing from 100ms to timeout after 5000ms
before_test: |
  # Create namespace first since the secret depends on it (|| true ignores if it already exists)
  kubectl create namespace namespace-67 || true
  kubectl create secret generic api-gateway-logs-script \
  --from-file=generate_logs.py=./generate_logs.py \
  -n namespace-67 --dry-run=client -o yaml | kubectl apply -f -
  kubectl apply -f ./manifest.yaml
  # Wait until the pod has emitted its complete log history (the script
  # prints everything at startup); a fixed sleep is racy on slow clusters
  LOGS_READY=false
  for i in {1..60}; do
    if kubectl logs deployment/api-gateway -n namespace-67 --tail=20 2>/dev/null | grep -q "Request timeout after 5000ms"; then
      echo "✅ Log history fully emitted"
      LOGS_READY=true
      break
    fi
    sleep 2
  done
  if [ "$LOGS_READY" = false ]; then
    echo "❌ Log history did not appear within 120 seconds"
    kubectl get pods -n namespace-67
    kubectl logs deployment/api-gateway -n namespace-67 --tail=5 2>/dev/null || true
    exit 1
  fi
after_test: |
  kubectl delete -f ./manifest.yaml
  kubectl delete secret api-gateway-logs-script -n namespace-67 --ignore-not-found
  kubectl delete namespace namespace-67 --ignore-not-found
evaluation:
  correctness: 1
