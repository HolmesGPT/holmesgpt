# Test: Elasticsearch Disk Space Investigation
#
# This test creates multiple indexes with varying sizes to simulate a cluster
# where disk usage needs to be investigated.
#
# Setup:
# - 20 small indexes (holmes-logs-app-XX) with minimal data (~10 docs each)
# - 1 large index (holmes-metrics-analytics) with 5000 docs containing larger payloads
#
# The LLM must use the _cat/indices API (sorted by size) to identify which index
# is consuming the most disk space. The large index should be significantly bigger.
#
# Anti-hallucination: The specific index name and relative size can only be found by querying.
#
# Requirements:
# - ELASTICSEARCH_URL: URL to Elasticsearch cluster
# - ELASTICSEARCH_API_KEY: API key for authentication

user_prompt: "We're running low on disk space in our Elasticsearch cluster. Can you identify which index is consuming the most storage? Please tell me the index name and approximately how much space it's using."

expected_output:
  - "Must identify holmes-metrics-analytics as the largest index"
  - "Must report the storage size (should be significantly larger than other indexes)"

tags:
  - elasticsearch
  - medium
  - scale

setup_timeout: 120

before_test: |
  set -e

  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  if [ -z "$ELASTICSEARCH_URL" ]; then
    echo "ELASTICSEARCH_URL environment variable is not set"
    exit 1
  fi

  echo "Creating test indexes for disk space investigation..."

  # Clean up any existing test data first
  echo "Cleaning up any existing test data..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-logs-app-*" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-metrics-analytics" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  # Create 20 small indexes via bulk insert
  BULK_FILE="/tmp/es_disk_small_bulk.ndjson"
  > "$BULK_FILE"

  for i in $(seq -w 1 20); do
    INDEX_NAME="holmes-logs-app-${i}"
    for j in $(seq 1 10); do
      printf '{"index": {"_index": "%s"}}\n' "$INDEX_NAME" >> "$BULK_FILE"
      printf '{"@timestamp": "2024-01-15T12:00:00Z", "level": "INFO", "message": "Application started successfully", "service": "app-%s"}\n' "$i" >> "$BULK_FILE"
    done
  done

  echo "Creating 20 small indexes with 10 docs each..."
  RESPONSE=$(curl -s -X POST "${ELASTICSEARCH_URL}/_bulk" \
    -H "Content-Type: application/x-ndjson" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    --data-binary @"$BULK_FILE")

  if echo "$RESPONSE" | grep -q '"errors":false'; then
    echo "Small indexes created successfully"
  else
    echo "Some errors during bulk insert for small indexes"
  fi

  # Create the large analytics index
  echo "Creating large analytics index (holmes-metrics-analytics)..."
  curl -s -X PUT "${ELASTICSEARCH_URL}/holmes-metrics-analytics" \
    -H "Content-Type: application/json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    -d '{"settings": {"number_of_shards": 1, "number_of_replicas": 0}}' > /dev/null

  # Generate bulk file with 5000 documents using bash
  LARGE_BULK="/tmp/es_disk_large_bulk.ndjson"
  > "$LARGE_BULK"

  # Create a 500 char payload
  PAYLOAD=$(printf 'X%.0s' $(seq 1 500))

  for i in $(seq 1 5000); do
    HOST_NUM=$(printf '%04d' $i)
    VAL=$((i % 100))
    printf '{"index": {"_index": "holmes-metrics-analytics"}}\n' >> "$LARGE_BULK"
    printf '{"@timestamp": "2024-01-15T12:00:00Z", "metric_type": "cpu_usage", "host": "server-%s", "value": %d, "data": "%s"}\n' "$HOST_NUM" "$VAL" "$PAYLOAD" >> "$LARGE_BULK"
  done

  echo "Inserting 5000 documents..."
  split -l 1000 "$LARGE_BULK" /tmp/es_disk_batch_

  for batch in /tmp/es_disk_batch_*; do
    RESPONSE=$(curl -s -X POST "${ELASTICSEARCH_URL}/_bulk" \
      -H "Content-Type: application/x-ndjson" \
      -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
      --data-binary @"$batch")

    if echo "$RESPONSE" | grep -q '"errors":false'; then
      echo "Batch inserted successfully"
    else
      echo "Some errors in batch"
    fi
  done

  # Force refresh to update disk stats
  curl -s -X POST "${ELASTICSEARCH_URL}/_refresh" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" > /dev/null

  sleep 3

  # Verify disk usage
  echo "Verifying disk usage..."
  curl -s -X GET "${ELASTICSEARCH_URL}/_cat/indices/holmes-*?h=index,store.size&s=store.size:desc" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" | head -5

  echo "Setup complete!"

after_test: |
  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  echo "Cleaning up test indexes..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-logs-app-*" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-metrics-analytics" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  rm -f /tmp/es_disk_*.ndjson /tmp/es_disk_batch_* /tmp/gen_bulk.py

  echo "Cleanup complete"
