user_prompt: "What CPU metrics are available in this cluster? List all the CPU-related metrics that Prometheus is collecting."

# Outcome-based: judge what the user learns (real metric names retrieved from
# Prometheus), not which internal tool name performed the query.
expected_output:
  - "Must list CPU-related metric names actually retrieved from Prometheus (a metric-names tool call or a Prometheus API query returning metric names must appear in the tool calls) - not guessed from memory"
  - "Must include the metric container_cpu_usage_seconds_total"

tags:
  - prometheus
  - easy
  - no-cicd

include_tool_calls: true

before_test: |
  # this test assumes Prometheus already exists in the cluster in the default namespace
  [ "$(kubectl get svc robusta-kube-prometheus-st-prometheus -n default -o jsonpath='{.spec.ports[?(@.port==9090)].port}' 2>/dev/null)" = "9090" ] \
  || { echo "❌ Prometheus Service missing or port 9090 not found"; exit 1; }

port_forwards:
  - namespace: default
    service: robusta-kube-prometheus-st-prometheus
    local_port: 10033
    remote_port: 9090
