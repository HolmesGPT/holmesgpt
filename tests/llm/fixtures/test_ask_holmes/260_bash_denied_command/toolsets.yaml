# Bash toolset regression test - a command on the deny list is blocked.
# `ps` is explicitly denied, so `ps aux` is rejected before execution. The model
# should attempt the command, get denied, and report it without fabricating
# output. Kubernetes toolsets are disabled to force use of the bash tool.
toolsets:
  bash:
    enabled: true
    config:
      builtin_allowlist: "extended"
      deny:
        - "ps"
  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  kubernetes/live-metrics:
    enabled: false
  kubernetes/kube-prometheus-stack:
    enabled: false
  kubernetes/krew-extras:
    enabled: false
