user_prompt:
  - "What is the current quality index for smart_tv clients in France? Give me the verification code and all timestamp values."

expected_output:
  - "Must contain verification code TS-EVAL-8k3m5n"
  - "Must report quality_index values including 87.3, 86.9, and 88.1"
  - "Must show the timestamps 2026-03-15T21:10:00Z, 2026-03-15T21:11:00Z, 2026-03-15T21:12:00Z"
  - "The get_content_realtime_timeseries tool call must send time_range as a JSON object (not a string), containing a minutes field"
  - "The get_content_realtime_timeseries tool call must send filters as a JSON object (not a string), with device_name and geo_country_code as keys"
  - "The tool call must NOT use relative_time_interval parameter - that belongs to network analytics tools only"
  - "The tool call must NOT send metrics as a comma-separated string - it must be an array"

include_tool_calls: true

tags:
  - mcp
