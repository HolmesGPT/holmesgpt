user_prompt: "Whats wrong with backend-service pod in namespace-71?"
tags:
  - logs
  - context_window
  - medium
expected_output:
  - Backend service unable to handle requests due to database connection pool exhausted at 100/100 connections causing timeouts
before_test: |
  # Create namespace first since the secret depends on it (|| true ignores if it already exists)
  kubectl create namespace namespace-71 || true
  kubectl create secret generic backend-service-logs-script \
  --from-file=generate_logs.py=./generate_logs.py \
  -n namespace-71 --dry-run=client -o yaml | kubectl apply -f -
  kubectl apply -f ./manifest.yaml
  # Wait until the pod has emitted its complete log history (the script
  # prints everything at startup); a fixed sleep is racy on slow clusters
  LOGS_READY=false
  for i in {1..60}; do
    if kubectl logs deployment/backend-service -n namespace-71 2>/dev/null | grep -q "Pool exhausted (100/100)"; then
      echo "✅ Log history fully emitted"
      LOGS_READY=true
      break
    fi
    sleep 2
  done
  if [ "$LOGS_READY" = false ]; then
    echo "❌ Log history did not appear within 120 seconds"
    kubectl get pods -n namespace-71
    kubectl logs deployment/backend-service -n namespace-71 --tail=5 2>/dev/null || true
    exit 1
  fi
after_test: |
  kubectl delete -f ./manifest.yaml
  kubectl delete secret backend-service-logs-script -n namespace-71 --ignore-not-found
  kubectl delete namespace namespace-71 --ignore-not-found
evaluation:
  correctness: 1
