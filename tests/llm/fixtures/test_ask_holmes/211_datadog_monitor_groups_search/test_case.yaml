description: |
  Tests that Holmes can discover and use the monitor groups_search endpoint when asked
  about per-group status of a multi-group monitor. The challenge is that Holmes must
  figure out the right API endpoint without being told - the user just wants to know
  which host groups are affected by a monitor.

before_test: |
  # Create a monitor that groups by host - this creates multiple monitor groups
  curl -s -X POST "https://api.datadoghq.com/api/v1/monitor" \
    -H "Content-Type: application/json" \
    -H "DD-API-KEY: ${DATADOG_API_KEY}" \
    -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}" \
    -d '{
      "name": "CPU Alert by Host - eval211",
      "type": "metric alert",
      "query": "avg(last_5m):avg:system.cpu.user{*} by {host} > 99.9",
      "message": "High CPU on {{host.name}}",
      "tags": ["env:test", "service:eval211"],
      "options": {
        "thresholds": {"critical": 99.9, "warning": 90},
        "notify_no_data": false,
        "evaluation_delay": 60
      }
    }' | tee /tmp/monitor_response_211.json

  MONITOR_ID=$(cat /tmp/monitor_response_211.json | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
  echo "Created monitor with ID: $MONITOR_ID"
  echo "$MONITOR_ID" > /tmp/monitor_id_211.txt
  sleep 3

user_prompt: "I have a monitor called 'CPU Alert by Host - eval211' that alerts per-host. Can you check which specific hosts or groups this monitor is currently tracking and what their individual statuses are?"

expected_output: |
  Holmes must call the Datadog API with an endpoint containing "groups_search" to get
  per-group status information for the monitor.

  The response should show Holmes discovering and using the groups_search endpoint,
  not just the basic monitor endpoint.

  Must NOT say the endpoint is not allowed or not in the whitelist.

include_tool_calls: true

tags:
  - datadog

test_type: server

after_test: |
  if [ -f /tmp/monitor_id_211.txt ]; then
    MONITOR_ID=$(cat /tmp/monitor_id_211.txt)
    if [ -n "$MONITOR_ID" ]; then
      curl -s -X DELETE "https://api.datadoghq.com/api/v1/monitor/${MONITOR_ID}?force=true" \
        -H "DD-API-KEY: ${DATADOG_API_KEY}" \
        -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}"
    fi
  fi
  rm -f /tmp/monitor_response_211.json /tmp/monitor_id_211.txt
