description: |
  Tests that Holmes can find currently alerting monitors in Datadog. This is the most
  common question an on-call engineer asks. Holmes must discover and use the
  /api/v1/monitor/groups_search endpoint with a status filter to find all monitors
  in alert or warning state across the account.

before_test: |
  # Create a test monitor that will be in OK state (threshold is impossibly high)
  # This ensures Holmes has something to find when searching
  curl -s -X POST "https://api.datadoghq.com/api/v1/monitor" \
    -H "Content-Type: application/json" \
    -H "DD-API-KEY: ${DATADOG_API_KEY}" \
    -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}" \
    -d '{
      "name": "HolmesGPT Eval Test Monitor",
      "type": "metric alert",
      "query": "avg(last_5m):avg:system.cpu.user{*} by {host} > 99.9",
      "message": "CPU threshold exceeded",
      "tags": ["env:holmesgpt-eval", "service:eval211"],
      "options": {
        "thresholds": {"critical": 99.9, "warning": 95},
        "notify_no_data": false
      }
    }' | tee /tmp/monitor_response_211.json

  MONITOR_ID=$(cat /tmp/monitor_response_211.json | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
  echo "$MONITOR_ID" > /tmp/monitor_id_211.txt
  sleep 3

user_prompt: "We got paged overnight. What monitors are currently in an alert or warning state in Datadog?"

expected_output: |
  Holmes must use the Datadog API to search for monitors in alert/warning state.

  The tool call should query monitor groups or monitors filtering by status
  (e.g., using groups_search with status:alert or status:warn, or similar).

  Holmes should report what monitors are alerting (if any) or confirm none are
  currently in alert state.

  Must NOT say the endpoint is blocked or not allowed.

include_tool_calls: true

tags:
  - datadog

test_type: server

after_test: |
  if [ -f /tmp/monitor_id_211.txt ]; then
    MONITOR_ID=$(cat /tmp/monitor_id_211.txt)
    if [ -n "$MONITOR_ID" ]; then
      curl -s -X DELETE "https://api.datadoghq.com/api/v1/monitor/${MONITOR_ID}?force=true" \
        -H "DD-API-KEY: ${DATADOG_API_KEY}" \
        -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}"
    fi
  fi
  rm -f /tmp/monitor_response_211.json /tmp/monitor_id_211.txt
