# Test: Elasticsearch Index Stats Retrieval
# Tests that Holmes can retrieve index-level statistics including document counts and storage
#
# Requirements:
# - ELASTICSEARCH_URL: URL to Elasticsearch cluster
# - ELASTICSEARCH_API_KEY: API key for authentication
#
# Anti-hallucination: The test creates an index with exactly 50 documents.
# The LLM cannot know this count without querying the stats API.

user_prompt: "What are the statistics for the 'holmes-eval-stats' index? Tell me the document count, store size, and indexing rate."

expected_output:
  - "Must report exactly 50 documents in the index"
  - "Must mention the store size (in bytes or human-readable format)"
  - "Should provide information about the index health"

tags:
  - elasticsearch
  - question-answer
  - medium

setup_timeout: 30

before_test: |
  set -e

  # Strip quotes from env vars if present
  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  # Check required environment variables
  if [ -z "$ELASTICSEARCH_URL" ]; then
    echo "❌ ELASTICSEARCH_URL environment variable is not set"
    exit 1
  fi

  export HOLMES_ES_TEST_INDEX="holmes-eval-stats"

  # Delete the index if it exists
  echo "⏳ Cleaning up any existing test index..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/${HOLMES_ES_TEST_INDEX}" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  # Create the test index
  echo "⏳ Creating test index..."
  curl -s -X PUT "${ELASTICSEARCH_URL}/${HOLMES_ES_TEST_INDEX}?wait_for_active_shards=1" \
    -H "Content-Type: application/json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    -d '{
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0
      }
    }'

  sleep 2

  # Create exactly 50 documents using bulk API
  echo "⏳ Indexing 50 documents..."
  BULK_DATA=""
  for i in $(seq 1 50); do
    BULK_DATA="${BULK_DATA}{\"index\":{}}\n{\"id\":$i,\"message\":\"Test document number $i\",\"value\":$((i * 10))}\n"
  done

  echo -e "$BULK_DATA" | curl -s -X POST "${ELASTICSEARCH_URL}/${HOLMES_ES_TEST_INDEX}/_bulk" \
    -H "Content-Type: application/x-ndjson" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    --data-binary @-

  # Refresh the index to ensure all documents are searchable
  curl -s -X POST "${ELASTICSEARCH_URL}/${HOLMES_ES_TEST_INDEX}/_refresh" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}"

  # Verify document count
  DOC_COUNT=$(curl -s -X GET "${ELASTICSEARCH_URL}/${HOLMES_ES_TEST_INDEX}/_count" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" | grep -o '"count":[0-9]*' | cut -d':' -f2)

  if [ "$DOC_COUNT" = "50" ]; then
    echo "✅ Test index created with $DOC_COUNT documents"
  else
    echo "❌ Expected 50 documents but found: $DOC_COUNT"
    exit 1
  fi

after_test: |
  # Strip quotes from env vars if present
  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  echo "⏳ Cleaning up test index: holmes-eval-stats"
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-eval-stats" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true
  echo "✅ Cleanup complete"
