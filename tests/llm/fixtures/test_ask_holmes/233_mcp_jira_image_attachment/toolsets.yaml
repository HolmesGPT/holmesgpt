# MCP Atlassian server (stdio mode via uvx) for Jira image attachment tests
# Uses Confluence SA credentials since they share the same Atlassian Cloud instance
toolsets:
  atlassian-mcp:
    type: mcp
    enabled: true
    config:
      mode: stdio
      command: "uvx"
      args: ["mcp-atlassian"]
      env:
        JIRA_URL: "{{ env.CONFLUENCE_BASE_URL }}"
        JIRA_USERNAME: "{{ env.CONFLUENCE_SA_USER }}"
        JIRA_API_TOKEN: "{{ env.CONFLUENCE_SA_API_KEY }}"
        READ_ONLY_MODE: "true"
  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  helm/core:
    enabled: false
