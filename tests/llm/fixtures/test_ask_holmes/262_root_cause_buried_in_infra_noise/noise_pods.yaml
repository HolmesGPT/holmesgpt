# Unrelated "noise" workloads that inflate pod density in the namespace and
# generate real FailedScheduling warning events. They are permanently Pending
# (impossible nodeSelector) so they never pull an image or consume resources --
# they just make the namespace look busy and troubled, like the real incident
# where ~120 pods were packed into the namespace during autoscaler churn.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ingest-worker-0
      namespace: app-262
      labels: {app: ingest-worker}
    spec:
      nodeSelector: {nodepool: gpu-spot-nonexistent}
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
