apiVersion: v1
kind: Namespace
metadata:
  name: app-290
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: app-290-flavor
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: app-290-cq
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory", "example.com/fake-gpu"]
      flavors:
        - name: app-290-flavor
          resources:
            - name: "cpu"
              nominalQuota: "6"
            - name: "memory"
              nominalQuota: 12Gi
            - name: "example.com/fake-gpu"
              nominalQuota: "2"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: team-a-queue
  namespace: app-290
spec:
  clusterQueue: app-290-cq
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-train
  namespace: app-290
  labels:
    kueue.x-k8s.io/queue-name: team-a-queue
spec:
  suspend: true
  template:
    spec:
      containers:
        - name: trainer
          image: busybox:1.36
          command: ["sh", "-c", "echo training && sleep 3600"]
          resources:
            requests:
              cpu: "200m"
              memory: 128Mi
              example.com/fake-gpu: "3"
            limits:
              example.com/fake-gpu: "3"
      restartPolicy: Never
  backoffLimit: 0
