user_prompt: "Job 'gpu-train' in namespace 'app-290' has been stuck in Pending for over 20 minutes. Investigate using the available tools and determine the root cause."
expected_output:
  - The Workload's QuotaReserved condition is False
  - The Job requests 3 example.com/fake-gpu but the ClusterQueue's quota is only 2
  - The root cause is insufficient quota, not a scheduling or configuration issue

tags:
  - kubernetes
  - easy
  - question-answer

evaluation:
  correctness: 1

# This test installs Kueue (idempotent - skipped if already present at this
# version) and applies a ClusterQueue with a GPU quota of 2, then submits a
# Job requesting 3. Kueue's admission check compares the request against the
# declared ClusterQueue quota before any real pod scheduling happens, so this
# does not require patching any node's real capacity.
before_test: |
  KUEUE_VERSION=v0.19.0
  if kubectl get crd workloads.kueue.x-k8s.io >/dev/null 2>&1; then
    INSTALLED_IMAGE=$(kubectl get deployment/kueue-controller-manager -n kueue-system -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
    if [[ "$INSTALLED_IMAGE" != *"$KUEUE_VERSION"* ]]; then
      echo "❌ an existing Kueue install (image: ${INSTALLED_IMAGE:-none}) does not match the expected ${KUEUE_VERSION}; refusing to reuse it"
      exit 1
    fi
  else
    kubectl apply --server-side -f "https://github.com/kubernetes-sigs/kueue/releases/download/${KUEUE_VERSION}/manifests.yaml"
  fi
  # Bounded wait for the controller to exist and become Available, whether we
  # just installed it or are reusing an install from an earlier fixture in
  # this test run.
  for i in {1..60}; do
    kubectl get deployment/kueue-controller-manager -n kueue-system >/dev/null 2>&1 && break
    sleep 1
  done
  kubectl wait --for=condition=Available deployment/kueue-controller-manager -n kueue-system --timeout=60s

  kubectl apply -f ./manifest.yaml
  # Wait for Kueue to reconcile the Workload and reject it on quota (60s total)
  QUOTA_REJECTED=false
  for i in {1..60}; do
    WORKLOAD=$(kubectl get workload -n app-290 -o name 2>/dev/null | head -1)
    if [ -n "$WORKLOAD" ] && kubectl get "$WORKLOAD" -n app-290 -o jsonpath='{.status.conditions[?(@.type=="QuotaReserved")].status}' 2>/dev/null | grep -q "False"; then
      echo "✅ Workload's QuotaReserved is False as expected!"
      QUOTA_REJECTED=true
      break
    else
      echo "⏳ Attempt $i/60: waiting for Kueue to reconcile the Workload, checking in 1s..."
      sleep 1
    fi
  done
  if [ "$QUOTA_REJECTED" = false ]; then
    echo "❌ Workload did not reach QuotaReserved=False after 60s"
    kubectl get workload -n app-290 -o yaml
    exit 1
  fi

after_test: |
  kubectl delete namespace app-290 --ignore-not-found
  for i in {1..60}; do
    kubectl get namespace app-290 >/dev/null 2>&1 || break
    sleep 1
  done
  kubectl delete clusterqueue app-290-cq --ignore-not-found
  kubectl delete resourceflavor app-290-flavor --ignore-not-found
  if kubectl get namespace app-290 >/dev/null 2>&1; then
    echo "❌ namespace app-290 still exists after bounded teardown wait"
    exit 1
  fi
