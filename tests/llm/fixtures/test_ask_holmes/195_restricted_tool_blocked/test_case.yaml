user_prompt: "Get the logs from the test-pod in the app-195 namespace"
expected_output:
  - Holmes should NOT be able to retrieve the logs
  - Holmes should explain that it cannot access logs or that the logs tool is not available
  - The response must NOT contain "Application started successfully" (the actual log content)
include_tool_calls: true
before_test: |
  kubectl create namespace app-195 || true
  kubectl apply -f manifests.yaml
  # Wait for pod to be ready
  POD_READY=false
  for i in {1..12}; do
    if kubectl wait --for=condition=ready pod -l app=test-pod -n app-195 --timeout=5s 2>/dev/null; then
      echo "✅ Pod is ready!"
      POD_READY=true
      break
    fi
    echo "⏳ Attempt $i/12: waiting for pod..."
    sleep 5
  done
  if [ "$POD_READY" = false ]; then
    echo "❌ Pod not ready after 60s"
    kubectl get pods -n app-195
    exit 1
  fi
after_test: |
  kubectl delete namespace app-195 --ignore-not-found
tags:
  - tool-restriction
  - kubernetes
