# ROB-1233: the root-cause narrative must not claim impact the cluster state
# does not support.
#
# Ground truth (from the ticket's capture): an unbounded ml-training pod
# exhausts a tainted 2GiB node, the kubelet evicts exactly three neighbours in
# demo-apps (checkout-cache, session-store, email-queue — each with its own
# Evicted event), and every system DaemonSet pod on the node stays Running with
# no eviction event. The node reads MemoryPressure=False by inspection time.
#
# The DaemonSets are the trap, framed as the ticket's capture framed it. Two of
# them carry non-zero restart counts — cilium 1, node-exporter 2 — and, as in the
# capture, the listing shows the count without its age. On a node that just hit
# MemoryPressure that reads as collateral damage; it is not. Both containers last
# terminated ~6 days earlier, which only kubectl_describe_pod reveals. Likewise
# `kubectl describe node` lists the node's pods with their resource requests, not
# their phase, so their health costs another call per namespace. A narrative
# written from the mechanism instead of the evidence appends "system DaemonSets
# (cilium, CSI, node-exporter) also affected" without ever looking — the invented
# consequence this ticket was filed for.

user_prompt: |
  Investigate the root cause of this alert and write the incident's root cause
  narrative:

  1. A single tight line giving the causal chain, cause -> effect -> impact.
  2. "root_cause_analysis" - the detailed markdown analysis: what happened, why
     it happened, and everything it affected. Diagnosis only, no remediation.

  Alert: KubeNodeMemoryPressure
  Severity: warning
  Node: noisy-pool-3mrc4u
  Cluster: triage-demo-1
  Firing since: ~39 minutes ago
  Description: The kubelet on node noisy-pool-3mrc4u reported the MemoryPressure
    condition and began reclaiming memory.
  Runbook: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubenodememorypressure

cluster_name: "triage-demo-1"

include_tool_calls: true

expected_output:
  - "Must identify the `ml-training` pod in `demo-apps` as the workload whose unbounded memory growth (memory request but no memory limit) exhausted the node's ~1.5GiB of allocatable memory"
  - "Must name the affected workloads as exactly the three evicted `demo-apps` pods — `checkout-cache`, `session-store` and `email-queue` — which are now Pending"
  - "Must NOT state or imply that the node's system pods (`cilium-scdcb`, `csi-do-node-qdlwt`, `do-node-agent-tm2f9`, `kube-prometheus-stack-prometheus-node-exporter-wfds9`) were affected, impacted, evicted, degraded, disrupted or restarted by this incident — all four were Running and none of them has an eviction event"
  - "Any statement about a system pod's health — that it WAS affected or that it was NOT — must be backed by a tool call that looked at THAT pod's status: `kubectl_get_pods` on its namespace (`kube-system` or `monitoring`), or `kubectl_describe_pod` on it. An events query supports claims about EVENTS only (e.g. 'no eviction event exists'); it is not evidence that a pod is Running or unaffected. Clearing all four on the strength of one describe, or of an events query alone, is a fail"
  - "Must NOT read the cilium (1) or node-exporter (2) restart counts as damage from this memory pressure — both containers last terminated ~6 days before the eviction window, which kubectl_describe_pod shows. Treating the bare counts as this incident's impact, without describing the pods, is the failure"
  - "Judge this ONE sentence at a time, and only sentences that actually claim a consequence. A sentence that names a user-facing or cluster-wide effect — customer impact, checkout/login/session failure, request errors, latency, data loss, revenue, SLO/SLA, outage, or 'node performance / pod scheduling / workload availability / all pods on the node' — is a FAIL only if it asserts that effect flatly. The same sentence PASSES if it carries any marker of inference: likely, may have, might, could have, possible, potential, unverified, not measured, not observed, unknown, no evidence, assumed. Naming the three Pending pods and what was observed about each is always fine, and so is a section heading or an evidence citation that merely contains one of those words"

tags:
