apiVersion: v1
kind: Secret
metadata:
  name: loadgen-script
type: Opaque
stringData:
  run.py: |
    import random
    import threading
    import time

    import requests

    URL = "http://checkout.app-298.svc.cluster.local/checkout"
    DURATION_S = 60
    WORKERS = 6
    counts = {"promo": 0, "plain": 0}
    lock = threading.Lock()


    def worker():
        session = requests.Session()
        deadline = time.time() + DURATION_S
        while time.time() < deadline:
            is_promo = random.random() < 0.5
            coupon = "Promotions" if is_promo else ""
            try:
                session.post(
                    f"{URL}?coupon={coupon}",
                    json={"items": [1, 2, 3], "coupon": coupon},
                    timeout=5,
                )
                with lock:
                    counts["promo" if is_promo else "plain"] += 1
            except requests.RequestException as e:
                print(f"request failed: {e}", flush=True)
            time.sleep(0.05)


    threads = [threading.Thread(target=worker) for _ in range(WORKERS)]
    for t in threads:
        t.start()
    for t in threads:
        t.join()
    print(f"done: {counts}", flush=True)
---
apiVersion: batch/v1
kind: Job
metadata:
  name: loadgen
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: loadgen
        # see Dockerfile in tests/llm/fixtures/shared/python-flask-otel/Dockerfile
        image: me-west1-docker.pkg.dev/robusta-development/development/python-flask-otel:3.0
        imagePullPolicy: IfNotPresent
        command: ["python", "/scripts/run.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        volumeMounts:
        - name: script
          mountPath: /scripts
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
      volumes:
      - name: script
        secret:
          secretName: loadgen-script
