# Effectiveness eval for Slack channel-history context recovery.
#
# Models the real Robusta Slack flow:
#   - The incident channel opens with an ALERT (the channel's first message),
#     followed by a deploy announcement — both served by the channel-history
#     tool (slack_mcp_stub.py), NOT present in the thread.
#   - The THREAD the user is chatting in is passed as conversation_history
#     (exactly how relay builds it from conversations.replies). It does not
#     contain what actually caused the incident.
#   - Holmes must call read_slack_channel_history_by_id to read the channel and
#     recover the cause.
#
# The discriminating facts — release `checkout-api v4.19.2` and deploy id
# `DPL-7Q2X` — live ONLY in the channel history, so the eval cannot be passed
# by hallucinating from the thread alone.

# Run in server mode so conversation_history (the thread) is threaded in the
# same way the Robusta HolmesAPI chat flow does. CLI mode does not support
# conversation history.
test_type: server

# The Slack channel id / thread_ts and the missing-context guidance are supplied
# via the system prompt (frontend.yaml), mirroring relay's
# build_slack_system_prompt_additions. The thread itself is conversation_history.json.
frontend_tools: frontend.yaml

user_prompt:
  - "Can you confirm which change introduced this incident, and give me the
    exact checkout-api release/version and its deploy id?"

expected_output:
  - "Identifies that the release checkout-api v4.19.2 introduced the incident"
  - "Reports the deploy id DPL-7Q2X"
  - "Reads the channel history (calls the read_slack_channel_history_by_id tool)
    to recover the context that is missing from the thread"

# The version/deploy-id are only discoverable by reading channel history, and
# we also assert the channel-history tool was actually called.
include_tool_calls: true
tags: []
