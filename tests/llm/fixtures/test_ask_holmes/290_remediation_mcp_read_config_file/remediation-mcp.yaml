# The real Kubernetes Remediation MCP server, deployed the same way the Holmes
# Helm chart deploys it (scoped RBAC, no secrets access). The eval connects to
# it through a port-forward and exercises the auto-approved tools end to end.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediation-mcp-sa-290
  namespace: app-290
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remediation-mcp-role-290
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale", "replicasets/scale"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["events", "services", "configmaps", "namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remediation-mcp-290
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remediation-mcp-role-290
subjects:
  - kind: ServiceAccount
    name: remediation-mcp-sa-290
    namespace: app-290
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-remediation-mcp
  namespace: app-290
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-remediation-mcp
  template:
    metadata:
      labels:
        app: k8s-remediation-mcp
    spec:
      serviceAccountName: remediation-mcp-sa-290
      containers:
        - name: k8s-remediation-mcp
          image: us-central1-docker.pkg.dev/genuine-flight-317411/mcp/kubernetes-remediation-mcp:1.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-remediation-mcp
  namespace: app-290
spec:
  selector:
    app: k8s-remediation-mcp
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
