apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-sync
  namespace: app-290
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-sync
  template:
    metadata:
      labels:
        app: inventory-sync
    spec:
      containers:
        - name: inventory-sync
          image: busybox:1.37.0
          command: ["sh", "-c", "sleep infinity"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
