user_prompt: "Are any of my workloads leaking secrets? Check for hardcoded passwords or API keys in environment variables across all deployments."

# The LLM must discover these specific values by querying — they can't be guessed.
# The verification code HOLMES-EVAL-LEAK-9x7m is embedded in the secret value
# to prove the LLM actually read the data rather than hallucinating.
expected_output:
  - Must find the DB_PASSWORD environment variable in the inventory-api deployment
  - Must find the STRIPE_API_KEY environment variable in the checkout-service deployment
  - Must mention namespace app-232
  - Must NOT report any secrets from the kube-system namespace (monitoring-agent has AUTH_TOKEN but should be filtered out by namespace)

include_tool_calls: true

tags:
  - kubernetes
  - medium
  - leaked-information
  - regression

before_test: |
  kubectl create namespace app-232 --save-config --dry-run=client -o yaml | kubectl apply -f - || true
  kubectl create namespace kube-system --save-config --dry-run=client -o yaml | kubectl apply -f - || true

  # Deploy workloads with hardcoded secrets (the bad practice Holmes should find)
  cat <<'EOF' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: inventory-api
    namespace: app-232
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: inventory-api
    template:
      metadata:
        labels:
          app: inventory-api
      spec:
        containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
          - name: DB_PASSWORD
            value: "prod-db-pass-HOLMES-EVAL-LEAK-9x7m"
          - name: APP_NAME
            value: "inventory-api"
          - name: SERVICE_PORT
            value: "8080"
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: checkout-service
    namespace: app-232
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: checkout-service
    template:
      metadata:
        labels:
          app: checkout-service
      spec:
        containers:
        - name: checkout
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
          - name: STRIPE_API_KEY
            value: "sk_live_HOLMES-EVAL-LEAK-9x7m"
          - name: LOG_LEVEL
            value: "info"
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: safe-worker
    namespace: app-232
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: safe-worker
    template:
      metadata:
        labels:
          app: safe-worker
      spec:
        containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: db-creds
                key: password
          - name: APP_NAME
            value: "safe-worker"
  EOF

  # Wait for deployments to exist
  READY=false
  for i in {1..60}; do
    COUNT=$(kubectl get deployments -n app-232 --no-headers 2>/dev/null | wc -l)
    if [ "$COUNT" -ge 3 ]; then
      echo "✅ All 3 deployments created in app-232"
      READY=true
      break
    fi
    echo "⏳ Attempt $i/60: $COUNT/3 deployments found..."
    sleep 1
  done
  if [ "$READY" = false ]; then
    echo "❌ Deployments not created after 60s"
    kubectl get deployments -n app-232
    exit 1
  fi

  # Verify the data is queryable via the same jq pattern the LLM would use
  VERIFY=$(kubectl get deployments -n app-232 -o json | jq -r '.items[] | .spec.template.spec.containers[] | .env // [] | .[] | select(.value != null and (.valueFrom == null)) | select(.name | test("PASSWORD|SECRET|API_KEY|CREDENTIAL"; "i")) | .name')
  if echo "$VERIFY" | grep -q "DB_PASSWORD" && echo "$VERIFY" | grep -q "STRIPE_API_KEY"; then
    echo "✅ Verification: found DB_PASSWORD and STRIPE_API_KEY via jq query"
  else
    echo "❌ Verification failed: expected DB_PASSWORD and STRIPE_API_KEY in jq output"
    echo "Got: $VERIFY"
    exit 1
  fi

after_test: |
  kubectl delete namespace app-232 || true
