description: |
  Tests that Holmes can discover and use the /api/v2/monitors/events/search endpoint
  when asked about monitor state change history. The challenge is that Holmes must
  figure out to use the monitors events search API (not the regular events API) to
  find when a monitor triggered, recovered, or changed state.

before_test: |
  # Create a test monitor
  curl -s -X POST "https://api.datadoghq.com/api/v1/monitor" \
    -H "Content-Type: application/json" \
    -H "DD-API-KEY: ${DATADOG_API_KEY}" \
    -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}" \
    -d '{
      "name": "Disk Usage Alert - eval212",
      "type": "metric alert",
      "query": "avg(last_5m):avg:system.disk.used{*} > 99999999999",
      "message": "Disk usage critical",
      "tags": ["env:test", "service:eval212"],
      "options": {
        "thresholds": {"critical": 99999999999, "warning": 88888888888},
        "notify_no_data": false
      }
    }' | tee /tmp/monitor_response_212.json

  MONITOR_ID=$(cat /tmp/monitor_response_212.json | grep -o '"id":[0-9]*' | head -1 | cut -d':' -f2)
  echo "Created monitor with ID: $MONITOR_ID"
  echo "$MONITOR_ID" > /tmp/monitor_id_212.txt
  sleep 5

user_prompt: "The 'Disk Usage Alert - eval212' monitor has been flapping. Can you pull up the recent state change history for this monitor - when it triggered, recovered, or had any transitions?"

expected_output: |
  Holmes must call the Datadog API using the monitors/events/search endpoint (POST)
  to retrieve monitor event history.

  The tool call should use /api/v2/monitors/events/search, not the generic /api/v1/events
  endpoint, since we're specifically looking for monitor state transitions.

  Must NOT say the endpoint is not allowed or not in the whitelist.

include_tool_calls: true

tags:
  - datadog

test_type: server

after_test: |
  if [ -f /tmp/monitor_id_212.txt ]; then
    MONITOR_ID=$(cat /tmp/monitor_id_212.txt)
    if [ -n "$MONITOR_ID" ]; then
      curl -s -X DELETE "https://api.datadoghq.com/api/v1/monitor/${MONITOR_ID}?force=true" \
        -H "DD-API-KEY: ${DATADOG_API_KEY}" \
        -H "DD-APPLICATION-KEY: ${DATADOG_APP_KEY}"
    fi
  fi
  rm -f /tmp/monitor_response_212.json /tmp/monitor_id_212.txt
