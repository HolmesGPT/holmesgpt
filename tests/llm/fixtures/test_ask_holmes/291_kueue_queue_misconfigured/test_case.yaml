user_prompt: "Job 'nightly-eval' in namespace 'app-291' has been stuck in Pending for over 20 minutes. Investigate using the available tools and determine the root cause."
expected_output:
  - The LocalQueue 'team-c-queue' references a ClusterQueue that does not exist
  - The referenced ClusterQueue name is app-291-nonexistent-cq
  - The root cause is a misconfigured queue reference, not insufficient quota

tags:
  - kubernetes
  - easy
  - question-answer

evaluation:
  correctness: 1

# LocalQueue 'team-c-queue' deliberately references a ClusterQueue that is
# never created, so Kueue marks it inactive and the Job it's used by can
# never be admitted.
before_test: |
  KUEUE_VERSION=v0.19.0
  if kubectl get crd workloads.kueue.x-k8s.io >/dev/null 2>&1; then
    INSTALLED_IMAGE=$(kubectl get deployment/kueue-controller-manager -n kueue-system -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
    if [[ "$INSTALLED_IMAGE" != *"$KUEUE_VERSION"* ]]; then
      echo "❌ an existing Kueue install (image: ${INSTALLED_IMAGE:-none}) does not match the expected ${KUEUE_VERSION}; refusing to reuse it"
      exit 1
    fi
  else
    kubectl apply --server-side -f "https://github.com/kubernetes-sigs/kueue/releases/download/${KUEUE_VERSION}/manifests.yaml"
  fi
  for i in {1..60}; do
    kubectl get deployment/kueue-controller-manager -n kueue-system >/dev/null 2>&1 && break
    sleep 1
  done
  kubectl wait --for=condition=Available deployment/kueue-controller-manager -n kueue-system --timeout=60s

  kubectl apply -f ./manifest.yaml
  # Wait for Kueue to mark the LocalQueue inactive (60s total)
  INACTIVE=false
  for i in {1..60}; do
    if kubectl get localqueue team-c-queue -n app-291 -o jsonpath='{.status.conditions[?(@.type=="Active")].status}' 2>/dev/null | grep -q "False"; then
      echo "✅ LocalQueue is inactive as expected!"
      INACTIVE=true
      break
    else
      echo "⏳ Attempt $i/60: waiting for Kueue to reconcile the LocalQueue, checking in 1s..."
      sleep 1
    fi
  done
  if [ "$INACTIVE" = false ]; then
    echo "❌ LocalQueue did not become inactive after 60s"
    kubectl get localqueue team-c-queue -n app-291 -o yaml
    exit 1
  fi

after_test: |
  kubectl delete namespace app-291 --ignore-not-found
  for i in {1..60}; do
    kubectl get namespace app-291 >/dev/null 2>&1 || break
    sleep 1
  done
  if kubectl get namespace app-291 >/dev/null 2>&1; then
    echo "❌ namespace app-291 still exists after bounded teardown wait"
    exit 1
  fi
