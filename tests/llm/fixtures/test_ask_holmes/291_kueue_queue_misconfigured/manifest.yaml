apiVersion: v1
kind: Namespace
metadata:
  name: app-291
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: team-c-queue
  namespace: app-291
spec:
  clusterQueue: app-291-nonexistent-cq
---
apiVersion: batch/v1
kind: Job
metadata:
  name: nightly-eval
  namespace: app-291
  labels:
    kueue.x-k8s.io/queue-name: team-c-queue
spec:
  suspend: true
  template:
    spec:
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "echo eval && sleep 3600"]
          resources:
            requests:
              cpu: "200m"
              memory: 128Mi
      restartPolicy: Never
  backoffLimit: 0
