# Test: MCP server image support - Confluence page with image attachment
# Tests that Holmes can receive and interpret images returned by MCP tools.
# The mcp-atlassian server's confluence_get_page_images tool returns ImageContent
# blocks, which Holmes must pass through to the vision-capable LLM.
#
# Currently RED: MCP tool results only extract text content (c.type == "text"),
# dropping image content blocks entirely. Holmes cannot see images from MCP tools.
#
# Requirements:
#   CONFLUENCE_BASE_URL - Atlassian instance URL (e.g. https://robusta-llm-test.atlassian.net)
#   CONFLUENCE_SA_USER - Service account email
#   CONFLUENCE_SA_API_KEY - Service account API token

user_prompt: |
  In the Confluence space 'HOLMESIMG', find the page titled 'Image Verification Page'
  and look at the image attached to it. Tell me the verification code shown in the image.

expected_output:
  - "Must report the verification code from the image: IMGVERIFY-7Q3X9P"

include_tool_calls: true

tags:
  - confluence
  - question-answer
  - hard
  - fast

before_test: |
  set -e

  # Validate required environment variables
  [ -n "${CONFLUENCE_BASE_URL:-}" ] || { echo "Missing env var: CONFLUENCE_BASE_URL"; exit 1; }
  [ -n "${CONFLUENCE_SA_USER:-}" ] || { echo "Missing env var: CONFLUENCE_SA_USER"; exit 1; }
  [ -n "${CONFLUENCE_SA_API_KEY:-}" ] || { echo "Missing env var: CONFLUENCE_SA_API_KEY"; exit 1; }

  # Use API gateway URL (auto-derived by conftest.py or set explicitly)
  # Direct instance URL does not work with scoped API tokens
  [ -n "${CONFLUENCE_SA_BASE_URL:-}" ] || { echo "Missing env var: CONFLUENCE_SA_BASE_URL (should be auto-derived by conftest.py)"; exit 1; }
  API_BASE="${CONFLUENCE_SA_BASE_URL}"

  SPACE_KEY="HOLMESIMG"
  SPACE_NAME="Holmes Image Test"
  PAGE_TITLE="Image Verification Page"
  VERIFICATION_CODE="IMGVERIFY-7Q3X9P"

  echo "Creating Confluence space ${SPACE_KEY}..."
  RESPONSE=$(curl -L -s -w "\n%{http_code}" -X POST \
    "${API_BASE}/wiki/rest/api/space" \
    -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}" \
    -H "Content-Type: application/json" \
    -d "{
      \"key\": \"${SPACE_KEY}\",
      \"name\": \"${SPACE_NAME}\",
      \"description\": {
        \"plain\": {
          \"value\": \"Test space for Holmes MCP image eval 233\",
          \"representation\": \"plain\"
        }
      }
    }")

  HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
  BODY=$(echo "$RESPONSE" | sed '$d')

  if [ "$HTTP_CODE" -eq 200 ]; then
    echo "Space created."
  elif echo "$BODY" | grep -q "already exists"; then
    echo "Space already exists, reusing."
  else
    echo "Failed to create space. HTTP ${HTTP_CODE}: ${BODY}"
    exit 1
  fi

  sleep 2

  echo "Creating page..."
  PAGE_RESPONSE=$(curl -L -s -w "\n%{http_code}" -X POST \
    "${API_BASE}/wiki/rest/api/content" \
    -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}" \
    -H "Content-Type: application/json" \
    -d "{
      \"type\": \"page\",
      \"title\": \"${PAGE_TITLE}\",
      \"space\": {\"key\": \"${SPACE_KEY}\"},
      \"body\": {
        \"storage\": {
          \"value\": \"<p>This page has an image attachment containing a verification code. Look at the attached image to find it.</p>\",
          \"representation\": \"storage\"
        }
      }
    }")

  PAGE_HTTP=$(echo "$PAGE_RESPONSE" | tail -n1)
  PAGE_BODY=$(echo "$PAGE_RESPONSE" | sed '$d')

  if [ "$PAGE_HTTP" -eq 200 ]; then
    PAGE_ID=$(echo "$PAGE_BODY" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
  else
    echo "Page creation returned HTTP ${PAGE_HTTP}, searching for existing page..."
    PAGE_ID=$(curl -L -s -G \
      "${API_BASE}/wiki/rest/api/content" \
      --data-urlencode "title=${PAGE_TITLE}" \
      --data-urlencode "spaceKey=${SPACE_KEY}" \
      -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}" \
      | python3 -c 'import sys,json; r=json.load(sys.stdin)["results"]; print(r[0]["id"]) if r else sys.exit(1)')
    if [ -z "$PAGE_ID" ]; then
      echo "Failed to create or find page."
      exit 1
    fi
    echo "Found existing page."
  fi
  echo "Page ID: ${PAGE_ID}"

  echo "Generating verification image with code: ${VERIFICATION_CODE}"
  python3 -c "
  from PIL import Image, ImageDraw, ImageFont

  img = Image.new('RGB', (400, 200), color='white')
  draw = ImageDraw.Draw(img)

  try:
      font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 28)
  except (IOError, OSError):
      font = ImageFont.load_default()

  draw.text((30, 30), 'Verification Code:', fill='black', font=font)
  draw.text((30, 90), '${VERIFICATION_CODE}', fill='red', font=font)
  draw.rectangle([20, 20, 380, 180], outline='black', width=3)

  img.save('/tmp/verification_code_233.png')
  print('Image generated successfully')
  "

  if [ ! -f /tmp/verification_code_233.png ]; then
    echo "Failed to generate image"
    exit 1
  fi

  echo "Uploading image attachment to page ${PAGE_ID}..."
  ATTACH_RESPONSE=$(curl -L -s -w "\n%{http_code}" -X POST \
    "${API_BASE}/wiki/rest/api/content/${PAGE_ID}/child/attachment" \
    -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}" \
    -H "X-Atlassian-Token: nocheck" \
    -F "file=@/tmp/verification_code_233.png;filename=verification_code.png" \
    -F "comment=Verification code image for eval test")

  ATTACH_HTTP=$(echo "$ATTACH_RESPONSE" | tail -n1)
  ATTACH_BODY=$(echo "$ATTACH_RESPONSE" | sed '$d')

  if [ "$ATTACH_HTTP" -eq 200 ]; then
    echo "Image attached successfully"
  elif echo "$ATTACH_BODY" | grep -q "same file name"; then
    echo "Attachment already exists, reusing."
  else
    echo "Attachment upload returned HTTP ${ATTACH_HTTP}: ${ATTACH_BODY}"
    exit 1
  fi

  echo "Verifying attachment exists..."
  VERIFY=$(curl -L -s \
    "${API_BASE}/wiki/rest/api/content/${PAGE_ID}/child/attachment" \
    -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}")

  ATTACHMENT_COUNT=$(echo "$VERIFY" | python3 -c 'import sys,json; print(json.load(sys.stdin)["size"])')
  if [ "$ATTACHMENT_COUNT" -gt 0 ]; then
    echo "Verified: ${ATTACHMENT_COUNT} attachment(s) on page ${PAGE_ID}"
  else
    echo "No attachments found on page"
    exit 1
  fi

  rm -f /tmp/verification_code_233.png
  echo "Setup complete"

after_test: |
  set -e

  [ -n "${CONFLUENCE_SA_BASE_URL:-}" ] || { echo "Missing CONFLUENCE_SA_BASE_URL"; exit 0; }
  API_BASE="${CONFLUENCE_SA_BASE_URL}"
  SPACE_KEY="HOLMESIMG"

  echo "Deleting space ${SPACE_KEY}..."
  HTTP_CODE=$(curl -L -s -w "%{http_code}" -o /dev/null -X DELETE \
    "${API_BASE}/wiki/rest/api/space/${SPACE_KEY}" \
    -H "Authorization: Bearer ${CONFLUENCE_SA_API_KEY}")

  if [ "$HTTP_CODE" -eq 204 ] || [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 404 ]; then
    echo "Cleanup complete"
  else
    echo "Warning: Cleanup returned HTTP ${HTTP_CODE}"
  fi
