# Test: Elasticsearch Field Mappings Discovery
# Tests that Holmes can retrieve and interpret index mappings/schema
#
# Requirements:
# - ELASTICSEARCH_URL: URL to Elasticsearch cluster
# - ELASTICSEARCH_API_KEY: API key for authentication
#
# Anti-hallucination: The test creates an index with specific field names and types.
# The LLM cannot know this schema without querying the mappings API.
# Fields include nested objects and specific types that must be correctly reported.

user_prompt: "What are the field mappings for the 'holmes-eval-schema' index? List all fields with their data types."

expected_output:
  - "Must call elasticsearch_mappings tool to retrieve the index mapping"
  - "Must identify the 'transaction_id' field as type keyword"
  - "Must identify the 'amount' field as type double"
  - "Must identify the 'metadata.region' nested field as type keyword"
  - "Must identify the 'metadata.priority' nested field as type integer"
  - "Must identify the 'processed_at' field as type date"

include_tool_calls: true

tags:
  - elasticsearch
  - question-answer
  - medium

setup_timeout: 30

before_test: |
  set -e

  # Check required environment variables
  if [ -z "$ELASTICSEARCH_URL" ]; then
    echo "❌ ELASTICSEARCH_URL environment variable is not set"
    exit 1
  fi

  export HOLMES_ES_TEST_INDEX="holmes-eval-schema"

  # Build auth header
  AUTH_HEADER=""
  if [ -n "$ELASTICSEARCH_API_KEY" ]; then
    AUTH_HEADER="-H 'Authorization: ApiKey $ELASTICSEARCH_API_KEY'"
  fi

  # Delete the index if it exists
  echo "⏳ Cleaning up any existing test index..."
  eval curl -s -X DELETE "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX" $AUTH_HEADER || true

  # Create the test index with specific mappings including nested objects
  echo "⏳ Creating test index with specific schema..."
  RESPONSE=$(eval curl -s -X PUT "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX" \
    -H 'Content-Type: application/json' \
    $AUTH_HEADER \
    -d '{
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0
      },
      "mappings": {
        "properties": {
          "transaction_id": {"type": "keyword"},
          "amount": {"type": "double"},
          "currency": {"type": "keyword"},
          "status": {"type": "keyword"},
          "metadata": {
            "properties": {
              "region": {"type": "keyword"},
              "priority": {"type": "integer"},
              "tags": {"type": "keyword"}
            }
          },
          "processed_at": {"type": "date"},
          "description": {"type": "text"}
        }
      }
    }')

  # Verify index was created
  if echo "$RESPONSE" | grep -q '"acknowledged":true'; then
    echo "✅ Test index created with custom schema"
  else
    echo "❌ Failed to create test index"
    echo "Response: $RESPONSE"
    exit 1
  fi

  # Index a sample document to confirm mappings
  eval curl -s -X POST "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX/_doc" \
    -H 'Content-Type: application/json' \
    $AUTH_HEADER \
    -d '{
      "transaction_id": "TXN-12345",
      "amount": 99.99,
      "currency": "USD",
      "status": "completed",
      "metadata": {
        "region": "us-east-1",
        "priority": 1,
        "tags": ["retail", "online"]
      },
      "processed_at": "2025-01-01T10:00:00Z",
      "description": "Test transaction for schema validation"
    }'

  # Refresh
  eval curl -s -X POST "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX/_refresh" $AUTH_HEADER

  echo "✅ Test index ready with mappings: transaction_id (keyword), amount (double), metadata.region (keyword), metadata.priority (integer), processed_at (date)"

after_test: |
  # Clean up the test index
  AUTH_HEADER=""
  if [ -n "$ELASTICSEARCH_API_KEY" ]; then
    AUTH_HEADER="-H 'Authorization: ApiKey $ELASTICSEARCH_API_KEY'"
  fi

  echo "⏳ Cleaning up test index: holmes-eval-schema"
  eval curl -s -X DELETE "$ELASTICSEARCH_URL/holmes-eval-schema" $AUTH_HEADER || true
  echo "✅ Cleanup complete"
