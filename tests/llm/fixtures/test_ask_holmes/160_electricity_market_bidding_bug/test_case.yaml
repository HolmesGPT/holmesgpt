user_prompt:
# - "The energy bidding service in namespace app-160 is experiencing unusual bid patterns. Investigate why bid commitments have increased dramatically."
- "Is there issues with the bidding rate in the bidding endpoint in namespace app-160? Check the recent metrics - note that the traffic test has already completed, so you'll see historical data that eventually drops to zero, which is expected."

expected_output:
  - The answer must identify that NordPool exchange has an abnormally high bid acceptance rate (close to 100%) compared to other exchanges (~10%)
  - The answer should mention that this behavior started after a certain point in time or after a certain number of requests
  - The answer should note the correlation with increased traffic from NordPool

tags:
  - kubernetes
  - prometheus
  - hard
  - chain-of-causation
  - regression

port_forwards:
  - namespace: default
    service: robusta-kube-prometheus-st-prometheus
    local_port: 10160
    remote_port: 9090

before_test: |
  set -e  # Exit immediately if any command fails

  echo "📁 Creating namespace..."
  kubectl create namespace app-160 --save-config --dry-run=client -o yaml | kubectl apply -f - || true

  echo "🚀 Deploying bidder service and k6 test..."
  kubectl apply -f bidder-app.yaml -n app-160

  echo "⏳ Waiting for bidder pod to be ready..."
  kubectl wait --for=condition=ready pod -l app=bidder -n app-160 --timeout=60s

  echo "🔍 Running validation..."
  ./run-bidder-check.sh

  echo "⏳ Waiting for metrics to be scraped by Prometheus..."
  METRICS_READY=false
  for i in {1..30}; do
    RESULT=$(kubectl run prom-check-$i --image=curlimages/curl:8.8.0 --restart=Never --rm -i --timeout=30s -- \
      curl -s "http://robusta-kube-prometheus-st-prometheus.default.svc.cluster.local:9090/api/v1/query?query=bid_requests_total" 2>/dev/null || true)
    if echo "$RESULT" | grep -q '"result":\[{'; then
      echo "✅ Metrics are being scraped!"
      METRICS_READY=true
      break
    fi
    echo "⏳ Attempt $i/30: Waiting for Prometheus to scrape bidder metrics..."
    sleep 2
  done
  if [ "$METRICS_READY" = false ]; then
    echo "⚠️ Warning: Metrics may not be fully scraped yet, proceeding anyway"
  fi

  echo "🧹 Cleaning up k6 job and pods to prevent AI detection"
  kubectl delete job k6-energy-market -n app-160 --ignore-not-found=true
  kubectl delete pods -n app-160 -l job-name=k6-energy-market --ignore-not-found=true

  echo "✅ Test setup completed successfully"

after_test: |
  kubectl delete namespace app-160 || true

include_files:
  - bidding_system.md
