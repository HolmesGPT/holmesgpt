# Test: HTTP toolset with type:http multi-instance support
# Deploys a simple JSON API server in Kubernetes and verifies Holmes can
# query it using the generic HTTP toolset with type: http configuration.
#
# The API returns a JSON response with a unique verification code that
# Holmes must discover and report.

user_prompt: |
  Query the inventory service API and tell me the warehouse location code
  and the total number of items currently tracked in the system.

expected_output:
  - "Must call inventory_service_request tool (not fetch_webpage or any other tool)"
  - "Must report the warehouse location code: WH-7X9K2M"
  - "Must report the total items count: 48213"

include_tool_calls: true

tags:
  - question-answer
  - medium

before_test: |
  set -e
  kubectl create namespace app-213 --dry-run=client -o yaml | kubectl apply -f -

  # Create a ConfigMap with the API response JSON
  cat <<'JSONEOF' > /tmp/holmesgpt-test-213-api-response.json
  {
    "service": "inventory-tracker",
    "version": "3.2.1",
    "warehouse": {
      "location_code": "WH-7X9K2M",
      "region": "us-east-2",
      "capacity_units": 150000
    },
    "inventory_summary": {
      "total_items": 48213,
      "categories": 127,
      "last_sync": "2026-02-08T10:30:00Z"
    },
    "status": "operational"
  }
  JSONEOF

  kubectl create configmap api-response \
    --from-file=response.json=/tmp/holmesgpt-test-213-api-response.json \
    -n app-213 \
    --dry-run=client -o yaml | kubectl apply -f -

  # Deploy nginx serving the JSON response
  cat <<'EOF' | kubectl apply -n app-213 -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api-server
    labels:
      app: api-server
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: api-server
    template:
      metadata:
        labels:
          app: api-server
      spec:
        containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
          - containerPort: 80
          volumeMounts:
          - name: api-response
            mountPath: /usr/share/nginx/html/api/v1/summary
            subPath: response.json
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        volumes:
        - name: api-response
          configMap:
            name: api-response
        - name: nginx-config
          configMap:
            name: nginx-config
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: api-server
  spec:
    selector:
      app: api-server
    ports:
    - port: 80
      targetPort: 80
  EOF

  # Create nginx config that serves JSON with correct content type
  cat <<'NGINXEOF' > /tmp/holmesgpt-test-213-nginx.conf
  server {
      listen 80;
      location /api/v1/summary {
          alias /usr/share/nginx/html/api/v1/summary;
          default_type application/json;
      }
      location /health {
          return 200 '{"status":"ok"}';
          default_type application/json;
      }
  }
  NGINXEOF

  kubectl create configmap nginx-config \
    --from-file=default.conf=/tmp/holmesgpt-test-213-nginx.conf \
    -n app-213 \
    --dry-run=client -o yaml | kubectl apply -f -

  # Restart deployment to pick up nginx config
  kubectl rollout restart deployment/api-server -n app-213

  # Wait for pod to be ready
  POD_READY=false
  for i in $(seq 1 60); do
    if kubectl wait --for=condition=ready pod -l app=api-server -n app-213 --timeout=5s 2>/dev/null; then
      echo "Pod is ready on attempt $i"
      POD_READY=true
      break
    fi
    sleep 1
  done

  if [ "$POD_READY" = false ]; then
    echo "Pod failed to become ready after 60 seconds"
    kubectl describe pod -l app=api-server -n app-213
    exit 1
  fi

  # Verify the API endpoint returns expected data
  API_VERIFIED=false
  for i in $(seq 1 30); do
    RESPONSE=$(kubectl exec -n app-213 deployment/api-server -- wget -q -O- http://localhost/api/v1/summary 2>/dev/null || true)
    if echo "$RESPONSE" | grep -q 'WH-7X9K2M'; then
      echo "API verified on attempt $i"
      API_VERIFIED=true
      break
    fi
    sleep 1
  done

  if [ "$API_VERIFIED" = false ]; then
    echo "API endpoint not returning expected data after 30 attempts"
    exit 1
  fi

  rm -f /tmp/holmesgpt-test-213-api-response.json /tmp/holmesgpt-test-213-nginx.conf
  echo "Setup complete"

after_test: |
  kubectl delete namespace app-213 --ignore-not-found

port_forwards:
  - resource_name: svc/api-server
    resource_namespace: app-213
    target_port: 80
