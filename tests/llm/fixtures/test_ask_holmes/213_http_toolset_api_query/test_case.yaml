user_prompt: |
  Query the Confluence wiki API and tell me the space key and space name.

expected_output:
  - "Must call confluence_request tool (not fetch_webpage or any other tool)"
  - "Must report the space key: HOLMES"
  - "Must report the space name: Holmes Test Wiki"

include_tool_calls: true

tags:
  - question-answer
  - medium

before_test: |
  set -e
  kubectl create namespace app-213 --dry-run=client -o yaml | kubectl apply -f -

  cat <<'JSONEOF' > /tmp/holmesgpt-test-213-api-response.json
  {
    "id": 98304,
    "key": "HOLMES",
    "name": "Holmes Test Wiki",
    "type": "global",
    "status": "current"
  }
  JSONEOF

  kubectl create configmap api-response \
    --from-file=response.json=/tmp/holmesgpt-test-213-api-response.json \
    -n app-213 \
    --dry-run=client -o yaml | kubectl apply -f -

  cat <<'EOF' | kubectl apply -n app-213 -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: api-server
    labels:
      app: api-server
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: api-server
    template:
      metadata:
        labels:
          app: api-server
      spec:
        containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
          - containerPort: 80
          volumeMounts:
          - name: api-response
            mountPath: /usr/share/nginx/html/wiki/rest/api/space/HOLMES
            subPath: response.json
          - name: nginx-config
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
        volumes:
        - name: api-response
          configMap:
            name: api-response
        - name: nginx-config
          configMap:
            name: nginx-config
  ---
  apiVersion: v1
  kind: Service
  metadata:
    name: api-server
  spec:
    selector:
      app: api-server
    ports:
    - port: 80
      targetPort: 80
  EOF

  cat <<'NGINXEOF' > /tmp/holmesgpt-test-213-nginx.conf
  server {
      listen 80;
      location /wiki/rest/api/space/HOLMES {
          alias /usr/share/nginx/html/wiki/rest/api/space/HOLMES;
          default_type application/json;
      }
      location /health {
          return 200 '{"status":"ok"}';
          default_type application/json;
      }
  }
  NGINXEOF

  kubectl create configmap nginx-config \
    --from-file=default.conf=/tmp/holmesgpt-test-213-nginx.conf \
    -n app-213 \
    --dry-run=client -o yaml | kubectl apply -f -

  kubectl rollout restart deployment/api-server -n app-213


  POD_READY=false
  for i in $(seq 1 60); do
    if kubectl wait --for=condition=ready pod -l app=api-server -n app-213 --timeout=5s 2>/dev/null; then
      echo "Pod is ready on attempt $i"
      POD_READY=true
      break
    fi
    sleep 1
  done

  if [ "$POD_READY" = false ]; then
    echo "Pod failed to become ready after 60 seconds"
    kubectl describe pod -l app=api-server -n app-213
    exit 1
  fi

  API_VERIFIED=false
  for i in $(seq 1 30); do
    RESPONSE=$(kubectl exec -n app-213 deployment/api-server -- wget -q -O- http://localhost/wiki/rest/api/space/HOLMES 2>/dev/null || true)
    if echo "$RESPONSE" | grep -q 'Holmes Test Wiki'; then
      echo "API verified on attempt $i"
      API_VERIFIED=true
      break
    fi
    sleep 1
  done

  if [ "$API_VERIFIED" = false ]; then
    echo "API endpoint not returning expected data after 30 attempts"
    exit 1
  fi

  rm -f /tmp/holmesgpt-test-213-api-response.json /tmp/holmesgpt-test-213-nginx.conf
  echo "Setup complete"

after_test: |
  kubectl delete namespace app-213 --ignore-not-found

port_forwards:
  - resource_name: svc/api-server
    resource_namespace: app-213
    target_port: 80
