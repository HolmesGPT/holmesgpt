toolsets:
  confluence:
    type: http
    enabled: true
    config:
      endpoints:
        - hosts:
            - "localhost"
            - "127.0.0.1"
          paths: ["/wiki/rest/api/*"]
          methods: ["GET"]
          auth:
            type: none
      verify_ssl: false
      timeout_seconds: 10
    llm_instructions: |
      ### Confluence REST API

      Available endpoints:
      - GET /wiki/rest/api/space/{spaceKey} - Returns space information

      The base URL uses localhost with a port forward. Example:
      ```
      GET http://localhost:{port}/wiki/rest/api/space/HOLMES
      ```
  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  helm/core:
    enabled: false
