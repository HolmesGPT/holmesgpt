# Toolset configuration for HTTP toolset eval test
# Uses type: http to create a named instance "inventory_service"
# that generates tool "inventory_service_request"
toolsets:
  inventory_service:
    type: http
    enabled: true
    config:
      endpoints:
        - hosts:
            - "localhost"
            - "127.0.0.1"
          paths: ["/api/*"]
          methods: ["GET"]
          auth:
            type: none
      verify_ssl: false
      timeout_seconds: 10
    llm_instructions: |
      ### Inventory Service API

      This is an internal inventory tracking service.
      Available endpoints:
      - GET /api/v1/summary - Returns a JSON summary of the warehouse inventory

      The base URL uses localhost with a port forward. Example:
      ```
      GET http://localhost:{port}/api/v1/summary
      ```
  # Disable K8s-dependent toolsets that are not needed
  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  helm/core:
    enabled: false
