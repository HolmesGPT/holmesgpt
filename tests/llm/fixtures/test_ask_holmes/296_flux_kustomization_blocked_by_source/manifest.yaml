apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: web-platform
  namespace: app-296
spec:
  interval: 1m
  url: https://git.example.com/retail/web-platform.git
  ref:
    branch: main
  secretRef:
    name: web-platform-ro-k8m2x
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: storefront
  namespace: app-296
spec:
  interval: 1m
  url: https://git.example.com/retail/storefront.git
  ref:
    branch: main
  secretRef:
    name: storefront-deploy-key
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storefront
  namespace: app-296
spec:
  interval: 5m
  path: ./apps/storefront/production
  prune: true
  targetNamespace: app-296
  sourceRef:
    kind: GitRepository
    name: web-platform
