# Behavioral guard for the log-fetch transparency mandate in the system
# prompt (_fetch_logs / _default_log_prompt): when Holmes fetches logs it
# must tell the user what window of logs it looked at, without being asked.
# No other eval asserts this disclosure — the datadog/kubernetes log evals
# only check that the right log content is found.
#
# The user prompt deliberately does NOT mention time windows or ask "what
# logs did you look at" — the disclosure must come from the prompt mandate,
# not from the question. The error reference code is unique and only
# discoverable by actually fetching the pod's logs, ruling out hallucinated
# answers.

user_prompt: "Are there any problems with the order-sync deployment in namespace app-284?"

expected_output:
  - Must report the failed push of batch 17 to the billing service (upstream 503) with reference code ORD284-7Q9K3M
  - Must state what time period or time window of logs was examined (for example "logs from the last hour", "logs since <timestamp>", or an explicit time range) — a disclosure of the log window fetched, not merely a mention that logs were checked

tags:
  - kubernetes
  - logs
  - transparency

before_test: |
  set -e
  kubectl create namespace app-284 --dry-run=client -o yaml | kubectl apply -f -
  kubectl apply -n app-284 -f - <<'EOF'
  apiVersion: v1
  kind: Secret
  metadata:
    name: order-sync-app
  stringData:
    run.sh: |
      #!/bin/sh
      i=1
      while [ $i -le 16 ]; do
        echo "$(date -Iseconds) INFO order-sync pushed batch $i to billing (25 orders)"
        i=$((i+1))
      done
      echo "$(date -Iseconds) ERROR order-sync failed to push batch 17 to billing: upstream returned 503 (ref ORD284-7Q9K3M)"
      echo "$(date -Iseconds) WARN order-sync batch 17 requeued for retry"
      i=18
      while [ $i -le 40 ]; do
        echo "$(date -Iseconds) INFO order-sync pushed batch $i to billing (25 orders)"
        i=$((i+1))
      done
      while true; do
        echo "$(date -Iseconds) INFO order-sync idle, queue empty"
        sleep 30
      done
  ---
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: order-sync
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: order-sync
    template:
      metadata:
        labels:
          app: order-sync
      spec:
        containers:
        - name: order-sync
          image: busybox:1.36
          command: ["sh", "/app/run.sh"]
          volumeMounts:
          - name: app
            mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
        volumes:
        - name: app
          secret:
            secretName: order-sync-app
  EOF
  POD_READY=false
  for i in $(seq 1 60); do
    if kubectl wait --for=condition=ready pod -l app=order-sync -n app-284 --timeout=5s 2>/dev/null; then
      POD_READY=true
      break
    fi
    sleep 1
  done
  if [ "$POD_READY" = false ]; then
    echo "❌ order-sync pod not ready after 60s"
    kubectl get pods -n app-284
    kubectl logs -l app=order-sync -n app-284 --tail=20 2>/dev/null
    exit 1
  fi
  # Verify the reference code is actually discoverable in the logs
  LOG_OK=false
  for i in $(seq 1 30); do
    if kubectl logs -l app=order-sync -n app-284 --tail=100 2>/dev/null | grep -q "ORD284-7Q9K3M"; then
      LOG_OK=true
      break
    fi
    sleep 1
  done
  if [ "$LOG_OK" = false ]; then
    echo "❌ reference code ORD284-7Q9K3M not found in order-sync logs"
    kubectl logs -l app=order-sync -n app-284 --tail=50 2>/dev/null
    exit 1
  fi
  echo "✅ order-sync emitting logs with reference code in app-284"

after_test: |
  kubectl delete namespace app-284 --ignore-not-found
