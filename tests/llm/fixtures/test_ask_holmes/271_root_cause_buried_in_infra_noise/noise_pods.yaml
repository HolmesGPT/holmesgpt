# Unrelated "noise" workloads in the same busy namespace. They generate REAL,
# cluster-verifiable warning events (no injected/fake events) that are tempting
# to blame but have nothing to do with the index-to-es task failures:
#
#  * ingest-worker-0..7  -> permanently Pending via an impossible nodeSelector,
#    producing real FailedScheduling warnings (looks like a capacity/scheduling
#    crisis in the namespace).
#  * stream-processor-0..2 -> reference an image tag that does not exist, so the
#    kubelet emits real Failed / ErrImagePull / "Back-off pulling image"
#    warnings (looks like an image/registry problem in the namespace).
#
# None of this stopped the index-to-es task pods, which actually ran (see their
# own lifecycle events) before failing at the application layer.
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ingest-worker-0
      namespace: app-271
      labels: {app: ingest-worker}
    spec:
      nodeSelector: {nodepool: gpu-spot-nonexistent}
      containers: [{name: c, image: busybox:1.36, command: ["sleep", "3600"]}]
  - apiVersion: v1
    kind: Pod
    metadata:
      name: ingest-worker-1
      namespace: app-271
