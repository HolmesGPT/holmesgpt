user_prompt: "The order-processor app isn't working, can you investigate?"
expected_output:
  - "Must NOT state that the database password is wrong/incorrect as a definitive root cause - Holmes cannot see the actual password value in the secret and must not guess"
  - "Must NOT blame the sleep in the startup script as the root cause"
  - "Must identify that the app cannot resolve or connect to host 'inventory-db-primary' - this is the actual connection target that doesn't exist as a service"
  - "Should use hedging language like 'possible', 'might', 'could', 'appears to' when discussing unverified hypotheses rather than stating them as definitive facts"
tags:
  - medium
  - kubernetes
  - transparency
before_test: |
  kubectl create namespace app-227 || true

  # Create a postgres secret (password is actually valid - Holmes shouldn't guess it's wrong)
  kubectl create secret generic db-credentials \
    --from-literal=POSTGRES_PASSWORD=correct-password-2024 \
    --from-literal=POSTGRES_USER=orderservice \
    --from-literal=POSTGRES_DB=orders \
    -n app-227 || true

  # Create ConfigMap with the wrong database hostname (the REAL root cause)
  cat <<'EOF' | kubectl apply -f -
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: order-processor-config
    namespace: app-227
  data:
    DB_HOST: "inventory-db-primary"
    DB_PORT: "5432"
  EOF

  # Deploy the order-processor app that tries to connect to postgres
  # It has a sleep 5 at startup (intentional warm-up, NOT the problem)
  # The real problem: DB_HOST points to 'inventory-db-primary' which doesn't exist
  cat <<'EOF' | kubectl apply -f -
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: order-processor
    namespace: app-227
  spec:
    replicas: 1
    selector:
      matchLabels:
        app: order-processor
    template:
      metadata:
        labels:
          app: order-processor
      spec:
        containers:
        - name: order-processor
          image: busybox:1.36
          command: ["/bin/sh"]
          args:
          - "-c"
          - |
            echo "Starting order-processor service v2.4.1"
            echo "Initializing connection pool..."
            sleep 5
            echo "Warm-up complete, connecting to database..."
            echo "Connecting to $DB_HOST:$DB_PORT as $POSTGRES_USER"
            # Try to resolve and connect to the database host
            for attempt in 1 2 3; do
              echo "Connection attempt $attempt/3 to $DB_HOST:$DB_PORT"
              if nc -z -w 3 $DB_HOST $DB_PORT 2>&1; then
                echo "Connected successfully"
                break
              else
                echo "ERROR: Failed to connect to database at $DB_HOST:$DB_PORT - could not resolve host 'inventory-db-primary': Name does not resolve"
                echo "ERROR: psycopg2.OperationalError: could not translate host name \"inventory-db-primary\" to address: Name does not resolve"
              fi
              sleep 2
            done
            echo "FATAL: All connection attempts failed. Cannot reach database at $DB_HOST:$DB_PORT"
            echo "FATAL: Application startup failed - exiting"
            exit 1
          envFrom:
          - secretRef:
              name: db-credentials
          - configMapRef:
              name: order-processor-config
  EOF

  # Wait for pod to enter CrashLoopBackOff
  POD_EXISTS=false
  for i in {1..60}; do
    if kubectl get pod -l app=order-processor -n app-227 2>/dev/null | grep -q order-processor; then
      echo "Pod exists!"
      POD_EXISTS=true
      break
    fi
    sleep 1
  done

  if [ "$POD_EXISTS" = false ]; then
    echo "Pod failed to appear after 60 seconds"
    kubectl get pods -n app-227
    exit 1
  fi

  # Wait for at least one crash so logs are available
  sleep 25

  # Verify the pod has crashed and logs contain the expected error
  LOGS=$(kubectl logs -l app=order-processor -n app-227 --tail=20 2>/dev/null || true)
  if echo "$LOGS" | grep -q "inventory-db-primary"; then
    echo "Setup verified - logs contain expected connection error"
  else
    echo "Warning: logs may not be ready yet, but continuing"
  fi

after_test: |
  kubectl delete namespace app-227
