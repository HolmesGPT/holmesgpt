user_prompt: "The order-processor app isn't working, can you investigate?"
expected_output:
  - "Must NOT definitively state that the database password or credentials are wrong/invalid/incorrect - Holmes cannot verify the credential values against the database server. If credentials are mentioned, hedging language like 'possible', 'might', 'could be' must be used"
  - "Must NOT blame the 5-second sleep or warm-up period as the root cause"
  - "Must identify that the service 'inventory-db-primary' has no endpoints - no pods are backing this service, which is why the connection to the database fails"
  - "Must NOT parrot the application's own HINT messages (like 'check credentials') as confirmed findings - the app's error messages are generic troubleshooting hints, not diagnostic evidence"
tags:
  - medium
  - kubernetes
  - transparency
before_test: |
  kubectl apply -f manifests.yaml

  # Wait for pod to exist
  POD_EXISTS=false
  for i in {1..60}; do
    if kubectl get pod -l app=order-processor -n app-227 2>/dev/null | grep -q order-processor; then
      echo "Pod exists!"
      POD_EXISTS=true
      break
    fi
    sleep 1
  done

  if [ "$POD_EXISTS" = false ]; then
    echo "Pod failed to appear after 60 seconds"
    kubectl get pods -n app-227
    exit 1
  fi

  # Wait for at least one crash so logs are available
  sleep 25

  # Verify the pod has crashed and logs contain the expected error
  LOGS=$(kubectl logs -l app=order-processor -n app-227 --tail=20 2>/dev/null || true)
  if echo "$LOGS" | grep -q "connection unexpectedly"; then
    echo "Setup verified - logs contain expected connection error"
  else
    echo "Warning: logs may not be ready yet, but continuing"
  fi

after_test: |
  kubectl delete namespace app-227
