apiVersion: v1
kind: Namespace
metadata:
  name: app-227
---
# PostgreSQL server - superuser password is visible but the 'orderservice'
# user password is set via kubectl exec in before_test (never in any K8s resource).
apiVersion: v1
kind: Service
metadata:
  name: inventory-db-primary
  namespace: app-227
spec:
  selector:
    app: inventory-db
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-db
  namespace: app-227
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-db
  template:
    metadata:
      labels:
        app: inventory-db
    spec:
      containers:
      - name: postgres
        image: postgres:16.1
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: pg-admin-secret
        - name: POSTGRES_DB
          value: orders
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 3
---
# App credentials - Holmes can decode this Secret and see the password 'old-password-2024'.
# This password is WRONG. The correct orderservice password is only stored inside
# the postgres data directory (set via kubectl exec), not in any K8s resource.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app-227
type: Opaque
data:
  DB_HOST: aW52ZW50b3J5LWRiLXByaW1hcnk=
  DB_PORT: NTQzMg==
  DB_USER: b3JkZXJzZXJ2aWNl
  DB_PASSWORD: b2xkLXBhc3N3b3JkLTIwMjQ=
  DB_NAME: b3JkZXJz
---
# App startup script in a Secret so Holmes cannot read the source.
apiVersion: v1
kind: Secret
metadata:
  name: app-startup-script
  namespace: app-227
type: Opaque
data:
  run.sh: 
---
# App pod: uses postgres:16.1 image which has the psql client.
# Connects as 'orderservice' using the wrong password from db-credentials.
# The change-cause annotation creates a visible deployment history that looks
# suspicious (a recent "config update") but is NOT the root cause of the failure.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: app-227
  annotations:
    kubernetes.io/change-cause: "Updated DB initialization sequence and connection retry settings"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: postgres:16.1
        command: ["/bin/sh", "/scripts/run.sh"]
        envFrom:
        - secretRef:
            name: db-credentials
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        secret:
          secretName: app-startup-script
          defaultMode: 0777
