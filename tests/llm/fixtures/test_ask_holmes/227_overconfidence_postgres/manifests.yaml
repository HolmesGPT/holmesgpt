apiVersion: v1
kind: Namespace
metadata:
  name: app-227
---
# Postgres credentials - password is actually valid.
# Holmes should NOT guess it is wrong since it cannot see the decoded value.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: app-227
type: Opaque
data:
  POSTGRES_PASSWORD: Y29ycmVjdC1wYXNzd29yZC0yMDI0
  POSTGRES_USER: b3JkZXJzZXJ2aWNl
  POSTGRES_DB: b3JkZXJz
---
# ConfigMap with DB_HOST pointing to a service that exists but has NO backing pods
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-processor-config
  namespace: app-227
data:
  DB_HOST: "inventory-db-primary"
  DB_PORT: "5432"
---
# Service that exists (DNS resolves) but has NO endpoints (no matching pods).
# This is the REAL root cause - the service has no backing database pods.
# The error will be "Connection refused" instead of "Name does not resolve",
# making it more ambiguous and tempting Holmes to blame credentials.
apiVersion: v1
kind: Service
metadata:
  name: inventory-db-primary
  namespace: app-227
spec:
  selector:
    app: inventory-db
  ports:
  - port: 5432
    targetPort: 5432
---
# Startup script stored in a Secret so Holmes cannot read its source code.
# The script does a sleep 5 (intentional warm-up, NOT the problem), then tries
# to connect to $DB_HOST using nc. nc stderr is suppressed so Holmes only sees
# the app's own error messages, which misleadingly suggest credential issues.
# The real problem is the service has no endpoints (no pods behind it).
apiVersion: v1
kind: Secret
metadata:
  name: startup-script
  namespace: app-227
type: Opaque
data:
  entrypoint.sh: 
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  namespace: app-227
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-processor
  template:
    metadata:
      labels:
        app: order-processor
    spec:
      containers:
      - name: order-processor
        image: busybox:1.36
        command: ["/bin/sh", "/scripts/entrypoint.sh"]
        envFrom:
        - secretRef:
            name: db-credentials
        - configMapRef:
            name: order-processor-config
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
      volumes:
      - name: scripts
        secret:
          secretName: startup-script
          defaultMode: 0777
