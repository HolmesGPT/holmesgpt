# Test that Holmes can find and describe custom Prometheus alerting rules
user_prompt: "What Prometheus alerting rule monitors order processing time? Tell me the rule name, the PromQL expression, and what severity it has."

expected_output:
  - "Must identify the alert name: OrderProcessingLatencyHigh"
  - "Must include the PromQL expression containing histogram_quantile and order_processing_duration"
  - "Must mention the severity label is 'warning'"

tags:
  - prometheus
  - question-answer

include_tool_calls: true

port_forwards:
  - namespace: default
    service: robusta-kube-prometheus-st-prometheus
    local_port: 10211
    remote_port: 9090

before_test: |
  set -e

  echo "⚙️ Applying PrometheusRule CRD to default namespace..."
  # PrometheusRule must be in default namespace because kube-prometheus-stack
  # only watches its own namespace for rules by default (unless ruleSelectorNilUsesHelmValues=false)
  kubectl apply -f prometheus-rule.yaml -n default

  echo "🔍 Checking Prometheus ruleSelector configuration..."
  kubectl get prometheus -n default -o jsonpath='{.items[0].spec.ruleSelector}' || echo "No ruleSelector found"
  echo ""
  kubectl get prometheus -n default -o jsonpath='{.items[0].spec.ruleNamespaceSelector}' || echo "No ruleNamespaceSelector found"
  echo ""

  echo "🔍 Listing all PrometheusRules in cluster..."
  kubectl get prometheusrule -A

  echo "🔍 Verifying rule is loaded by Prometheus..."
  RULES_LOADED=false
  for i in {1..60}; do
    RULES_OUTPUT=$(kubectl exec -n default deployment/robusta-kube-prometheus-st-prometheus -- wget -q -O- http://localhost:9090/api/v1/rules 2>/dev/null || true)
    if echo "$RULES_OUTPUT" | grep -q "OrderProcessingLatencyHigh"; then
      echo "✅ Custom alerting rule is loaded!"
      RULES_LOADED=true
      break
    fi
    echo "⏳ Attempt $i/60: Rule not loaded yet, waiting for Prometheus to pick it up..."
    sleep 2
  done

  if [ "$RULES_LOADED" = false ]; then
    echo "❌ Rule failed to load after 120 seconds"
    echo ""
    echo "=== PrometheusRule status ==="
    kubectl get prometheusrule -n default order-processing-alerts -o yaml || true
    echo ""
    echo "=== Prometheus Operator logs (last 50 lines) ==="
    kubectl logs -n default -l app.kubernetes.io/name=prometheus-operator --tail=50 || true
    echo ""
    echo "=== Prometheus rules API output ==="
    kubectl exec -n default deployment/robusta-kube-prometheus-st-prometheus -- wget -q -O- http://localhost:9090/api/v1/rules 2>/dev/null | head -200 || true
    exit 1
  fi

  echo "✅ Test setup completed successfully"

after_test: |
  kubectl delete prometheusrule -n default order-processing-alerts || true
