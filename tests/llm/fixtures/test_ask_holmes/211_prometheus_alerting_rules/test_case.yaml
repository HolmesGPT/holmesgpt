# Test that Holmes can find and describe custom Prometheus alerting rules
user_prompt: "What Prometheus alerting rule monitors order processing time? Tell me the rule name, the PromQL expression, and what severity it has."

expected_output:
  - "Must identify the alert name: OrderProcessingLatencyHigh"
  - "Must include the PromQL expression containing histogram_quantile and order_processing_duration"
  - "Must mention the severity label is 'warning'"

tags:
  - prometheus
  - question-answer

include_tool_calls: true

port_forwards:
  - namespace: default
    service: robusta-kube-prometheus-st-prometheus
    local_port: 10211
    remote_port: 9090

before_test: |
  set -e
  echo "📁 Creating namespace app-211..."
  kubectl create namespace app-211 --dry-run=client -o yaml | kubectl apply -f -

  echo "⚙️ Applying PrometheusRule CRD..."
  kubectl apply -f prometheus-rule.yaml -n app-211

  echo "🔍 Verifying rule is loaded by Prometheus..."
  RULES_LOADED=false
  for i in {1..60}; do
    RULES_OUTPUT=$(kubectl exec -n default deployment/robusta-kube-prometheus-st-prometheus -- wget -q -O- http://localhost:9090/api/v1/rules 2>/dev/null || true)
    if echo "$RULES_OUTPUT" | grep -q "OrderProcessingLatencyHigh"; then
      echo "✅ Custom alerting rule is loaded!"
      RULES_LOADED=true
      break
    fi
    echo "⏳ Attempt $i/60: Rule not loaded yet, waiting for Prometheus to pick it up..."
    sleep 2
  done

  if [ "$RULES_LOADED" = false ]; then
    echo "❌ Rule failed to load after 120 seconds"
    echo "PrometheusRule status:"
    kubectl get prometheusrule -n app-211 -o yaml || true
    echo "Prometheus rules API output:"
    kubectl exec -n default deployment/robusta-kube-prometheus-st-prometheus -- wget -q -O- http://localhost:9090/api/v1/rules 2>/dev/null | head -100 || true
    exit 1
  fi

  echo "✅ Test setup completed successfully"

after_test: |
  kubectl delete namespace app-211 || true
