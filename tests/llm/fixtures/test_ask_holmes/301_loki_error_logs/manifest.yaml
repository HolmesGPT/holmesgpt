apiVersion: v1
kind: Pod
metadata:
  name: payment-gateway-v7bqm-582kd
  namespace: app-301
  labels:
    app: payment-gateway
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: payment-gateway
      image: python:3.9-slim
      command: ["python", "-u", "/app/payment_processor.py"]
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumeMounts:
        - name: service-code
          mountPath: /app
      resources:
        requests:
          memory: "32Mi"
          cpu: "10m"
        limits:
          memory: "128Mi"
  volumes:
    - name: service-code
      secret:
        secretName: payment-gateway-301-code
