# Test: Elasticsearch Shard Explosion - Filter Required for Shard Queries
#
# This test creates ~110 shards across 21 indexes to test shard filtering.
# The LLM must use the index filter parameter to query shards for specific indexes.
#
# Note: Reduced from 1000 to ~110 shards to allow concurrent execution with
# other ES tests within the 2000 shard cluster limit.
#
# Setup:
# - 20 indexes with 5 shards each = 100 shards
# - 1 special index (holmes-shard-analytics) with 7 primary shards = 7 shards
# - Total: 107 shards
#
# Anti-hallucination: The specific shard count (7 primary) can only be found by querying.
# Common defaults are 1 or 5 shards, so 7 is unusual and proves actual discovery.
#
# Requirements:
# - ELASTICSEARCH_URL: URL to Elasticsearch cluster
# - ELASTICSEARCH_API_KEY: API key for authentication

user_prompt: "Our analytics dashboard seems slow. Can you check the shard configuration for the holmes-shard-analytics index? How many primary shards does it have and what is their status?"

expected_output:
  - "Must report that holmes-shard-analytics has 7 primary shards"
  - "Must mention the shard status (STARTED, INITIALIZING, or similar)"

tags:
  - elasticsearch
  - hard
  - scale

setup_timeout: 90

before_test: |
  set -e

  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  if [ -z "$ELASTICSEARCH_URL" ]; then
    echo "ELASTICSEARCH_URL environment variable is not set"
    exit 1
  fi

  echo "Creating 21 indexes with ~110 total shards..."

  # Clean up any existing test data first
  echo "Cleaning up any existing test data..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-shard-*" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true
  curl -s -X DELETE "${ELASTICSEARCH_URL}/_index_template/holmes-shard-template" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  # First, create an index template for the data indexes
  # Using 5 shards per index (reduced from 10 for concurrent execution)
  echo "Creating index template with 5 shards..."
  TEMPLATE_RESPONSE=$(curl -s -X PUT "${ELASTICSEARCH_URL}/_index_template/holmes-shard-template" \
    -H "Content-Type: application/json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    -d '{
      "index_patterns": ["holmes-shard-data-*"],
      "template": {
        "settings": {
          "number_of_shards": 5,
          "number_of_replicas": 0
        }
      }
    }')

  if echo "$TEMPLATE_RESPONSE" | grep -q '"acknowledged":true'; then
    echo "Index template created successfully"
  else
    echo "Template response: $TEMPLATE_RESPONSE"
  fi

  # Now create 20 indexes via bulk insert - template applies 5 shards automatically
  BULK_FILE="/tmp/es_shard_bulk.ndjson"
  > "$BULK_FILE"

  for i in $(seq -w 1 20); do
    INDEX_NAME="holmes-shard-data-${i}"
    echo "{\"index\": {\"_index\": \"${INDEX_NAME}\"}}" >> "$BULK_FILE"
    echo "{\"@timestamp\": \"2024-01-15T12:00:00Z\", \"value\": ${i}}" >> "$BULK_FILE"
  done

  echo "Creating 20 indexes via bulk API (with 5 shards each from template)..."
  RESPONSE=$(curl -s -X POST "${ELASTICSEARCH_URL}/_bulk" \
    -H "Content-Type: application/x-ndjson" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    --data-binary @"$BULK_FILE")

  if echo "$RESPONSE" | grep -q '"errors":false'; then
    echo "Bulk insert successful - created 20 indexes with 5 shards each"
  else
    echo "Some errors during bulk insert (may be expected if re-running)"
  fi

  echo "Created 20 indexes with 5 shards each (100 shards)"

  # Create the special analytics index with 7 shards and 0 replicas
  echo "Creating special analytics index with 7 shards..."

  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-shard-analytics" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" > /dev/null 2>&1 || true

  ANALYTICS_RESPONSE=$(curl -s -X PUT "${ELASTICSEARCH_URL}/holmes-shard-analytics" \
    -H "Content-Type: application/json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    -d '{
      "settings": {
        "number_of_shards": 7,
        "number_of_replicas": 0
      },
      "mappings": {
        "properties": {
          "@timestamp": {"type": "date"},
          "metric": {"type": "keyword"},
          "value": {"type": "float"}
        }
      }
    }')

  if echo "$ANALYTICS_RESPONSE" | grep -q '"acknowledged":true'; then
    echo "Analytics index created with 7 shards"
  else
    echo "Failed to create analytics index: $ANALYTICS_RESPONSE"
    exit 1
  fi

  # Insert some data
  curl -s -X POST "${ELASTICSEARCH_URL}/holmes-shard-analytics/_doc" \
    -H "Content-Type: application/json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" \
    -d '{"@timestamp": "2024-01-15T12:00:00Z", "metric": "page_views", "value": 12345}' > /dev/null

  sleep 3

  # Verify shard count for analytics index
  SHARD_INFO=$(curl -s -X GET "${ELASTICSEARCH_URL}/_cat/shards/holmes-shard-analytics?format=json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}")

  SHARD_COUNT=$(echo "$SHARD_INFO" | grep -o '"prirep":"p"' | wc -l)
  echo "Analytics index has $SHARD_COUNT primary shards (expecting 7)"

  # Count total shards in cluster
  TOTAL_SHARDS=$(curl -s -X GET "${ELASTICSEARCH_URL}/_cat/shards/holmes-shard-*?format=json" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" | grep -o '"index"' | wc -l)
  echo "Total test shards created: $TOTAL_SHARDS"
  echo "Setup complete!"

after_test: |
  ELASTICSEARCH_URL=$(echo $ELASTICSEARCH_URL | tr -d '"')
  ELASTICSEARCH_API_KEY=$(echo $ELASTICSEARCH_API_KEY | tr -d '"')

  echo "Cleaning up test indexes (holmes-shard-*)..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/holmes-shard-*" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  echo "Cleaning up index template..."
  curl -s -X DELETE "${ELASTICSEARCH_URL}/_index_template/holmes-shard-template" \
    -H "Authorization: ApiKey ${ELASTICSEARCH_API_KEY}" || true

  echo "Cleanup complete"
