apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: app
        # see Dockerfile in tests/llm/fixtures/shared/python-flask-otel/Dockerfile
        image: me-west1-docker.pkg.dev/robusta-development/development/python-flask-otel:3.0
        imagePullPolicy: IfNotPresent
        command: ["python", "/app/payment_processor.py"]
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: OTLP_ENDPOINT
          value: tempo.app-300.svc.cluster.local:4317
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: src
          mountPath: /app
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "256Mi"
      volumes:
      - name: src
        secret:
          secretName: payments-src
