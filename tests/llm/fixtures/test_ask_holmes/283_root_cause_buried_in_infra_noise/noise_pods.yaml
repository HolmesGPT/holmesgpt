      labels: {app: log-archival, component: ingest-worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "48", memory: 384Gi}
  - apiVersion: v1
