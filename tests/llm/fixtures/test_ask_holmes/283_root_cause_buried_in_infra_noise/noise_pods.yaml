# "Noise" workloads in the same busy namespace. They generate REAL,
# cluster-verifiable warning events (nothing injected/faked) that are highly
# tempting to blame for the index-to-es task failures -- but provably could not
# have caused them, because every one of these failure modes prevents a pod
# from STARTING, and the task pods demonstrably Scheduled, Pulled and Started
# (their lifecycle events survive their deletion).
#
# The noise deliberately shares the "log-archival" pipeline naming so the whole
# stack looks broken, and each failure mode is chosen to SMELL like the kind of
# cluster-wide infrastructure problem that could plausibly explain a
# connection failure:
#
#  * log-archival-ingest-worker-0..5 -> permanently Pending with real
#    "FailedScheduling: Insufficient cpu / Insufficient memory" warnings
#    (requests far beyond node allocatable). Reads as a namespace capacity
#    crisis.
#  * log-archival-compactor-0..2 -> image on an unresolvable internal registry
#    host, so kubelet emits real Failed/ErrImagePull warnings containing
#    "dial tcp: lookup registry.internal ... no such host". Reads as a
#    cluster-wide DNS / network outage.
#  * log-archival-forwarder-0..1 -> RuntimeClass whose handler (runsc/gVisor)
#    is not installed on the node, so kubelet emits real
#    "FailedCreatePodSandBox" warnings. Reads as node/container-runtime
#    breakage across the namespace.
#
# None of this stopped the index-to-es task pods, which actually ran (see
# their own lifecycle events) before failing at the application layer.
apiVersion: v1
kind: List
items:
  - apiVersion: node.k8s.io/v1
    kind: RuntimeClass
    metadata:
      name: gvisor-sandboxed
    # gVisor is not installed on these nodes; any pod selecting this class
    # fails sandbox creation with a real FailedCreatePodSandBox event.
    handler: runsc
  - apiVersion: v1
    kind: Pod
    metadata:
      name: log-archival-ingest-worker-0
      namespace: app-283
      labels: {app: log-archival, component: ingest-worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "48", memory: 384Gi}
  - apiVersion: v1
    kind: Pod
    metadata:
      name: log-archival-ingest-worker-1
      namespace: app-283
      labels: {app: log-archival, component: ingest-worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "48", memory: 384Gi}
  - apiVersion: v1
    kind: Pod
