# RED EVAL — reproduces: "Incorrect root cause attribution — infrastructure
# noise prioritized over application-level evidence (failing to determine
# whether the pod actually ran)."
#
# Scenario: an Airflow DAG ("log-archival") runs its final task ("index-to-es")
# via the KubernetesPodOperator, which spawns an ephemeral pod in-cluster. The
# task failed 3 times. All in-cluster state here is REAL (no injected/fake
# events):
#
#   * before_test actually runs the 3 task pods
#     (log-archival-index-to-es-7q4w9z-{1,2,3}). They schedule, pull their
#     image, start, then fail at the APPLICATION layer (the indexer cannot
#     reach Elasticsearch) and exit non-zero. The operator then deletes them
#     (its default on-finish behavior), so `kubectl logs` returns nothing -- but
#     their Scheduled/Pulled/Started events remain and prove they ran. The real
#     error lives in the Airflow task logs, not in kubectl.
#
#   * The namespace is full of REAL but UNRELATED warning noise, deliberately
#     named as sibling components of the same log-archival pipeline so the
#     whole stack looks broken, and chosen to SMELL like infrastructure
#     problems that could explain a connection failure:
#       - log-archival-ingest-worker-* stuck Pending with real
#         "FailedScheduling: Insufficient cpu/memory" (capacity-crisis flavor)
#       - log-archival-compactor-* in real ErrImagePull whose error contains a
#         DNS lookup failure for registry.internal (DNS/network-outage flavor)
#       - log-archival-forwarder-* with real FailedCreatePodSandBox events
#         (missing gVisor runtime handler; runtime-breakage flavor)
#     Every one of these failure modes prevents a pod from STARTING; since the
#     task pods demonstrably Scheduled, Pulled and Started, none of the noise
#     can be the cause of the task failures.
#
# The bug: Holmes over-weights the loud cluster-wide warning noise and blames
# scheduling/image/sandbox problems for the task failures, instead of
# recognizing that the task pods actually ran (so infra did not block them)
# and that the real cause is application-level and must be read from the
# Airflow task logs.
user_prompt: "Our 'log-archival' Airflow DAG's final task ('index-to-es') has failed 3 times in a row in the app-283 namespace. The task runs by launching an ephemeral Kubernetes pod to do its work. Can you investigate and tell me the most likely root cause of these task failures?"

expected_output:
  - "Concludes the failure is application-level: the task pods actually started and ran (their Kubernetes events show them Scheduled and Started), so the container launched and then failed on its own — not a Kubernetes scheduling or image-pull problem."
  - "Does NOT blame the root cause on the other broken pods in the namespace (the FailedScheduling/Pending, ImagePullBackOff, or FailedCreatePodSandBox ones) or on general namespace capacity/scheduling pressure — that noise only prevents pods from starting, and the task pods started."

tags:
  - kubernetes
  - chain-of-causation
  - transparency
  - hard

# Give the investigation the optional planning/reasoning tools. HypothesisWrite
# lets Holmes track competing root-cause hypotheses (infra vs application) and
# weigh the evidence for each instead of latching onto the loudest infra signal.
enable_todo: true
enable_hypothesis: true

setup_timeout: 600

before_test: |
  set -e
  kubectl create namespace app-283 --dry-run=client -o yaml | kubectl apply -f -

  # Real, unrelated noise: FailedScheduling + ErrImagePull + FailedCreatePodSandBox.
  kubectl apply -f noise_pods.yaml

  # Really run the 3 task pods to failure, prove they ran, then delete them.
  bash run_real.sh

  # Verify the unrelated FailedScheduling noise is actually present so the test
  # exercises the trap.
  sched_ok=false
  for i in $(seq 1 30); do
    if kubectl get events -n app-283 --field-selector reason=FailedScheduling 2>/dev/null | grep -q FailedScheduling; then
      sched_ok=true; break
    fi
    sleep 1
  done
  if [ "$sched_ok" = false ]; then
    echo "ERROR: expected FailedScheduling noise events were not produced."
    kubectl get events -n app-283 | head -60 || true
    exit 1
  fi

  # Confirm the task pods themselves are absent (deleted), so kubectl logs yields nothing.
  if kubectl get pod log-archival-index-to-es-7q4w9z-1 -n app-283 >/dev/null 2>&1; then
    echo "ERROR: task pod unexpectedly exists; it should have been deleted."
    exit 1
  fi

after_test: |
  kubectl delete namespace app-283 --ignore-not-found
  # RuntimeClass is cluster-scoped, so namespace deletion does not remove it.
  kubectl delete runtimeclass gvisor-sandboxed --ignore-not-found
