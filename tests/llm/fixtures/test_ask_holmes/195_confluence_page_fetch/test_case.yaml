user_prompt: |
  Fetch the Confluence page with ID 196614 and tell me what the page is about.

expected_output:
  - "Must mention that this is a test page or HolmesGPT eval page"

tags:
  - confluence
  - question-answer
  - medium

# Required env vars:
#   CONFLUENCE_USER - Email/username for Confluence (required)
#   CONFLUENCE_API_KEY - Atlassian API token (required)
#   CONFLUENCE_BASE_URL - e.g., https://robusta-llm-test.atlassian.net (required)
#
# Note: Page ID 196614 should be a pre-existing test page in the Confluence instance.
# Update the page ID if using a different Confluence instance.
