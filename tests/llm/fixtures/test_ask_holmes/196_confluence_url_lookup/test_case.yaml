user_prompt: |
  I have a Confluence page at this URL: https://robusta-llm-test.atlassian.net/wiki/spaces/MFS/pages/196614/HolmesGPT+Eval+Test+Page

  Please fetch the contents of this page and tell me what it's about.

expected_output:
  - "Must mention that this is a test page or HolmesGPT eval page"

tags:
  - confluence
  - question-answer
  - medium

# Required env vars:
#   CONFLUENCE_USER - Email/username for Confluence (required)
#   CONFLUENCE_API_KEY - Atlassian API token (required)
#   CONFLUENCE_BASE_URL - e.g., https://robusta-llm-test.atlassian.net (required)
#
# This test provides a full Confluence URL instead of a page ID.
# The current YAML toolset only supports fetch by page ID, so this test
# should fail until the toolset is enhanced to parse page IDs from URLs
# or support URL-based lookups.
