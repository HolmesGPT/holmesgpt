# Test: Fetch Confluence page from URL (no page ID provided)
# Tests that Holmes can fetch a page when given a full URL instead of page ID.
# Should FAIL with current toolset until URL parsing is implemented.
#
# Requirements:
#   CONFLUENCE_USER - Email/username for Confluence
#   CONFLUENCE_API_KEY - Atlassian API token
#   CONFLUENCE_BASE_URL - e.g., https://robusta-dev.atlassian.net
#
# Note: Update URL to match an existing page in your Confluence instance.

user_prompt: |
  I have a Confluence page at this URL: https://robusta-dev.atlassian.net/wiki/spaces/MFS/pages/196614/Test+Page

  Please fetch the contents of this page and tell me what it's about.

expected_output:
  - "Must call a Confluence tool to retrieve the page"
  - "Must NOT use fetch_url tool"
  - "Must NOT use fetch_runbook_from_url or any runbook fetching tool"
  - "Must describe the page content or topic"

include_tool_calls: true

tags:
  - confluence
  - question-answer
  - medium
