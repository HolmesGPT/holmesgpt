# Only the internet toolset is enabled, on its default configuration, so
# fetch_webpage is the only tool that can retrieve the page. No cluster needed.
toolsets:
  internet:
    enabled: true
  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  helm/core:
    enabled: false
  bash:
    enabled: false
  connectivity_check:
    enabled: false
