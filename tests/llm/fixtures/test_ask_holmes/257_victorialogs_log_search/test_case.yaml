# Test: VictoriaLogs Log Search with LogsQL (self-hosted)
# VictoriaLogs runs inside the test namespace, so the eval needs no credentials.
#
# Anti-hallucination: 3 specific error codes (VLERR-XXXX) tied to a unique stream.
# The LLM cannot know these without actually querying the server.

user_prompt: "Search VictoriaLogs for ERROR level log messages from the 'payment-api-257' service in the 'app-257' namespace. What error codes (format VLERR-XXXX) appear in those logs?"

expected_output:
  - "Must identify ERROR level logs from the payment-api-257 service"
  - "Must list the 3 specific error codes that were injected: VLERR-7291, VLERR-4058, and VLERR-9463"
  - "Should mention the error messages associated with these codes"

tags:
  - regression
  - victorialogs
  - logs
  - medium

port_forwards:
  - namespace: app-257
    service: victorialogs
    local_port: 3257
    remote_port: 9428

setup_timeout: 480

before_test: |
  set -e
  NAMESPACE="app-257"

  kubectl create namespace $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

  echo "Deploying VictoriaLogs..."
  kubectl apply -f victorialogs.yaml -n $NAMESPACE

  # Both waits are time-boxed (240s + 200s) so they, and the diagnostics after
  # them, finish inside setup_timeout.
  POD_READY=false
  DEADLINE=$((SECONDS + 240))
  while [ $SECONDS -lt $DEADLINE ]; do
    if kubectl wait --for=condition=ready pod -l app=victorialogs -n $NAMESPACE --timeout=5s 2>/dev/null; then
      echo "VictoriaLogs pod is ready"
      POD_READY=true
      break
    fi
    sleep 1
  done
  if [ "$POD_READY" = false ]; then
    echo "VictoriaLogs pod failed to become ready"
    kubectl get pods -n $NAMESPACE
    kubectl logs -l app=victorialogs -n $NAMESPACE --tail=20 || true
    exit 1
  fi

  echo "Shipping logs from inside the cluster..."
  kubectl create secret generic log-shipper-script \
    --from-file=ship_logs.sh=./ship_logs.sh \
    -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
  kubectl delete job log-shipper -n $NAMESPACE --ignore-not-found --wait=true
  kubectl apply -f log-shipper-job.yaml -n $NAMESPACE

  # The job ingests the logs and exits non-zero unless all 3 error codes are queryable.
  # The Job's activeDeadlineSeconds (180) ends it inside this window.
  JOB_DONE=false
  DEADLINE=$((SECONDS + 200))
  while [ $SECONDS -lt $DEADLINE ]; do
    if kubectl wait --for=condition=complete job/log-shipper -n $NAMESPACE --timeout=2s 2>/dev/null; then
      JOB_DONE=true
      break
    fi
    FAILED=$(kubectl get job log-shipper -n $NAMESPACE -o jsonpath='{.status.failed}' 2>/dev/null || true)
    if [ -n "$FAILED" ] && [ "$FAILED" -gt 0 ]; then
      break
    fi
    sleep 1
  done
  kubectl logs job/log-shipper -n $NAMESPACE || true
  if [ "$JOB_DONE" = false ]; then
    echo "Log shipping or verification failed"
    kubectl get pods -n $NAMESPACE
    exit 1
  fi
  echo "Setup complete"

after_test: |
  kubectl delete namespace app-257 --ignore-not-found
