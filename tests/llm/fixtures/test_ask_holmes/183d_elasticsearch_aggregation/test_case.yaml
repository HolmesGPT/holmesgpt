# Test: Elasticsearch Aggregation Queries
# Tests that Holmes can use Elasticsearch aggregations to summarize data by category
#
# Requirements:
# - ELASTICSEARCH_URL: URL to Elasticsearch cluster
# - ELASTICSEARCH_API_KEY: API key for authentication
#
# Anti-hallucination: The test injects a specific distribution of events by service:
# - payment-api: 5 events
# - order-service: 3 events
# - inventory-api: 2 events
# The LLM cannot know these exact counts without running an aggregation query.

user_prompt: "What is the distribution of events by service in the 'holmes-eval-events' index? Give me the count of events for each service."

expected_output:
  - "Must call elasticsearch_search tool with a terms aggregation on the service field"
  - "Must report payment-api has 5 events (the highest count)"
  - "Must report order-service has 3 events"
  - "Must report inventory-api has 2 events"
  - "The total event count should be 10"

include_tool_calls: true

tags:
  - elasticsearch
  - question-answer
  - medium

setup_timeout: 30

before_test: |
  set -e

  # Check required environment variables
  if [ -z "$ELASTICSEARCH_URL" ]; then
    echo "❌ ELASTICSEARCH_URL environment variable is not set"
    exit 1
  fi

  export HOLMES_ES_TEST_INDEX="holmes-eval-events"

  # Build auth header
  AUTH_HEADER=""
  if [ -n "$ELASTICSEARCH_API_KEY" ]; then
    AUTH_HEADER="-H 'Authorization: ApiKey $ELASTICSEARCH_API_KEY'"
  fi

  # Delete the index if it exists
  echo "⏳ Cleaning up any existing test index..."
  eval curl -s -X DELETE "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX" $AUTH_HEADER || true

  # Create the test index
  echo "⏳ Creating test index..."
  eval curl -s -X PUT "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX" \
    -H 'Content-Type: application/json' \
    $AUTH_HEADER \
    -d '{
      "settings": {
        "number_of_shards": 1,
        "number_of_replicas": 0
      },
      "mappings": {
        "properties": {
          "timestamp": {"type": "date"},
          "service": {"type": "keyword"},
          "event_type": {"type": "keyword"},
          "duration_ms": {"type": "integer"}
        }
      }
    }'

  # Create documents with specific distribution:
  # payment-api: 5 events
  # order-service: 3 events
  # inventory-api: 2 events
  BULK_DATA=''

  # payment-api: 5 events
  for i in 1 2 3 4 5; do
    BULK_DATA+="{\"index\":{}}\n{\"timestamp\":\"2025-01-01T10:0${i}:00Z\",\"service\":\"payment-api\",\"event_type\":\"request\",\"duration_ms\":$((100 + i * 10))}\n"
  done

  # order-service: 3 events
  for i in 1 2 3; do
    BULK_DATA+="{\"index\":{}}\n{\"timestamp\":\"2025-01-01T11:0${i}:00Z\",\"service\":\"order-service\",\"event_type\":\"request\",\"duration_ms\":$((200 + i * 10))}\n"
  done

  # inventory-api: 2 events
  for i in 1 2; do
    BULK_DATA+="{\"index\":{}}\n{\"timestamp\":\"2025-01-01T12:0${i}:00Z\",\"service\":\"inventory-api\",\"event_type\":\"request\",\"duration_ms\":$((300 + i * 10))}\n"
  done

  # Index the documents
  echo -e "$BULK_DATA" | eval curl -s -X POST "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX/_bulk" \
    -H 'Content-Type: application/x-ndjson' \
    $AUTH_HEADER \
    --data-binary @-

  # Refresh the index
  eval curl -s -X POST "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX/_refresh" $AUTH_HEADER

  # Verify total document count
  DOC_COUNT=$(eval curl -s -X GET "$ELASTICSEARCH_URL/$HOLMES_ES_TEST_INDEX/_count" $AUTH_HEADER | grep -o '"count":[0-9]*' | cut -d':' -f2)

  if [ "$DOC_COUNT" = "10" ]; then
    echo "✅ Test index created with $DOC_COUNT events (payment-api: 5, order-service: 3, inventory-api: 2)"
  else
    echo "❌ Expected 10 events but found: $DOC_COUNT"
    exit 1
  fi

after_test: |
  # Clean up the test index
  AUTH_HEADER=""
  if [ -n "$ELASTICSEARCH_API_KEY" ]; then
    AUTH_HEADER="-H 'Authorization: ApiKey $ELASTICSEARCH_API_KEY'"
  fi

  echo "⏳ Cleaning up test index: holmes-eval-events"
  eval curl -s -X DELETE "$ELASTICSEARCH_URL/holmes-eval-events" $AUTH_HEADER || true
  echo "✅ Cleanup complete"
