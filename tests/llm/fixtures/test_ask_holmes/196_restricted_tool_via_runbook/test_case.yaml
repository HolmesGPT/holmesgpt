user_prompt: "Get the logs from the test-pod in the app-196 namespace"
expected_output:
  - Holmes should successfully retrieve the logs
  - The logs should show "Application started successfully"
  - Must call the fetch_runbook tool first to authorize restricted tools
include_tool_calls: true
runbooks:
  catalog:
    - id: pod-logs-investigation
      description: "Guide for investigating pod logs when troubleshooting application issues"
      link: "pod_logs_runbook.md"
before_test: |
  kubectl create namespace app-196 || true
  kubectl apply -f manifests.yaml
  # Wait for pod to be ready
  POD_READY=false
  for i in {1..12}; do
    if kubectl wait --for=condition=ready pod -l app=test-pod -n app-196 --timeout=5s 2>/dev/null; then
      echo "✅ Pod is ready!"
      POD_READY=true
      break
    fi
    echo "⏳ Attempt $i/12: waiting for pod..."
    sleep 5
  done
  if [ "$POD_READY" = false ]; then
    echo "❌ Pod not ready after 60s"
    kubectl get pods -n app-196
    exit 1
  fi
after_test: |
  kubectl delete namespace app-196 --ignore-not-found
tags:
  - tool-restriction
  - runbooks
  - kubernetes
