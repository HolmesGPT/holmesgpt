apiVersion: v1
kind: Pod
metadata:
  name: test-pod
  namespace: app-196
  labels:
    app: test-pod
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Application started successfully' && sleep 3600"]
      resources:
        limits:
          memory: "64Mi"
          cpu: "100m"
        requests:
          memory: "32Mi"
          cpu: "50m"
