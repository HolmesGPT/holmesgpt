# Shared Confluence HTTP toolset config (service account, API gateway)
toolsets:
  confluence-api:
    type: http
    enabled: true
    config:
      endpoints:
        - hosts:
            - "api.atlassian.com"
          paths: ["/ex/confluence/*/wiki/rest/api/*"]
          methods: ["GET"]
          auth:
            type: bearer
            token: "{{ env.CONFLUENCE_SA_API_KEY }}"
      verify_ssl: true
      timeout_seconds: 30
    llm_instructions: |
      ### Confluence REST API

      You can query Confluence using the REST API via the Atlassian gateway.

      The base URL is: {{ env.CONFLUENCE_SA_BASE_URL }}

      **Endpoints:**

      - GET /wiki/rest/api/space - List spaces. Query params: limit, start, type (global/personal), status (current/archived)
      - GET /wiki/rest/api/space/{spaceKey} - Get space details
      - GET /wiki/rest/api/content/{contentId} - Get page by ID. Use ?expand=body.storage for body, ?expand=ancestors for parent hierarchy
      - GET /wiki/rest/api/content/{contentId}/child/page - Get child pages. Query params: limit, start, expand (e.g. body.storage)
      - GET /wiki/rest/api/content/{contentId}/child/comment - Get comments on a page. Query params: limit, start, expand (e.g. body.storage,version)
      - GET /wiki/rest/api/content/search?cql={query} - Search using CQL. Query params: limit, start, expand (e.g. body.storage)

      **CQL examples:**

      - Search by title: `title="Page Title"`
      - Search by text: `text~"searchterm"`
      - Search in space: `space=SPACEKEY AND text~"searchterm"`
      - Search by label: `label="my-label"`

      **Extracting page IDs from URLs:**

      URL format: https://company.atlassian.net/wiki/spaces/SPACE/pages/12345/Title
      The content ID is the numeric part: 12345

  kubernetes/core:
    enabled: false
  kubernetes/logs:
    enabled: false
  helm/core:
    enabled: false
