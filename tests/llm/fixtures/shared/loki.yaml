# Shared Loki deployment configuration for test fixtures
# Apply with: kubectl apply -f loki.yaml -n <namespace>
# Note: Namespace must be created separately
---
# Loki deployment - lightweight. Data lives in an emptyDir, so it survives
# container restarts but not pod deletion.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
      annotations:
        admission.datadoghq.com/enabled: "false"
    spec:
      containers:
      - name: loki
        image: grafana/loki:2.9.0
        args:
        - -config.file=/etc/loki/loki-config.yaml
        ports:
        - containerPort: 3100
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/loki
        - name: data
          mountPath: /loki
        resources:
          requests:
            memory: "64Mi"
            cpu: "10m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
spec:
  selector:
    app: loki
  ports:
  - port: 3100
    targetPort: 3100
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
data:
  loki-config.yaml: |
    # Evals seed logs with timestamps years in the past and query them for
    # hours. The deprecated boltdb index never served flushed chunks back, so
    # all data vanished at the first flush (~30 min); tsdb reads them from disk.
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    ingester:
      max_chunk_age: 17520h  # 2 years
      wal:
        enabled: true
        dir: /loki/wal
    schema_config:
      configs:
        - from: 2020-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
      filesystem:
        directory: /loki/chunks
    # Models query years-wide ranges in parallel; small splits and the default
    # queue of 100 per tenant turned those into 429s and timeouts.
    query_scheduler:
      max_outstanding_requests_per_tenant: 2048
    frontend:
      max_outstanding_per_tenant: 2048
    limits_config:
      reject_old_samples: false
      max_entries_limit_per_query: 5000
      max_query_lookback: 17520h  # 2 years
      split_queries_by_interval: 24h
      allow_structured_metadata: false
