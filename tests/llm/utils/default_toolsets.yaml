toolsets:
  # Core generic Kubernetes toolsets
  kubernetes/core:
    enabled: true
  kubernetes/logs:
    enabled: true
  
  # Helm toolset
  helm/core:
    enabled: true
  
  # Core investigation and utility toolsets
  core_investigation:
    enabled: true
  internet:
    enabled: true
  runbook:
    enabled: true
  robusta:
    enabled: true
  connectivity_check:
    enabled: true
  bash:
    enabled: true
    config:
      builtin_allowlist: "extended"
      deny:
        - "kubectl get secret"
        - "kubectl describe secret"
