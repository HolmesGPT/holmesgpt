{{- if and .Values.mcpAddons.aws.enabled .Values.mcpAddons.aws.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-aws-mcp-network-policy
  namespace: {{ .Values.mcpAddons.aws.config.namespace | default .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-aws-mcp
    app.kubernetes.io/name: aws-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-aws-mcp
      app.kubernetes.io/name: aws-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
  - Ingress
  ingress:
  # Allow traffic only from Holmes pods (app: holmes) in the release namespace.
  # podSelector + namespaceSelector in the same `from` element are AND-ed, which
  # keeps this working when the MCP server runs in its own namespace.
  - from:
    - podSelector:
        matchLabels:
          app: holmes
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: {{ .Release.Namespace }}
    ports:
    - protocol: TCP
      port: 8000
{{- end }}
