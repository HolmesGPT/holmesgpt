{{- if .Values.mcpAddons.kubernetes.enabled }}
{{- $serverConfig := .Values.mcpAddons.kubernetes.config.serverConfig | default "" -}}
{{- $configSecret := include "holmes.kubernetesMcp.configSecret" . | fromYaml -}}
{{- /* A CA certificate is public, so it lives in the ConfigMap, not a Secret. */ -}}
{{- $caCert := .Values.mcpAddons.kubernetes.config.certificateAuthority | default "" | trim -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-k8s-mcp-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
{{- if $caCert }}
data:
  ca.crt: |
{{ $caCert | indent 4 }}
{{- else }}
data: {}
{{- end }}
{{- if $serverConfig }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $configSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
type: Opaque
stringData:
  config.toml: |
{{ $serverConfig | indent 4 }}
{{- end }}
{{- if not (include "holmes.kubernetesMcp.inHolmesPod" .) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-k8s-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-k8s-mcp
      app.kubernetes.io/name: k8s-mcp-server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-k8s-mcp
        app.kubernetes.io/name: k8s-mcp-server
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: mcp-server
        app.kubernetes.io/part-of: holmes
      annotations:
        checksum/config: {{ .Values.mcpAddons.kubernetes | toYaml | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.mcpAddons.kubernetes.serviceAccount.name }}
      {{- if .Values.mcpAddons.kubernetes.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.mcpAddons.kubernetes.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.mcpAddons.kubernetes.tolerations }}
      tolerations:
        {{- toYaml .Values.mcpAddons.kubernetes.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.mcpAddons.kubernetes.affinity }}
      affinity:
        {{- toYaml .Values.mcpAddons.kubernetes.affinity | nindent 8 }}
      {{- end }}
      containers:
      - name: k8s-mcp
        image: "{{ .Values.mcpAddons.kubernetes.registry }}/{{ .Values.mcpAddons.kubernetes.image }}"
        imagePullPolicy: {{ .Values.mcpAddons.kubernetes.imagePullPolicy | default "IfNotPresent" }}
        args:
          {{- concat (list "--port" "8000") (include "holmes.kubernetesMcp.args" . | fromYamlArray) | toYaml | nindent 10 }}
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          {{- toYaml .Values.mcpAddons.kubernetes.resources | nindent 10 }}
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
        {{- with include "holmes.kubernetesMcp.volumeMounts" . | fromYamlArray }}
        volumeMounts:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- with include "holmes.kubernetesMcp.volumes" . | fromYamlArray }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-k8s-mcp-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
spec:
  selector:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
{{- if .Values.mcpAddons.kubernetes.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mcpAddons.kubernetes.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
  {{- with .Values.mcpAddons.kubernetes.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if .Values.mcpAddons.kubernetes.serviceAccount.createClusterRoleBinding }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-k8s-mcp
  labels:
    app: {{ .Release.Name }}-k8s-mcp
    app.kubernetes.io/name: k8s-mcp-server
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: mcp-server
    app.kubernetes.io/part-of: holmes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.mcpAddons.kubernetes.serviceAccount.clusterRole }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.mcpAddons.kubernetes.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
