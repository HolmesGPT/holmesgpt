{{- /*
Creates the remediation MCP token Secret at deploy time instead of rendering
it: a rendered random token differs on every clusterless render (ArgoCD,
`helm template`) and would roll both pods on each sync. ArgoCD runs this as a
PreSync hook.
The Secret records auth.rotation; when the value changes, the hook replaces the
token and restarts both Deployments. Rendering the value onto the Deployments
is what makes Helm/ArgoCD run the hook for a rotation.
*/ -}}
{{- define "holmes.kubernetesRemediationMcp.authBootstrapName" -}}
{{- printf "%s-k8s-remediation-mcp-auth-bootstrap" .Release.Name | trunc 63 | trimSuffix "-" -}}
{{- end -}}
{{- define "holmes.kubernetesRemediationMcp.authBootstrapMetadata" -}}
name: {{ include "holmes.kubernetesRemediationMcp.authBootstrapName" .ctx }}
namespace: {{ .ctx.Release.Namespace }}
labels:
  app.kubernetes.io/component: mcp-server-auth-bootstrap
  app.kubernetes.io/part-of: holmes
  {{- include "holmes.commonLabels" .ctx | nindent 2 }}
annotations:
  helm.sh/hook: pre-install,pre-upgrade,pre-rollback
  helm.sh/hook-weight: {{ .weight | quote }}
  helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- with (include "holmes.commonAnnotations" .ctx) }}
  {{- . | nindent 2 }}
  {{- end }}
{{- end -}}
{{- $k8s := .Values.mcpAddons.kubernetesRemediation }}
{{- if and $k8s.enabled $k8s.auth.enabled (not $k8s.auth.existingSecret) }}
{{- $name := include "holmes.kubernetesRemediationMcp.authBootstrapName" . }}
{{- $secretName := include "holmes.kubernetesRemediationMcp.authSecretName" . }}
{{- $legacySecretName := printf "%s-k8s-remediation-mcp-auth" .Release.Name }}
{{- $deployments := list (printf "%s-holmes" .Release.Name) (printf "%s-k8s-remediation-mcp-server" .Release.Name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  {{- include "holmes.kubernetesRemediationMcp.authBootstrapMetadata" (dict "ctx" . "weight" "-10") | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  {{- include "holmes.kubernetesRemediationMcp.authBootstrapMetadata" (dict "ctx" . "weight" "-10") | nindent 2 }}
rules:
# create cannot be scoped by resourceNames.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $secretName | quote }}]
  verbs: ["get", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $legacySecretName | quote }}]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: {{ toJson $deployments }}
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  {{- include "holmes.kubernetesRemediationMcp.authBootstrapMetadata" (dict "ctx" . "weight" "-10") | nindent 2 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  {{- include "holmes.kubernetesRemediationMcp.authBootstrapMetadata" (dict "ctx" . "weight" "-5") | nindent 2 }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  # Lets tools that apply hooks as plain manifests re-run it on a later apply.
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server-auth-bootstrap
        app.kubernetes.io/part-of: holmes
        {{- include "holmes.commonLabels" . | nindent 8 }}
      {{- with (include "holmes.commonAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k8s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k8s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k8s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: bootstrap
        # The server image already ships kubectl and python.
        image: "{{ $k8s.registry }}/{{ $k8s.image }}"
        imagePullPolicy: {{ $k8s.imagePullPolicy | default "IfNotPresent" }}
        env:
        - name: HOME
          value: /tmp
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: SECRET_NAME
          value: {{ $secretName | quote }}
        - name: LEGACY_SECRET_NAME
          value: {{ $legacySecretName | quote }}
        - name: DEPLOYMENTS
          value: {{ join " " $deployments | quote }}
        - name: ROTATION
          value: {{ include "holmes.kubernetesRemediationMcp.authRotation" . | quote }}
        - name: SECRET_LABELS
          value: {{ include "holmes.commonLabels" . | fromYaml | default dict | toJson | quote }}
        - name: SECRET_ANNOTATIONS
          value: {{ include "holmes.commonAnnotations" . | fromYaml | default dict | toJson | quote }}
        command: ["python3", "-c"]
        args:
        - |
          import base64, json, os, secrets, subprocess, sys

          NS, NAME = os.environ["NAMESPACE"], os.environ["SECRET_NAME"]
          ROTATION = os.environ["ROTATION"]
          ROTATION_KEY = "robusta.dev/k8s-remediation-token-rotation"

          def kubectl(*args, stdin=None, ok_if=None):
              p = subprocess.run(["kubectl", *args, "-n", NS], input=stdin, capture_output=True, text=True)
              if p.returncode != 0 and not (ok_if and ok_if in p.stderr):
                  sys.exit(f"kubectl {args[0]} {args[1]} failed: {p.stderr.strip()}")
              return p

          def get(kind, name):
              out = kubectl("get", kind, name, "--ignore-not-found", "-o", "json").stdout
              return json.loads(out) if out.strip() else None

          def rotation_of(metadata):
              return (metadata.get("annotations") or {}).get(ROTATION_KEY)

          secret = get("secret", NAME)
          if secret is not None:
              if rotation_of(secret["metadata"]) == ROTATION and (secret.get("data") or {}).get("token"):
                  print(f"Secret {NAME} is at rotation {ROTATION}; keeping its token")
                  sys.exit(0)
              # Deleting first makes the steps below the only path that writes a
              # token.
              kubectl("delete", "secret", NAME, "--ignore-not-found")
              print(f"Rotating the token in Secret {NAME} to rotation {ROTATION}")

          # Pods read the token at start, so every Deployment already reading
          # this Secret holds one that is gone. Restart before creating: the new
          # pods wait for the Secret instead of reading a stale one, a crash at
          # any point leaves the Secret missing for the next run to redo, and a
          # restart always gets a fresh ReplicaSet (a rollback alone may revive
          # an old one with the old token).
          readers = 0
          for name in os.environ["DEPLOYMENTS"].split():
              deployment = get("deployment", name)
              if deployment is None:
                  continue
              refs = {
                  (env.get("valueFrom") or {}).get("secretKeyRef", {}).get("name")
                  for c in deployment["spec"]["template"]["spec"]["containers"]
                  for env in c.get("env") or []
              }
              if NAME in refs:
                  readers += 1
                  print(kubectl("rollout", "restart", "deployment", name).stdout.strip())

          # Upgrading from the chart-rendered Secret (nothing reads this one yet)
          # keeps its token, so the two sides never disagree mid-rollout, unless
          # the same upgrade also asks for a rotation.
          migrating = secret is None and readers == 0 and ROTATION == "0"
          legacy = get("secret", os.environ["LEGACY_SECRET_NAME"]) if migrating else None
          legacy_token = ((legacy or {}).get("data") or {}).get("token")
          token = base64.b64decode(legacy_token).decode() if legacy_token else secrets.token_urlsafe(36)

          # No app.kubernetes.io/instance label: ArgoCD label tracking would
          # treat the Secret as part of the app and prune it.
          labels = json.loads(os.environ["SECRET_LABELS"])
          labels.update({"app.kubernetes.io/component": "mcp-server-auth", "app.kubernetes.io/part-of": "holmes"})
          annotations = json.loads(os.environ["SECRET_ANNOTATIONS"])
          annotations[ROTATION_KEY] = ROTATION
          manifest = json.dumps({
              "apiVersion": "v1", "kind": "Secret", "type": "Opaque",
              "metadata": {"name": NAME, "namespace": NS, "labels": labels, "annotations": annotations},
              "stringData": {"token": token},
          })
          created = kubectl("create", "-f", "-", stdin=manifest, ok_if="AlreadyExists").returncode == 0
          source = "the previous chart's Secret" if legacy_token else "a new token"
          print(f"Created Secret {NAME} from {source}" if created else f"Secret {NAME} was created concurrently; keeping it")
        # The server's resources, so namespace quotas that admit it admit this.
        resources:
          {{- toYaml $k8s.resources | nindent 10 }}
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
{{- end }}
