{{- /*
Creates the remediation MCP token Secret at deploy time instead of rendering
it: a rendered random token differs on every clusterless render (ArgoCD,
`helm template`) and would roll both pods on each sync. ArgoCD runs this as a
PreSync hook. Every run also restarts any Deployment reading the Secret whose
pods predate it, so an interrupted rotation converges on the next run.
*/ -}}
{{- $k8s := .Values.mcpAddons.kubernetesRemediation }}
{{- if and $k8s.enabled $k8s.auth.enabled (not $k8s.auth.existingSecret) }}
{{- $name := printf "%s-k8s-remediation-mcp-auth-bootstrap" .Release.Name }}
{{- $secretName := include "holmes.kubernetesRemediationMcp.authSecretName" . }}
{{- $deployments := list (printf "%s-holmes" .Release.Name) (printf "%s-k8s-remediation-mcp-server" .Release.Name) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: mcp-server-auth-bootstrap
    app.kubernetes.io/part-of: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with (include "holmes.commonAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: mcp-server-auth-bootstrap
    app.kubernetes.io/part-of: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with (include "holmes.commonAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
rules:
# create cannot be scoped by resourceNames.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ $secretName | quote }}]
  verbs: ["get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: {{ toJson $deployments }}
  verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: mcp-server-auth-bootstrap
    app.kubernetes.io/part-of: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with (include "holmes.commonAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: mcp-server-auth-bootstrap
    app.kubernetes.io/part-of: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with (include "holmes.commonAnnotations" .) }}
    {{- . | nindent 4 }}
    {{- end }}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-server-auth-bootstrap
        app.kubernetes.io/part-of: holmes
        {{- include "holmes.commonLabels" . | nindent 8 }}
      {{- with (include "holmes.commonAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- with $k8s.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k8s.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $k8s.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: bootstrap
        # The server image already ships kubectl and python.
        image: "{{ $k8s.registry }}/{{ $k8s.image }}"
        imagePullPolicy: {{ $k8s.imagePullPolicy | default "IfNotPresent" }}
        env:
        - name: HOME
          value: /tmp
        - name: NAMESPACE
          value: {{ .Release.Namespace | quote }}
        - name: SECRET_NAME
          value: {{ $secretName | quote }}
        - name: DEPLOYMENTS
          value: {{ join " " $deployments | quote }}
        command: ["python3", "-c"]
        args:
        - |
          import datetime, json, os, secrets, subprocess, sys

          NS, NAME = os.environ["NAMESPACE"], os.environ["SECRET_NAME"]

          def kubectl(*args, stdin=None):
              p = subprocess.run(["kubectl", *args, "-n", NS], input=stdin, capture_output=True, text=True)
              if p.returncode != 0 and not (stdin and "AlreadyExists" in p.stderr):
                  sys.exit(f"kubectl {args[0]} {args[1]} failed: {p.stderr.strip()}")
              return p

          def get(*args):
              out = kubectl("get", *args, "--ignore-not-found", "-o", "json").stdout
              return json.loads(out) if out.strip() else None

          def ts(value):
              return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))

          secret = get("secret", NAME)
          if secret is None:
              # No app.kubernetes.io/instance label: ArgoCD label tracking would
              # treat the Secret as part of the app and prune it.
              manifest = {
                  "apiVersion": "v1", "kind": "Secret", "type": "Opaque",
                  "metadata": {
                      "name": NAME,
                      "namespace": NS,
                      "labels": {"app.kubernetes.io/component": "mcp-server-auth", "app.kubernetes.io/part-of": "holmes"},
                  },
                  "stringData": {"token": secrets.token_urlsafe(36)},
              }
              created = kubectl("create", "-f", "-", stdin=json.dumps(manifest)).returncode == 0
              print(f"Created Secret {NAME}" if created else f"Secret {NAME} was created concurrently; keeping it")
              secret = get("secret", NAME)
              if secret is None:
                  sys.exit(f"Secret {NAME} disappeared right after creation")
          else:
              print(f"Secret {NAME} exists; keeping its token")
          secret_created = ts(secret["metadata"]["creationTimestamp"])

          # Env from a Secret is read at container start, so pods created before
          # the Secret hold the previous token. A restart already issued after
          # the Secret was created counts as done, so a stuck rollout is not
          # restarted again on every sync.
          for name in os.environ["DEPLOYMENTS"].split():
              deployment = get("deployment", name)
              if deployment is None:
                  continue
              template = deployment["spec"]["template"]
              refs = {
                  (env.get("valueFrom") or {}).get("secretKeyRef", {}).get("name")
                  for c in template["spec"]["containers"]
                  for env in c.get("env") or []
              }
              if NAME not in refs:
                  continue
              restarted_at = (template["metadata"].get("annotations") or {}).get("kubectl.kubernetes.io/restartedAt")
              if restarted_at and ts(restarted_at) >= secret_created:
                  continue
              selector = ",".join(f"{k}={v}" for k, v in deployment["spec"]["selector"]["matchLabels"].items())
              pods = (get("pods", "-l", selector) or {}).get("items", [])
              if any(ts(p["metadata"]["creationTimestamp"]) < secret_created for p in pods):
                  print(kubectl("rollout", "restart", "deployment", name).stdout.strip())
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
{{- end }}
