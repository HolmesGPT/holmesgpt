{{- $networkPolicy := .Values.networkPolicy | default dict -}}
{{- if $networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-holmes-network-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app: holmes
    {{- include "holmes.commonLabels" . | nindent 4 }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      app: holmes
  policyTypes:
  - Ingress
  ingress:
  # Only Holmes' known callers, in any namespace: either may run outside the
  # release namespace.
  - from:
    # Robusta runner (label set by the Robusta chart)
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          robustaComponent: runner
    # Holmes operator
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          app: holmes-operator
    {{- with $networkPolicy.additionalIngressRules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    ports:
    - protocol: TCP
      port: 5050
{{- end }}
