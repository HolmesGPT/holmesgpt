{{- if .Values.operator.enabled }}
{{- /* With tls on, Holmes serves HTTPS on the same Service port: the operator
calls it over https and trusts the CA in operator.holmesApiCa, by default the
ca.crt of Holmes' own TLS Secret (cert-manager's layout). The CA volume is
optional: without that key the system trust store is used. */}}
{{- $tls := .Values.tls | default dict }}
{{- $holmesApiCa := .Values.operator.holmesApiCa | default dict }}
{{- $caSecret := $holmesApiCa.secretName }}
{{- if and (not $caSecret) $tls.enabled }}{{- $caSecret = $tls.secretName }}{{- end }}
{{- $caKey := $holmesApiCa.key | default "ca.crt" }}
{{- $scheme := ternary "https" "http" (eq (toString $tls.enabled) "true") }}
{{- $mounts := or (include "holmes.apiAuth.enabled" .) $caSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: holmes-operator
    app.kubernetes.io/name: holmes-operator
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    {{- include "holmes.commonLabels" . | nindent 4 }}
  {{- with (include "holmes.commonAnnotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-operator
      app.kubernetes.io/name: holmes-operator
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: holmes-operator
        app.kubernetes.io/name: holmes-operator
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "holmes.commonLabels" . | nindent 8 }}
      {{- with (include "holmes.commonAnnotations" .) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: "{{ .Values.operator.registry }}/{{ .Values.operator.image }}"
        imagePullPolicy: {{ .Values.operator.imagePullPolicy }}
        command:
          - python3
          - -m
          - holmes_operator.operator
        env:
        - name: HOLMES_API_URL
          value: {{ .Values.operator.holmesApiUrl | default (printf "%s://%s-holmes:80" $scheme .Release.Name) }}
        - name: HOLMES_API_TIMEOUT
          value: {{ .Values.operator.holmesApiTimeout | default 300 | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.operator.logLevel | default "INFO" }}
        - name: ENABLE_JSON_LOGS_FORMAT
          value: {{ .Values.global.enableJsonLogsFormat | default .Values.enableJsonLogsFormat | default false | quote }}
        - name: MAX_HISTORY_ITEMS
          value: {{ .Values.operator.maxHistoryItems | default 10 | quote }}
        - name: CLEANUP_COMPLETED_CHECKS
          value: {{ .Values.operator.cleanupCompletedChecks | default false | quote }}
        - name: COMPLETED_CHECK_TTL_HOURS
          value: {{ .Values.operator.completedCheckTTLHours | default 24 | quote }}
        {{- if include "holmes.apiAuth.enabled" . }}
        # The operator sends the chart's default API key to Holmes.
        - name: HOLMES_API_KEY_FILE
          value: {{ include "holmes.apiAuth.clientMountPath" . }}/token
        {{- end }}
        {{- if $caSecret }}
        - name: HOLMES_API_CA_FILE
          value: /etc/holmes-operator/holmes-ca/{{ $caKey }}
        {{- end }}
        {{- if .Values.operator.additionalEnvVars }}
        {{- toYaml .Values.operator.additionalEnvVars | nindent 8 }}
        {{- end }}
        {{- if $mounts }}
        volumeMounts:
          {{- if include "holmes.apiAuth.enabled" . }}
          {{- include "holmes.apiAuth.clientVolumeMount" . | nindent 10 }}
          {{- end }}
          {{- if $caSecret }}
          - name: holmes-api-ca
            mountPath: /etc/holmes-operator/holmes-ca
            readOnly: true
          {{- end }}
        {{- end }}
        resources:
          requests:
            memory: {{ .Values.operator.resources.requests.memory | default "256Mi" }}
            cpu: {{ .Values.operator.resources.requests.cpu | default "100m" }}
          limits:
            memory: {{ .Values.operator.resources.limits.memory | default "512Mi" }}
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      {{- if .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml .Values.operator.nodeSelector | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.tolerations }}
      tolerations:
        {{- toYaml .Values.operator.tolerations | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.affinity }}
      affinity:
        {{- toYaml .Values.operator.affinity | nindent 8 }}
      {{- end }}
      {{- if $mounts }}
      volumes:
        {{- if include "holmes.apiAuth.enabled" . }}
        {{- include "holmes.apiAuth.clientVolume" . | nindent 8 }}
        {{- end }}
        {{- if $caSecret }}
        - name: holmes-api-ca
          secret:
            secretName: {{ $caSecret }}
            optional: true
            items:
              - key: {{ $caKey }}
                path: {{ $caKey }}
        {{- end }}
      {{- end }}
{{- end }}
