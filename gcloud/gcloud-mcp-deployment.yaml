# gcloud MCP Server Deployment with Workload Identity
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcloud-mcp-config
  namespace: default
data:
  GCP_PROJECT: ""  # Will be auto-detected if using Workload Identity
  GCLOUD_REGION: "us-central1"  # Change to your preferred region
  GOOGLE_CLOUD_PROJECT: ""  # Will be auto-detected if using Workload Identity
  CLOUDSDK_CORE_DISABLE_PROMPTS: "true"
  CLOUDSDK_METRICS_ENVIRONMENT: "kubernetes"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcloud-mcp-server
  namespace: default
  labels:
    app: gcloud-mcp-server
    component: mcp
    provider: gcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcloud-mcp-server
  template:
    metadata:
      labels:
        app: gcloud-mcp-server
        component: mcp
        provider: gcp
    spec:
      serviceAccountName: gcloud-mcp-sa  # Service account for Workload Identity

      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: gcloud-mcp
        # Update this to your registry after building
        image: YOUR_REGISTRY/gcloud-mcp-server:latest
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8000
          protocol: TCP

        env:
        # GCP configuration
        - name: GCP_PROJECT
          valueFrom:
            configMapKeyRef:
              name: gcloud-mcp-config
              key: GCP_PROJECT
        - name: GOOGLE_CLOUD_PROJECT
          valueFrom:
            configMapKeyRef:
              name: gcloud-mcp-config
              key: GOOGLE_CLOUD_PROJECT
        - name: GCLOUD_REGION
          valueFrom:
            configMapKeyRef:
              name: gcloud-mcp-config
              key: GCLOUD_REGION
        - name: CLOUDSDK_CORE_DISABLE_PROMPTS
          valueFrom:
            configMapKeyRef:
              name: gcloud-mcp-config
              key: CLOUDSDK_CORE_DISABLE_PROMPTS
        - name: CLOUDSDK_METRICS_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: gcloud-mcp-config
              key: CLOUDSDK_METRICS_ENVIRONMENT

        # Workload Identity token path
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/var/run/secrets/workload-identity/token"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"

        # Health checks
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        # Volume mount for Workload Identity token (if needed)
        volumeMounts:
        - name: workload-identity-token
          mountPath: /var/run/secrets/workload-identity
          readOnly: true

      # Volume for Workload Identity token (optional, depends on setup)
      volumes:
      - name: workload-identity-token
        projected:
          sources:
          - serviceAccountToken:
              audience: https://iam.googleapis.com/
              path: token
              expirationSeconds: 3600

---
# Network Policy (optional but recommended for security)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gcloud-mcp-server-netpol
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: gcloud-mcp-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: holmes  # Adjust based on your Holmes deployment labels
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - podSelector: {}  # Allow communication within namespace
    ports:
    - protocol: TCP
      port: 53  # DNS
    - protocol: UDP
      port: 53  # DNS
  - to:
    - namespaceSelector: {}  # Allow to all namespaces for kube-dns
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0  # Allow external for GCP API calls
        except:
        - 169.254.169.254/32  # Block metadata service (use Workload Identity instead)
