mcp_servers:
  gcloud:
    description: "GCP MCP Server - comprehensive Google Cloud Platform service access. Allows executing any gcloud CLI commands."
    url: "http://gcloud-mcp-server.default.svc.cluster.local:8000"
    mode: "sse"  # Can also use "streamable-http"
    llm_instructions: |
      IMPORTANT: When investigating issues related to GCP resources or GKE workloads, you MUST actively use this MCP server to gather data rather than providing manual instructions to the user.

      ## Investigation Principles

      **ALWAYS follow this investigation flow:**
      1. First, gather current state and configuration using GCP APIs
      2. Check Cloud Audit Logs for recent changes that might have caused the issue
      3. Collect metrics and logs from Cloud Monitoring/Logging if available
      4. Analyze all gathered data before providing conclusions

      **Never say "check in GCP console" or "verify in GCP" - instead, use the MCP server to check it yourself.**

      ## Core Investigation Patterns

      ### For ANY connectivity or access issues:
      1. ALWAYS check the current configuration of the affected resource (GCE, Cloud SQL, Load Balancer, etc.)
      2. ALWAYS examine firewall rules and VPC network configuration
      3. ALWAYS query Cloud Audit Logs for recent configuration changes
      4. Look for patterns in timing between when issues started and when changes were made

      ### When investigating GKE issues:
      - Get cluster details: `gcloud container clusters describe CLUSTER --region=REGION`
      - Check node pools: `gcloud container node-pools list --cluster=CLUSTER --region=REGION`
      - Examine cluster logs: `gcloud logging read "resource.type=k8s_cluster AND resource.labels.cluster_name=CLUSTER"`
      - Check workload logs: `gcloud logging read "resource.type=k8s_pod"`
      - Review recent GKE operations: `gcloud container operations list --region=REGION`

      ### When investigating Cloud SQL issues:
      - Get instance details: `gcloud sql instances describe INSTANCE`
      - Check authorized networks: Look at the settings.ipConfiguration
      - Review recent operations: `gcloud sql operations list --instance=INSTANCE`
      - Check flags and configuration: `gcloud sql instances describe INSTANCE --format="get(settings)"`
      - Look for backup/maintenance windows that might affect availability

      ### When investigating configuration changes:
      - Query Cloud Audit Logs: `gcloud logging read "logName:cloudaudit.googleapis.com" --limit=50`
      - Filter by resource: `gcloud logging read "resource.type=gce_instance AND resource.labels.instance_id=INSTANCE_ID"`
      - Filter by time: `gcloud logging read "timestamp>='2024-01-01T00:00:00Z'"`
      - Look for specific operations: `gcloud logging read "protoPayload.methodName:'compute.firewalls.delete'"`
      - Identify who made changes: Check protoPayload.authenticationInfo.principalEmail

      ### When investigating Compute Engine issues:
      - Describe instances: `gcloud compute instances describe INSTANCE --zone=ZONE`
      - Check instance groups: `gcloud compute instance-groups list`
      - Review firewall rules: `gcloud compute firewall-rules list`
      - Check VPC networks: `gcloud compute networks describe NETWORK`
      - Examine routes: `gcloud compute routes list`
      - Check recent operations: `gcloud compute operations list`

      ### For networking issues:
      - List VPCs: `gcloud compute networks list`
      - Check subnets: `gcloud compute networks subnets list`
      - Review firewall rules: `gcloud compute firewall-rules list --filter="network:NETWORK"`
      - Check Cloud NAT: `gcloud compute routers nats list --router=ROUTER --region=REGION`
      - Review VPC peering: `gcloud compute networks peerings list --network=NETWORK`
      - Check Private Service Connect: `gcloud compute addresses list --global --filter="purpose:VPC_PEERING"`

      ### For load balancer issues:
      - List load balancers: `gcloud compute backend-services list`
      - Check health checks: `gcloud compute health-checks list`
      - Review URL maps: `gcloud compute url-maps list`
      - Check SSL certificates: `gcloud compute ssl-certificates list`
      - Review backend health: `gcloud compute backend-services get-health BACKEND_SERVICE --global`

      ### For IAM and permissions issues:
      - Check project IAM policy: `gcloud projects get-iam-policy PROJECT`
      - List service accounts: `gcloud iam service-accounts list`
      - Check specific SA permissions: `gcloud projects get-iam-policy PROJECT --flatten="bindings[].members" --filter="bindings.members:SA_EMAIL"`
      - Test permissions: `gcloud iam service-accounts get-iam-policy SA_EMAIL`
      - Review recent IAM changes in audit logs

      ### For monitoring and logging:
      - Query logs: `gcloud logging read "FILTER" --limit=100`
      - List metrics: `gcloud monitoring metrics-descriptors list`
      - Get metric data: `gcloud monitoring time-series list --filter='metric.type="compute.googleapis.com/instance/cpu/utilization"'`
      - Check alerting policies: `gcloud alpha monitoring policies list`
      - Review uptime checks: `gcloud monitoring uptime-checks list`

      ### For storage issues:
      - List buckets: `gcloud storage buckets list`
      - Check bucket permissions: `gcloud storage buckets get-iam-policy BUCKET`
      - Review bucket configuration: `gcloud storage buckets describe BUCKET`
      - Check object access: `gcloud storage objects describe gs://BUCKET/OBJECT`

      ### For BigQuery issues:
      - List datasets: `gcloud alpha bq datasets list`
      - Check dataset access: `gcloud alpha bq datasets describe DATASET`
      - Review recent jobs: `gcloud alpha bq jobs list`
      - Check table schema: `gcloud alpha bq tables describe TABLE --dataset=DATASET`

      ## Key Commands for Root Cause Analysis

      ### Cloud Audit Log Investigation (ALWAYS use when troubleshooting):
      ```
      # Find all recent changes
      gcloud logging read "logName:cloudaudit.googleapis.com AND timestamp>='1 hour ago'" --limit=50

      # Find changes to specific resource type
      gcloud logging read "resource.type=gce_firewall_rule" --limit=20

      # Find who made changes
      gcloud logging read "protoPayload.authenticationInfo.principalEmail:USER_EMAIL" --limit=20

      # Find specific operations
      gcloud logging read "protoPayload.methodName:'compute.instances.delete'" --limit=10
      ```

      ### Resource State Verification:
      - Always get the current state before checking what changed
      - Compare timestamps of issues with timestamps of changes in audit logs
      - Look for correlation between configuration changes and issue manifestation

      ## Important Guidelines:
      - If you encounter any GCP resource in the investigation, immediately fetch its details using gcloud commands
      - Don't assume or guess configurations - retrieve actual data
      - When you see connection timeouts or permission denied errors, immediately check firewall rules, IAM policies, and audit logs
      - Always include relevant timestamps when querying for historical data
      - Use Cloud Monitoring and Cloud Logging for detailed metrics and logs

      Remember: Your goal is to gather evidence from GCP, not to instruct the user to gather it. Use the MCP server proactively to build a complete picture of what happened.

      ## Available gcloud Command Groups:
      All gcloud CLI commands are available, including but not limited to:
      - compute: GCE instances, disks, networks, firewall rules
      - container: GKE clusters, node pools, operations
      - sql: Cloud SQL instances and databases
      - storage: Cloud Storage buckets and objects
      - iam: Service accounts and IAM policies
      - logging: Cloud Logging queries
      - monitoring: Cloud Monitoring metrics and alerts
      - projects: Project configuration and IAM
      - app: App Engine services
      - run: Cloud Run services
      - functions: Cloud Functions
      - pubsub: Pub/Sub topics and subscriptions
      - redis: Memorystore Redis instances
      - filestore: Filestore instances
      - bigtable: Bigtable instances and clusters
      - spanner: Cloud Spanner instances and databases
      - bigquery/bq: BigQuery datasets and tables
      - kms: Cloud KMS keys and keyrings
      - secrets: Secret Manager secrets
      - dns: Cloud DNS zones and records
      - endpoints: Cloud Endpoints services
      - healthcare: Healthcare API resources
      - ai-platform: Vertex AI resources
