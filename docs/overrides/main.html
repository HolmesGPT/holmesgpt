{% extends "base.html" %}

{% block announce %}
<div class="md-banner">
  <div class="md-banner__inner">
    📅 <a href="https://docs.google.com/document/d/1q3L2iUd8tNu-NmZ6QIVOJcCLHrile9CC5QguOGTn_tg/edit?tab=t.0#heading=h.ihdnrt5bstrv">Join our next community meetup!</a>
  </div>
</div>
{% endblock %}

{% block outdated %}
  <div class="md-banner md-banner--warning" data-md-component="outdated" hidden>
    <div class="md-banner__inner md-typeset">
      You're viewing the <strong>development</strong> version of the docs (unreleased changes).
      <a href="/latest/">
        <span class="twemoji">{% include ".icons/material/arrow-right.svg" %}</span>
        <strong>Switch to <span id="latest-version-label">the latest stable release</span></strong>
      </a>
    </div>
  </div>
  <script>
    fetch("/versions.json").then(function(r){ return r.json() }).then(function(versions){
      var latest = versions.find(function(v){ return v.aliases.indexOf("latest") !== -1 });
      if (latest) {
        var el = document.getElementById("latest-version-label");
        if (el) el.textContent = latest.version;
      }
    }).catch(function(){});
  </script>
{% endblock %}
