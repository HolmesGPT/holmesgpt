{% extends "base.html" %}

{% block outdated %}
{% if config.extra.version %}
  <div data-md-color-scheme="slate" data-md-component="outdated" hidden>
    <div class="md-banner md-banner--warning">
      <div class="md-banner__inner md-typeset">
        You're viewing the <strong>development</strong> version of the docs. Some features may not be released yet.
        <a href="{{ '../' ~ base_url }}">
          <strong>Switch to the latest stable version.</strong>
        </a>
      </div>
    </div>
  </div>
{% endif %}
{% endblock %}
